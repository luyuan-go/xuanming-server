# Pandora inventory 服务开发期配置(W5 ③,2026-06-18)。
#
# - gRPC :20015 / HTTP :21015(仅 /metrics)
# - MySQL 强依赖(pandora_trade 库:player_wallet + player_items + inventory_ledger,
#   发放 / 使用 / 出售幂等 inventory_ledger uk,不变量 §9.7)
# - dev: enable_reflection=true 便于 grpcurl 联调

server:
  grpc:
    network: tcp
    addr: ":20015"
    timeout: "15s"              # demo:弱网/本机抖动下 unary RPC 放宽;prod 再按接口收紧
    enable_reflection: true     # dev 开;prod 关(零值=false)
    max_conn_age: "15m"         # 达龄 GOAWAY 重拨,滚动更新时流量能滚到新副本(zero-downtime §6.2)
  http:
    network: tcp
    addr: ":21015"

node:
  # node_id 必须与 mail 不同(inventory=1,mail=2)—— instance_id 是跨服务铸造的
  # ID 空间,两服务同 node_id 会发出逐位相同的号,汇进同一背包段时被 fail-closed 拒掉。
  # 理由全文见 services/social/mail/etc/mail-dev.yaml 同处注释。
  node_id: 1
  # Redis:会话现行性门只读 login 会话权威 pandora:sess(R5 复审 P0-1,共享实例)。
  redis_client:
    host: "127.0.0.1:6380"
    db: 0
    dial_timeout: "2s"
  # MySQL:dev 连本机 docker mysql 的 pandora_trade 库(强依赖,DSN 必填)。
  mysql_client:
    dsn: "pandora:pandora_dev_pwd@tcp(127.0.0.1:3307)/pandora_trade?parseTime=true&loc=UTC&charset=utf8mb4&collation=utf8mb4_0900_ai_ci"
    max_open_conns: 32
    max_idle_conns: 8
    conn_max_lifetime: "30m"
    ping_timeout: "3s"

# inventory 的类型、堆叠、出售与局内可消费规则必须和 UE 使用同一份 item 表。
# 缺目录/缺表/checksum 错误会拒绝启动，不再回退到 2001/3001 样例。
config_table:
  dir: "../../../configtable/dist"

inventory:
  # 保留期清理(CLAUDE.md §9 不变量 24:只增表必须有界,失效数据最多保留 90 天)。
  # inventory_ledger 超期流水 / auction_escrow closed 超期行由 sweep 周期批量删除;
  # 多副本各自跑,DELETE 幂等无需锁。缺省即以下默认值,列出便于运维一眼看到。
  sweep_interval: "5m"
  sweep_batch: 500
  ledger_retention_days: 90   # 幂等流水保留天数(≫ 一切重试窗口;≥ mail 可领窗口闭环见 conf.go)
  escrow_retention_days: 90   # closed 托管行保留天数(active 行永不清理)

  # capacity: 装备实例背包格子容量(W5 ④)。**<=0 就是"实例背包未启用"**——main.go 不装配
  # snowflake,GrantInstances 一律返回 ErrInvalidArg("instance inventory not enabled"),
  # 表现为调用方拿到 code=4 而 gRPC 本身 rpc_ok。2026-08-06 排查「战斗掉落进不了背包」时
  # 定谳:本键从来没配过(不是漂移),导致 bag-domain.md phase 0「权威在 inventory、掉落经
  # battle_result 翻译」这条链的落地端一直是断的,player_item_instance 与 inventory_ledger
  # 都是 0 行(= 一次都没成功发放过)。
  # 取值 200 的依据:internal/data/budgets.go 把 player_item_instance 的行数预算写成
  # planPlayers * 200 * 3(注释「行数 ≈ 玩家数 × 背包容量」),这份容量预算就是按 200 定的;
  # 配别的值会让 dbguard 预算与实际口径对不上。
  # 注意 InventoryConf.Validate() **不校验本键**,写成 0 / 负数 / 拼错键名都不报错、服务照常
  # 启动、行为与没配一模一样。唯一判据是启动日志出现 `instance_bag_enabled capacity=200`。
  capacity: 200

  # 装备鉴定规则由 configtable equipment_affix + item.identify_pool_id 同源热更；
  # YAML 不再保留生产默认池，缺表/缺池在启动与热更边界 fail-closed。

# 背包域(pandora.bag.v1,bag-domain.md;phase 1 由本进程承载)。
# dsn 为空 = 未启用(不注册 BagService)。dev 直接开启联调;
# 生产启用前必须先重放 14-bag-tables.sql(启动 schema gate 会 fail-fast 提示)。
bag:
  dsn: "pandora:pandora_dev_pwd@tcp(127.0.0.1:3307)/pandora_bag?parseTime=true&loc=UTC&charset=utf8mb4&collation=utf8mb4_0900_ai_ci"
  owner_addr: "127.0.0.1:20017" # 集群生成器改写为 owner:20017；背包写路径 fail-closed 校验 owner
  # 额度(五要件④,反作弊封顶;必须显著高于合法玩法产出)
  max_journal_batch: 64
  max_items_per_op: 64
  hourly_journal_quota: 2000
  # 段基础容量(未配置的段 fail-closed；身上容量用于 LoadBag/扩容规则，物品权威仍在 DS)
  section_capacities:
    - bag_type: 0        # 身上(基础容量;扩容规则校验与 LoadBag 权威下发使用)
      capacity: 100
    - bag_type: 1        # 仓库
      capacity: 200
    - bag_type: 100      # 活动背包样例段(联调用;活动开启由运营写 bag_generation)
      capacity: 50
  journal_retention_days: 90

# 会话现行性门(R5 复审 P0-1,INC-20260722-004):校验客户端面请求 jti == login 会话权威
# (pandora:sess,node.redis_client 指向的共享 Redis)当前一代,顶号后旧 JWT 立即失效。
# dev 宽松档 require=false(gate 已装配时顶号/登出照常拒;仅漏配端点时跳过判定);
# -Prod 产物由 gen_cluster_config.ps1 机械置 true(漏配端点拒启)。
session_gate:
  require: false
