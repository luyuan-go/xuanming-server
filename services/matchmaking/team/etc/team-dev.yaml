# Pandora team 服务开发期配置(W3 ⑦,2026-06-05)。
#
# - gRPC :20010 / HTTP :21010(仅 /metrics)
# - Redis 强依赖(队伍状态 WATCH/MULTI/EXEC 乐观锁)
# - Kafka 用于发布 pandora.team.update 事件(push 服务订阅)
# - W3 ⑦ 起 duration 字段用 pkg/config.Duration,yaml 可直接写 "60s"
# - dev: enable_reflection=true 便于 grpcurl 联调

server:
  grpc:
    network: tcp
    addr: ":20010"
    timeout: "15s"              # demo:弱网/本机抖动下 unary RPC 放宽;prod 再按接口收紧
    enable_reflection: true     # dev 开;prod 关(零值=false)
    max_conn_age: "15m"         # 达龄 GOAWAY 重拨,滚动更新时流量能滚到新副本(zero-downtime §6.2)
  http:
    network: tcp
    addr: ":21010"

node:
  node_id: 1
  redis_client:
    host: "127.0.0.1:6380"
    db: 0
    dial_timeout: "2s"
    read_timeout: "1s"
    write_timeout: "1s"

# kafka producer 配置(发布 pandora.team.update,push 服务订阅消费)
# brokers 9093 = Pandora 端口规划(与 vanilla 9092 区分)
kafka:
  brokers: ["127.0.0.1:9093"]
  dial_timeout: "2s"
  write_timeout: "5s"
  idempotent: true

team:
  # invite_ttl: 邀请令牌有效期(R6 AcceptInvite 时校验)
  invite_ttl: "60s"
  # disbanded_retention: 解散队伍的 Redis key 保留时长(客户端可查询最终状态)
  disbanded_retention: "5m"
  # active_ttl: 活跃队伍 Redis key 生命周期(无写操作超时即过期,防僵尸队伍)
  active_ttl: "60m"
  # max_members: MOBA 5v5,一队最多 5 人
  max_members: 5
  # optimistic_retry: WATCH/MULTI/EXEC 冲突时最大重试次数
  optimistic_retry: 3
  # rate_quota_per_min: 申请/邀请的 per-player 每分钟频率配额(anti-abuse §6 筬 6 项)。
  #   与 §9.18 的 pending 总量上限正交:总量限「同时挂多少」,本值限「刷多快」。
  #   显式写出而不依赖代码默认值:Go 与 Python 两栈各持一份默认(12),只改一侧
  #   会在灰度期让同一玩家在两种副本上限额不同且两边日志都正常。
  rate_quota_per_min: 60
  # matchmaker_addr: matchmaker gRPC 直连地址——成员离队/被踢时联动撤销其匹配票据
  # (弱依赖,留空则不联动)
  matchmaker_addr: "127.0.0.1:20011"
  # team→login 内部批量解析角色展示编号；只传 player_id，完整请求体做 HMAC 绑定。
  # 与 login-dev.yaml 的 player_no_resolve_auth_* 完全一致，且不得复用其它服务密钥。
  player_no_resolver_addr: "127.0.0.1:20001"
  player_no_resolver_auth_secret: "pandora-dev-team-player-no-auth-key-v1!"
  player_no_resolver_auth_audience: "login:player-no"
  # team→player 内部批量解析角色名；与 player-dev.yaml 入站配置一致，独立于 DS Bearer。
  player_name_resolver_addr: "127.0.0.1:20002"
  player_name_resolver_auth_secret: "pandora-dev-team-player-name-auth-key-v1!"
  player_name_resolver_auth_audience: "player:name"
  # team→matchmaker 调 ResolvePlayerMatchContext 的服务鉴权(caller 固定签 "team")。
  # 用于入队闸门(fail-closed)与招募列表复核;不签名会被 matchmaker 拒(code=7),
  # 表现为"获取队伍恒空 + 申请入队恒失败"。
  # secret 必须等于 matchmaker-dev.yaml 的 match.team_resume_auth_secret,
  # 且必须与 login 那把 match_resume_auth_secret 不同(独立信任域)。
  match_resume_auth_secret: "pandora-dev-team-resume-auth-key-v1!"
  match_resume_auth_audience: "matchmaker:5v5_ranked"
  # ── 反方向:验 matchmaker 调 BeginTeamMatch / EndTeamMatch(INC-20260813-001 A-13)──
  # systemOnly 只证明「没带玩家 JWT」,集群内任何 Pod 都满足;而这两个方法一个能给任意队伍
  # 上 roster 租约(反复调 = 让那支队伍永远开不了局),一个能把任意队伍打回 FORMING。
  #
  # ⚠️ 必须与上面那把 match_resume_auth_secret **不同** —— 那把是 team 签**出站**用的,
  # 共用等于让任一方能冒充另一方。对应 matchmaker 的 team_call_auth_secret。
  #
  # 三档:留空=不验;配了+require=false(观察期,验不过只 WARN 放行);require=true=强制。
  # 上线顺序「两边配密钥 → 观察 team_match_call_auth_observed 归零 → 翻 require」,
  # 每一步单独都安全,不存在「谁必须先上线」(§9.21)。
  match_call_auth_secret: "pandora-dev-match-call-auth-key-v1!!"
  match_call_auth_audience: "team"
  # dev 直接强制:本机两侧同时起,没有共存窗口,开着才能真正测到这道门。
  match_call_auth_require: true

  # locator_addr: player_locator gRPC 直连地址,离线观察的判定依据来源。
  locator_addr: "127.0.0.1:20006"

  # offline_leave: 队员离线超时自动移出队伍。
  #
  # 2026-08-06 起可以打开:matchmaker 组票已改走 TeamService.BeginTeamMatch,在 team
  # 自己的乐观锁内冻结名单,摘人在同一把锁内看到租约即推迟 —— 与 StartMatch 的共用
  # roster fence 已就位,TOCTOU 已消除(不是收敛)。dev 开启用于端到端验证;
  # prod 模板仍默认关闭,由部署方按启用清单显式打开。
  #
  # 要有秒级时效还需同时开 locator 的 departure_event.enabled(见 locator-dev.yaml);
  # 只开这一个会退化成「有人打开组队面板才复查」的纯兜底档(启动时会打 WARN)。
  #
  # threshold 为什么是 180s(别随手调小,推导见 conf.go OfflineLeaveConf 注释):
  #   一个会回来的玩家,从信号恢复到重新出现在 locator 里,保守要 30~60s
  #   (旧 Controller 清退 + Travel + Hub 地图加载 + Admission);低于这个数会踢掉
  #   本来能回来的人。再叠上要容忍的弱网失联时长(地铁/隧道 ~2 分钟)得到 180s。
  #   另外还要记得:静默掉线本身要 60~90s 才被观测到,玩家实际被容忍 ≈ 阈值 + 60~90s。
  offline_leave:
    enabled: true
    threshold: "180s"
    check_interval: "15s"
    budget: 200
    kafka_partitions: 3

# 会话现行性门(R5 复审 P0-1,INC-20260722-004):校验客户端面请求 jti == login 会话权威
# (pandora:sess,node.redis_client 指向的共享 Redis)当前一代,顶号后旧 JWT 立即失效。
# dev 宽松档 require=false(gate 已装配时顶号/登出照常拒;仅漏配端点时跳过判定);
# -Prod 产物由 gen_cluster_config.ps1 机械置 true(漏配端点拒启)。
session_gate:
  require: false

# DS 回调令牌校验(verify-only,2026-08-17 入列;先例与档位说明见 player-dev.yaml 同节点)。
#
# 为什么 team 需要它:GetPlayerTeam 是 DS 出生编制专用的东西向反查,挂在 Envoy DS 面,
# 该监听器没有 jwt_authn,callerID 恒为 0 —— systemOnly 只能挡「带玩家 JWT 的客户端」,
# 挡不住「任意能连 DS 面或直连 20010 的进程查任意玩家在哪支队」。service 层的
# dsGuard.Check(RequireToken) 早已接好,但本节点缺席时守卫为 nil、Check 恒放行(纸面门)。
# secret 与 ds_allocator / hub_allocator 的 ds_auth.secret 同值(它们签,这里验);
# 与玩家面 jwt.secret 严格分域(online_manifest_contract 硬拒相交发布)。
ds_auth:
  mode: "permissive"
  authority_mode: "legacy"
  secret: "pandora-dev-jwt-secret-change-me-32!"
