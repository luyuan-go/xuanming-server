# Pandora matchmaker **PVE 实例**配置(选副本 / PVP+PVE 两种匹配,2026-07-06)。
#
# 与 matchmaker-dev.yaml(PVP 实例)是**同一个二进制、不同部署**:
# 设计既定「一个 game_mode 一个 matchmaker 部署」(decision-revisit-matchmaker-single-writer.md),
# 撮合池按 game_mode 命名空间隔离(pandora:match:<mode>:queue),两实例共用同一 Redis 互不串池。
#
# PVE 入口语义 = 「组好队 / 单人直接进副本」(大厂标准 walk-in 路径):
#   enable_solo_match: true → 每张票(单人或整队)立即成局、跳过确认、直接拉 Battle DS,
#   不与陌生人撮合。副本由客户端 StartMatchRequest.map_id 选(经票→局→DS PANDORA_MAP_ID)。
#   以后若要「PVE 匹配补人」,另开撮合式实例或加单边成局逻辑,不影响本实例。
#
# 客户端路由:Envoy 按 header `x-pandora-game-mode: pve` 把 MatchService 请求路由到本实例
# (deploy/envoy/envoy.yaml match_pve_cluster :20018);不带该头 = 默认 PVP 实例(:20011)。
#
# - gRPC :20018 / HTTP :21018(仅 /metrics)(20017 已被 campaign 设计稿预留)
# - node_id 必须与 PVP 实例(1)不同:两实例都产 match_id 流入同一 battle 结算链路,snowflake 防撞

server:
  grpc:
    network: tcp
    addr: ":20018"
    timeout: "60s"              # 普通 RPC 上限；ConfirmMatch 不同步等待 DS，allocation worker 独立推进
                                # (AllocateBattle 是后台 worker 的出站客户端调用,由 ds_allocate_timeout
                                #  管辖,与本入站 server timeout 无关 —— 勿再为冷加载调大本值)
    enable_reflection: true     # dev 开;prod 关(零值=false)
    max_conn_age: "15m"         # 达龄 GOAWAY 重拨,滚动更新时流量能滚到新副本(zero-downtime §6.2)
  http:
    network: tcp
    addr: ":21018"

node:
  # ⚠️ 与 PVP matchmaker(node_id=1)错开,match_id 全局唯一(dev static 模式)。
  # 集群产物走 etcd 模式,由 gen_cluster_config.ps1 让两部署共用 "matchmaker" 命名空间互斥。
  node_id: 2
  redis_client:
    host: "127.0.0.1:6380"
    db: 0
    dial_timeout: "2s"
    read_timeout: "1s"
    write_timeout: "1s"

# kafka producer 配置(发布 pandora.match.progress,push 服务订阅消费)
kafka:
  brokers: ["127.0.0.1:9093"]
  dial_timeout: "2s"
  write_timeout: "5s"
  idempotent: true

# config_table: 策划配置表加载(不变量 §9.15,说明见 matchmaker-dev.yaml)。留空 = 不启用。
config_table:
  dir: "../../../configtable/dist"

match:
  # ds_local_profile: Windows 本机联调档,唯一合法值 local-off-v1;生产/灰度必须留空。
  # 配了 ds_allocator_addr 就要签战斗票,而签/验必须同档:本机 ds_allocator 在 mode=local 下
  # 只接受 legacy,并给 UE DS 注入 PANDORA_DS_LOCAL_PROFILE=local-off-v1 锁进 HS256LocalOff,
  # 不交叉接受 RS256 v2 票。声明本档后 battle 票用 jwt.secret 签 HS256(与 UE 占位密钥同值)。
  # 与 ds_ticket.private_key_file 互斥,同时配置会拒启。
  ds_local_profile: "local-off-v1"
  # team_addr: team 服务 gRPC 直连地址(StartMatch 拉队伍校验 READY);留空跳过校验
  team_addr: "127.0.0.1:20010"
  # 签 matchmaker→team 的 BeginTeamMatch / EndTeamMatch(A-13)。
  # **必须与 team-dev.yaml 的 match_call_auth_secret 一致** —— pve 与 pvp 两个实例
  # 打的是同一台 team,team 侧 require=true 时不配这里会让 PVE 直接开不了局。
  team_call_auth_secret: "pandora-dev-match-call-auth-key-v1!!"
  team_call_auth_audience: "team"
  # allow_missing_team: 留空 team_addr 的显式开关,默认 false(= 留空即启动失败)。
  # 留空的后果是**静默**的:StartMatch 不再校验队伍,对局结束也不再复位准备状态
  # (INC-20260813-001 第一根因)。要跑不带 team 的骨架就显式写 true。
  # allow_missing_team: false
  # ds_allocator_addr: ds_allocator 服务 gRPC 直连地址(成局后拉战斗 DS);留空用 StubDSAllocator
  ds_allocator_addr: "127.0.0.1:20020"
  # ds_allocate_timeout: 调 ds_allocator.AllocateBattle 的客户端超时(默认 60s)。
  # 该 RPC 服务端阻塞等 DS ready 心跳(allocate + ready_wait 300s + 余量)，
  # 必须 ≥ ds_allocator 侧 server.grpc.timeout(330s)，否则客户端先超时白等。
  # 2026-08-04 与 ds_allocator 的 editor 冷启动放宽同步上调(见该文件 ready_wait_timeout 注释)。
  ds_allocate_timeout: "330s"
  # locator_addr: player_locator 服务 gRPC 直连地址(位置上报 + StartMatch 前置查战斗态)
  locator_addr: "127.0.0.1:20006"
  match_resume_auth_secret: "pandora-dev-match-resume-auth-key-v1!"
  match_resume_auth_audience: "matchmaker:pve_coop"
  # Team→Matchmaker 复用 ResolvePlayerMatchContext 做入队闸门与招募列表剪枝。
  # 与上面 Login 那把**故意分开**:共用一把等于两个服务可互相冒充。
  # 必须等于 team-dev.yaml 的 team.match_resume_auth_secret(pve 与 pvp 打同一台 team)。
  # 漏配的后果是静默的:启动只 WARN team_resume_service_auth_disabled,
  # 之后 ListOpenTeams 恒空、team 入队被 ERR_UNAVAILABLE fail-closed。
  team_resume_auth_secret: "pandora-dev-team-resume-auth-key-v1!"
  allocation_abort_auth_secret: "pandora-dev-allocation-abort-auth-key-v1!"
  allocation_abort_auth_audience: "ds-allocator:battle-allocation-abort"
  battle_gate_fail_open: false
  # liveness_gate_enabled: locator 在线判定两道门(队列扫死票 + 成局最终门)。
  # ❗ INC-20260724-001 后回退为 false(= conf.go 代码默认值):MATCHING 投影无续期写者也无释放通道,
  # 成局超过 locator TTL(30s)后全员必然被判离线(本事故实测 31.07s 判死,玩家静止不动亦然)。
  # 完整机械证明、重开前置与决策待办见 matchmaker-dev.yaml 同项注释。
  liveness_gate_enabled: false
  # start_presence_grace: StartMatch 在线闸的宽限窗(INC-20260813-001)。
  # 与上面两道门的关键差别:判「离开了多久」而不是「此刻查不查得到」,因此不存在那两道门的
  # 结构性假阳性。完整说明见 matchmaker-dev.yaml 同项注释。**负值关闭整道闸**。
  start_presence_grace: "30s"
  # queue_absence_reap_after: 排队票离线回收判死窗(INC-20260814-001 隔夜幽灵票;
  # PVE walk-in 票同样覆盖——solo 成局前也过同一道复查)。完整说明见 matchmaker-dev.yaml
  # 同项注释。**负值关闭**。
  queue_absence_reap_after: "120s"
  # map_id: PVE 默认副本(客户端 StartMatchRequest.map_id=0 时的兜底;对齐 g_关卡.xlsx,7=SonglinTown 松林镇副本)
  map_id: 7
  # game_mode: PVE 撮合池命名空间 + 透传 ds_allocator(DS env PANDORA_GAME_MODE / Agones label)
  game_mode: "pve_coop"
  # confirm_timeout: solo 直进路径跳过确认期,此值不生效;保留默认防误用
  confirm_timeout: "15s"
  # match_interval: 后台循环扫描间隔(solo 路径也由它驱动开局)
  match_interval: "2s"
  ticket_ttl: "30m" # 仅显式终态后的留存；非终态 ticket/claim 持久
  match_ttl: "30m"  # 仅显式终态后的留存；非终态 match 持久
  # team_size: PVE 单队人数上限(1~5 人整队直进;StartMatch 拒绝超编队伍)
  team_size: 5
  # walk_in: PVE 核心开关——每张票(单人/整队)立即成局直接拉 DS,不撮合不确认。
  # 「组好队直接进副本」的 walk-in 标准路径;PVP 实例保持 false 走撮合。
  # (2026-07-25 由 enable_solo_match 正名;旧键仍被兼容读取,新配置一律用 walk_in)
  walk_in: true
  # auto_confirm_match: solo 路径本就跳过确认,此值不生效;保留 true 防误配
  auto_confirm_match: true
  # MMR 窗口参数:solo 直进不撮合,不生效;保留默认
  mmr_base_window: 200
  mmr_widen_per_sec: 20
  mmr_max_window: 2000
  optimistic_retry: 3

# jwt: 给战斗 DS 票据签名(battle DSTicket,不变量 §3 短时效 5min)
# secret/issuer/audience 必须与 login 服务 + Envoy jwt_authn provider 完全一致
jwt:
  issuer: "pandora-login"
  audience: "pandora-client"
  secret: "pandora-dev-jwt-secret-change-me-32!"
  session_ttl: "24h"
  ds_ticket_ttl: "5m"

# 会话现行性门(R5 复审 P0-1,INC-20260722-004):校验客户端面请求 jti == login 会话权威
# (pandora:sess,node.redis_client 指向的共享 Redis)当前一代,顶号后旧 JWT 立即失效。
# dev 宽松档 require=false(gate 已装配时顶号/登出照常拒;仅漏配端点时跳过判定);
# -Prod 产物由 gen_cluster_config.ps1 机械置 true(漏配端点拒启)。
session_gate:
  require: false
