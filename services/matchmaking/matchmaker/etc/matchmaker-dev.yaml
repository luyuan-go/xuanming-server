# Pandora matchmaker 服务开发期配置(W4 ①,2026-06-06)。
#
# - gRPC :20011 / HTTP :21011(仅 /metrics)
# - Redis 强依赖(排队 ZSET + match 状态 WATCH/MULTI/EXEC 乐观锁)
# - Kafka 用于发布 pandora.match.progress 事件(push 服务订阅)
# - team_addr 直连 team 服务拉队伍快照(留空则跳过 team 校验)
# - duration 字段用 pkg/config.Duration,yaml 可直接写 "15s"
# - dev: enable_reflection=true 便于 grpcurl 联调

server:
  grpc:
    network: tcp
    addr: ":20011"
    timeout: "22s"              # 普通 RPC 上限；ConfirmMatch 只持久 CAS ALLOCATING，不同步等待 DS
    enable_reflection: true     # dev 开;prod 关(零值=false)
    max_conn_age: "15m"         # 达龄 GOAWAY 重拨,滚动更新时流量能滚到新副本(zero-downtime §6.2)
  http:
    network: tcp
    addr: ":21011"

node:
  node_id: 1
  redis_client:
    host: "127.0.0.1:6380"
    db: 0
    dial_timeout: "2s"
    read_timeout: "1s"
    write_timeout: "1s"

# kafka producer 配置(发布 pandora.match.progress,push 服务订阅消费)
# brokers 9093 = Pandora 端口规划(与 vanilla 9092 区分)
kafka:
  brokers: ["127.0.0.1:9093"]
  dial_timeout: "2s"
  write_timeout: "5s"
  idempotent: true

# config_table: 策划配置表加载(不变量 §9.15;docs/design/config-table-hotreload.md)。
#   dir 非空 = 启用:启动强依赖加载该目录(manifest.json + 各表 json),失败进程退出;
#   StartMatch 校验 map_id 必须是关卡表战斗类关卡;热更走 ConfigTableAdminService.ReloadConfigTable。
#   dir 留空 / 注释 = 不启用(现行为不变)。dev 直接指仓库 dist(相对服务目录);
#   部署环境用发布脚本落的 <deploy-root>/configtable/active。
config_table:
  dir: "../../../configtable/dist"

match:
  # ds_local_profile: Windows 本机联调档,唯一合法值 local-off-v1;生产/灰度必须留空。
  # 配了 ds_allocator_addr 就要签战斗票,而签/验必须同档:本机 ds_allocator 在 mode=local 下
  # 只接受 legacy,并给 UE DS 注入 PANDORA_DS_LOCAL_PROFILE=local-off-v1 锁进 HS256LocalOff,
  # 不交叉接受 RS256 v2 票。声明本档后 battle 票用 jwt.secret 签 HS256(与 UE 占位密钥同值)。
  # 与 ds_ticket.private_key_file 互斥,同时配置会拒启。
  ds_local_profile: "local-off-v1"
  # team_addr: team 服务 gRPC 直连地址(StartMatch 拉队伍校验 READY);留空跳过校验
  team_addr: "127.0.0.1:20010"
  # allow_missing_team: 留空 team_addr 的显式开关,默认 false(= 留空即启动失败)。
  # 留空的后果是**静默**的:StartMatch 不再校验队伍,对局结束也不再复位准备状态
  # (INC-20260813-001 第一根因)。要跑不带 team 的骨架就显式写 true。
  # allow_missing_team: false
  # ds_allocator_addr: ds_allocator 服务 gRPC 直连地址(全员确认后拉战斗 DS);留空用 StubDSAllocator
  ds_allocator_addr: "127.0.0.1:20020"
  # ds_allocate_timeout: 调 ds_allocator.AllocateBattle 的客户端超时(默认 60s)。
  # 该 RPC 服务端阻塞等 DS ready 心跳(allocate + ready_wait 300s + 余量),
  # 必须 ≥ ds_allocator 侧 server.grpc.timeout(330s),否则客户端先超时白等。
  # 2026-08-24: 本文件此前漏配,回落代码默认 60s —— 而 mode=local + launcher=editor 的
  # 战斗 DS 冷启动(MobaLevel)远超 60s,导致 5v5_ranked 每 60s 被砍一次、无限重分配,
  # 玩家永远卡在「分配战斗服」。matchmaker-pve.yaml 早已配 330s,故 PVE 能进、PVP 不能。
  ds_allocate_timeout: "330s"
  # locator_addr: player_locator 服务 gRPC 直连地址（成局→MATCHING / 就绪→BATTLE 位置上报 + StartMatch 前置查战斗态）;留空不上报也不拦截
  locator_addr: "127.0.0.1:20006"
  # Login→Matchmaker internal resume RPC only. Shared Redis consumes each
  # signed nonce once across replicas.
  match_resume_auth_secret: "pandora-dev-match-resume-auth-key-v1!"
  match_resume_auth_audience: "matchmaker:5v5_ranked"
  # Team→Matchmaker reads the same ResolvePlayerMatchContext method for its join
  # gate and recruiting-list pruning. Independent key from Login's on purpose:
  # one shared secret would let either service impersonate the other.
  # Must equal team-dev.yaml team.match_resume_auth_secret.
  team_resume_auth_secret: "pandora-dev-team-resume-auth-key-v1!"
  # ── 反方向:签 matchmaker→team 的 BeginTeamMatch / EndTeamMatch(A-13)───────────
  # ⚠️ 必须与上面那把**不同**(上面那把是 matchmaker 验**入站**用的,共用等于互相可冒充)。
  # 必须等于 team-dev.yaml 的 team.match_call_auth_secret / match_call_auth_audience。
  # 留空 = 不签名:team 侧按其 match_call_auth_require 决定观察放行还是拒。
  team_call_auth_secret: "pandora-dev-match-call-auth-key-v1!!"
  team_call_auth_audience: "team"
  # Matchmaker→DS allocator signed exact allocation abort only.
  allocation_abort_auth_secret: "pandora-dev-allocation-abort-auth-key-v1!"
  allocation_abort_auth_audience: "ds-allocator:battle-allocation-abort"
  # battle_gate_fail_open: locator 查询失败时"战斗中禁止匹配"检查的降级策略
  #   false（默认，生产安全 / fail-closed）：locator 查询失败则拒绝入队(ERR_UNAVAILABLE)，避免抖动时绕过保护
  #   true（仅本地单服务联调）：只跑 matchmaker、不起 player_locator 时，locator 查询失败仅告警后放行
  # 注意：若本地只单独跑 matchmaker，要么清空上面 locator_addr，要么把此项设为 true，否则 StartMatch 会返回 ERR_UNAVAILABLE
  battle_gate_fail_open: false
  # liveness_gate_enabled: locator 在线判定两道门(队列扫死票 livenessSweep + 成局最终门 findOfflineMembers)。
  # ❗ INC-20260724-001 后回退为 false(= conf.go 代码默认值),原因是这两道门的证据来源结构性失效:
  #   2026-07-08 实机验证的是 **HUB 态**续期(Hub DS 心跳捎带 player_ids),该链确实有效;
  #   但成局最终门查的是**已成局 match 的成员**,他们的 locator 态是 MATCHING(=4),而
  #   RefreshHubLocations 只对 state==3(HUB) 续期(player_locator data/location.go),
  #   MATCHING 记录既无续期写者也无释放通道 ⇒ 成局后 30s 内零真阳性、超过 30s 全员必然假阳性。
  #   事故算术闭合:solo_match_found 13:14:11.347 → match_liveness_failed 13:14:42.417 = 31.07s
  #   (30s locator TTL + 一个 2s 撮合 tick),玩家静止不动也必被判死。
  #   连带:MATCHING key 过期后 locator 无记录,而 RefreshHubLocations 只 EXPIRE 不创建,
  #   该玩家此后对两道门永久"离线",再排队的票据也会被 livenessSweep 误删 ⇒ 两道门一起关。
  # 重开前置(缺一不可):① MATCHING 投影具备续期或释放的完整三段闭环;② 判死证据改用权威信号
  # (§9.22:presence key miss 不能单独证明玩家离开,不得冒充 OFFLINE);③ 具备可秒级回滚的开关。
  # 决策待办见 docs/incidents/2026-07-24-p0-matchmaker-orphan-start-claim-freeze.md 的 D2。
  liveness_gate_enabled: false
  # start_presence_grace: StartMatch 在线闸的宽限窗(INC-20260813-001)。
  # 判据是「距最后一次被 Hub DS 观测在场过去多久」,不是「此刻 locator 查不查得到」——
  # 后者正是上面两道门被关掉的原因。last_alive_ms 由 Hub DS 心跳按 census 全员每 5s 续期,
  # 坐在大厅里的人恒为「刚刚」,真关掉客户端的人才会涨过本窗。
  # 拿不到任何离开基线时判 UNKNOWN 放行(§9.22);locator 查不通按 battle_gate_fail_open 决定。
  # 取值须 >> Hub 心跳周期(5s)且 << team 的 offline_leave.threshold(180s)。**负值关闭整道闸**。
  start_presence_grace: "30s"
  # queue_absence_reap_after: 排队票离线回收的判死窗(INC-20260814-001 隔夜幽灵票)。
  # 非终态 ticket 是持久状态,排队后关客户端既无 CancelMatch 也无任何链路转终态
  # (team offline_leave 刻意不联动且单人队不处理;liveness_gate 已回退关闭),
  # 隔夜旧票会与次日新玩家成局。本回收与 start_presence_grace 同一条证据链
  # (按「离开多久」判,UNKNOWN 放行,presence 查询失败整轮跳过绝不误删),
  # 与 liveness_gate 无关、其关闭时也生效。两处消费:队列 10s 周期扫除 + 成局装箱前复查。
  # 取值须 > start_presence_grace(排队中掉线重连是常态,过小会踢掉正在重连的人)。**负值关闭**。
  queue_absence_reap_after: "120s"
  # map_id: 战斗地图配置 ID(对齐 g_关卡.xlsx,6=MobaLevel MOBA战斗)
  map_id: 6
  # game_mode: 战斗模式标识,透传给 ds_allocator
  game_mode: "5v5_ranked"
  # confirm_timeout: 凑齐 10 人后的确认期时长
  confirm_timeout: "15s"
  # match_interval: 后台撮合循环扫描间隔
  match_interval: "2s"
  # ticket_ttl: 仅显式终态后的票据留存期；QUEUEING/CONFIRM/ALLOCATING/READY 均持久，由 saga 清理
  ticket_ttl: "30m"
  # match_ttl: 仅显式终态后的 match 查询留存期；非终态 match 不靠 TTL 自愈
  match_ttl: "30m"
  # team_size: 本地端到端测试使用 1v1;正式 5v5 改回 5
  team_size: 1
  # walk_in: 即时开局(不撮合直接开局)。PVP 实例必须 false —— 否则每张票都单独开一局,不再凑对手。
  # PVE 实例(matchmaker-pve.yaml)才置 true;单客户端本地联调如需跳过凑人可临时开,联调完改回。
  # (2026-07-25 由 enable_solo_match 正名;旧键仍被兼容读取,新配置一律用 walk_in)
  walk_in: false
  # auto_confirm_match: true = 撮合后跳过确认期直接拉 Battle DS(仅无 UI 的脚本联调用)。
  # 2026-08-17 起 dev 默认 false:LoL 式流程下确认期是「带缺席者开局」的主防线
  # (ready 门槛已删),dev 必须真实走 CONFIRM 弹窗;压测 robot/gatecheck 已支持手动确认。
  auto_confirm_match: false
  # mmr_base_window: 初始 MMR 撮合窗口半宽
  mmr_base_window: 200
  # mmr_widen_per_sec: 每等待 1 秒窗口放宽的 MMR
  mmr_widen_per_sec: 20
  # mmr_max_window: MMR 窗口放宽上限
  mmr_max_window: 2000
  # optimistic_retry: WATCH/MULTI/EXEC 冲突时最大重试次数
  optimistic_retry: 3
  # leader: 后台撮合循环单写者选举(多副本部署必开,防重复成局;
  # 见 docs/design/decision-revisit-matchmaker-single-writer.md)
  #   enabled=false(默认):本副本直接跑撮合循环(单副本 / dev 行为不变)
  #   enabled=true:经 etcd 选举,仅当选副本跑循环,其余副本服务 RPC + 热备
  # leader:
  #   enabled: true
  #   etcd_endpoints: ["127.0.0.1:2379"]
  #   prefix: "/pandora/dev/leader/"
  #   lease_ttl_sec: 15

# jwt: 给战斗 DS 票据签名(battle DSTicket,不变量 §3 短时效 5min)
# secret/issuer/audience 必须与 login 服务 + Envoy jwt_authn provider 完全一致
jwt:
  issuer: "pandora-login"
  audience: "pandora-client"
  secret: "pandora-dev-jwt-secret-change-me-32!"
  session_ttl: "24h"
  ds_ticket_ttl: "5m"

# 会话现行性门(R5 复审 P0-1,INC-20260722-004):校验客户端面请求 jti == login 会话权威
# (pandora:sess,node.redis_client 指向的共享 Redis)当前一代,顶号后旧 JWT 立即失效。
# dev 宽松档 require=false(gate 已装配时顶号/登出照常拒;仅漏配端点时跳过判定);
# -Prod 产物由 gen_cluster_config.ps1 机械置 true(漏配端点拒启)。
session_gate:
  require: false
