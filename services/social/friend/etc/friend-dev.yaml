# Pandora friend 服务开发期配置(2026-06-15)。
#
# - gRPC :20004 / HTTP :21004(仅 /metrics)
# - MySQL 强依赖(pandora_social 库:friendships + friend_requests + blocks)
# - Kafka 弱依赖(生产 pandora.friend.event → push 推送好友请求 / 接受通知)
# - locator 弱依赖(ListFriends 填在线状态;addr 空则全部离线)
# - dev: enable_reflection=true 便于 grpcurl 联调

server:
  grpc:
    network: tcp
    addr: ":20004"
    timeout: "15s"              # demo:弱网/本机抖动下 unary RPC 放宽;prod 再按接口收紧
    enable_reflection: true     # dev 开;prod 关(零值=false)
    max_conn_age: "15m"         # 达龄 GOAWAY 重拨,滚动更新时流量能滚到新副本(zero-downtime §6.2)
  http:
    network: tcp
    addr: ":21004"

node:
  node_id: 1
  # Redis:会话现行性门只读 login 会话权威 pandora:sess(R5 复审 P0-1,共享实例)。
  redis_client:
    host: "127.0.0.1:6380"
    db: 0
    dial_timeout: "2s"
  # MySQL:dev 连本机 docker mysql 的 pandora_social 库(强依赖,DSN 必填)。
  mysql_client:
    dsn: "pandora:pandora_dev_pwd@tcp(127.0.0.1:3307)/pandora_social?parseTime=true&loc=UTC&charset=utf8mb4&collation=utf8mb4_0900_ai_ci"
    max_open_conns: 32
    max_idle_conns: 8
    conn_max_lifetime: "30m"
    ping_timeout: "3s"

kafka:
  brokers: ["127.0.0.1:9093"]
  group_id: "pandora-friend"
  partition_cnt: 4

friend:
  # max_friends: 单玩家好友数量上限(默认 200)
  max_friends: 200
  # locator_addr: player_locator gRPC 地址;空 → ListFriends 不查在线状态(弱依赖)
  locator_addr: "127.0.0.1:20006"
  # 申请列表展示投影：两条 authority 使用 friend caller 的独立 request-bound HMAC。
  player_name_resolver_addr: "127.0.0.1:20002"
  player_name_resolver_auth_secret: "pandora-dev-friend-player-name-auth-key-v1!"
  player_name_resolver_auth_audience: "player:name"
  player_no_resolver_addr: "127.0.0.1:20001"
  player_no_resolver_auth_secret: "pandora-dev-friend-player-no-auth-key-v1!"
  player_no_resolver_auth_audience: "login:player-no"
  # recommend_limit: 单次推荐好友数量(默认 10,硬上限 20,超界收敛到 20)
  recommend_limit: 10
  # recommend_strategies: 推荐策略链,按序召回直到凑够数量;空 → ["mutual","random"]
  # mutual=熟人(共同好友数) random=随机兜底;未来可加 similar_power / same_region
  recommend_strategies: ["mutual", "random"]

# 会话现行性门(R5 复审 P0-1,INC-20260722-004):校验客户端面请求 jti == login 会话权威
# (pandora:sess,node.redis_client 指向的共享 Redis)当前一代,顶号后旧 JWT 立即失效。
# dev 宽松档 require=false(gate 已装配时顶号/登出照常拒;仅漏配端点时跳过判定);
# -Prod 产物由 gen_cluster_config.ps1 机械置 true(漏配端点拒启)。
session_gate:
  require: false
