# ★ 依赖锁 —— **入库**,CI 按它装。
#
# 为什么需要它:CI 每轮都重跑 `uv pip install`,而 pyproject 里全是 `>=` 下界。
# 上游随便发一个新版就能在**仓库零改动**的情况下把流水线打红(或更糟:悄悄换掉
# 一个行为不同的实现)。本仓其它依赖都是钉死的(buf 版本、Go 版本、mysql 镜像 tag、
# pwsh 自举包的 sha256),Python 侧没道理例外。
#
# 重新生成(改了 pyproject 的依赖之后**必须**跑,否则 CI 装的还是旧的):
#     cd python && uv pip compile pyproject.toml --extra dev --extra storage --output-file requirements.lock
#
# CI 用 `uv pip sync requirements.lock` 装依赖,再 `uv pip install -e . --no-deps`
# 把本包接进去 —— sync 会把环境**收敛**到锁文件(多装的也会被卸掉),
# 所以 CI 机上不会攒出与锁文件不一致的历史环境。
