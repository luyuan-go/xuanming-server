apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: pandora-inventory-exact-allow
  namespace: pandora
  annotations:
    pandora.dev/migration-phase: enforce
spec:
  selector:
    matchLabels:
      app: inventory
  action: ALLOW
  rules:
    - from: [{ source: { principals: ["cluster.local/ns/pandora/sa/pandora-auction"] } }]
      to: [{ operation: { methods: ["POST"], paths: ["/pandora.inventory.v1.InventoryService/FreezeForOrder", "/pandora.inventory.v1.InventoryService/EnsureAuctionEscrow", "/pandora.inventory.v1.InventoryService/SettleAuctionMatch", "/pandora.inventory.v1.InventoryService/ReleaseEscrow"] } }]
    - from: [{ source: { principals: ["cluster.local/ns/pandora/sa/pandora-trade"] } }]
      to: [{ operation: { methods: ["POST"], paths: ["/pandora.inventory.v1.InventoryService/SettlePlayerTrade"] } }]
    - from: [{ source: { principals: ["cluster.local/ns/pandora/sa/pandora-mail"] } }]
      to: [{ operation: { methods: ["POST"], paths: ["/pandora.inventory.v1.InventoryService/GrantItems", "/pandora.inventory.v1.InventoryService/GrantInstances"] } }]
    - from: [{ source: { principals: ["cluster.local/ns/pandora/sa/pandora-leaderboard"] } }]
      to: [{ operation: { methods: ["POST"], paths: ["/pandora.inventory.v1.InventoryService/GrantItems"] } }]
    # mission:任务完成/领奖发放(堆叠道具走 GrantItems、装备实例走 GrantInstances;
    # 满包溢出转邮件由 mail 侧领取时再入包,不需要 mission 直连更多方法)。
    - from: [{ source: { principals: ["cluster.local/ns/pandora/sa/pandora-mission"] } }]
      to: [{ operation: { methods: ["POST"], paths: ["/pandora.inventory.v1.InventoryService/GrantItems", "/pandora.inventory.v1.InventoryService/GrantInstances"] } }]
    - from: [{ source: { principals: ["cluster.local/ns/pandora/sa/pandora-battle-result"] } }]
      to: [{ operation: { methods: ["POST"], paths: ["/pandora.inventory.v1.InventoryService/GrantItems", "/pandora.inventory.v1.InventoryService/GrantInstances", "/pandora.inventory.v1.InventoryService/ConsumeBattleItem", "/pandora.inventory.v1.InventoryService/DiscardBattleItem"] } }]
    - from: [{ source: { principals: ["cluster.local/ns/pandora-ingress/sa/pandora-edge-envoy"] } }]
      to: [{ operation: { methods: ["POST"], paths: ["/pandora.inventory.v1.InventoryService/GetInventory", "/pandora.inventory.v1.InventoryService/UseItem", "/pandora.inventory.v1.InventoryService/SellItem", "/pandora.inventory.v1.InventoryService/DiscardItem", "/pandora.inventory.v1.InventoryService/IdentifyItem", "/pandora.inventory.v1.InventoryService/DiscardInstance", "/pandora.inventory.v1.InventoryService/MoveInstance", "/pandora.inventory.v1.InventoryService/SellInstance", "/pandora.inventory.v1.InventoryService/GetShop", "/pandora.inventory.v1.InventoryService/PurchaseShopItem"] } }]
