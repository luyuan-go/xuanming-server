# Pandora Envoy 边缘网关本地开发期配置(W2 ④ + W3 ①,2026-06-05)。
#
# 职责(详见 docs/design/gateway-decision.md §5):
#   1. TLS 终止(:8443):客户端 HTTPS / gRPC-Web → Envoy 内部明文 gRPC
#   2. gRPC-Web → 标准 gRPC 协议转换(envoy.filters.http.grpc_web)
#   3. CORS(联调用,浏览器联调备用;UE FHttpModule 不强需)
#   4. 路由:按 gRPC 全路径 /pandora.<X>.v1.<Y>Service/ 分发到 login / push / team / match 等 cluster
#   5. W3 ①(2026-06-05):envoy.filters.http.jwt_authn 校验 SessionToken
#      - HS256 + 共享 secret(dev 用,生产期切 RS256 + remote_jwks)
#      - issuer=pandora-login / audience=pandora-client,要跟 login 服务 etc/login-dev.yaml 一致
#      - 把 sub claim 提到 x-pandora-player-id 头,业务服 pmw.AuthOptional/Required 直接读
#      - 对 push / team / match 等玩家鉴权 path 强制要 JWT;Login/反射可按规则放行；VerifyDSTicket 仅走 :8444
#
# ⚠️ 协议铁律(详见 docs/design/protocol-ordering-rules.md):
#   - push.PushService/Subscribe 是 server stream,timeout 必须为 0(永不超时)
#   - cluster 端 idle_timeout 也设为 0(防上游被回收)
#
# W3+ 不启用的特性:
#   - envoy.filters.http.ext_authz / rate_limit
#   - mTLS 上行(W3 业务服规模化后再加)
#   - jti 黑名单(由 login.VerifyDSTicket / Logout 业务侧维护)
#
# 上游协议:**业务服默认明文 HTTP/2(h2c)**,本配置必须显式声明 http2_protocol_options,
# 否则 Envoy 会用 HTTP/1.1 调后端,gRPC 415 Unsupported Media Type。

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
  - name: pandora_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8443
    filter_chains:
    - transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          common_tls_context:
            tls_certificates:
            - certificate_chain:
                filename: /etc/envoy/cert.pem
              private_key:
                filename: /etc/envoy/key.pem
            alpn_protocols: [ "h2", "http/1.1" ]
      filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: pandora_hcm
          codec_type: AUTO

          # 全局 idle / request timeout 放开(server stream 长连接)
          # 单 route 再按需收紧(login/team unary demo 15s)
          stream_idle_timeout: 0s
          request_timeout: 0s
          common_http_protocol_options:
            idle_timeout: 0s

          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog

          http_filters:
          # ⭐ 关键:gRPC-Web 字节流 → 标准 gRPC
          - name: envoy.filters.http.grpc_web
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb

          # CORS:浏览器联调备用;UE FHttpModule 不走 CORS
          - name: envoy.filters.http.cors
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors

          # ⭐ 边缘粗闸:未鉴权路径的 local token bucket(anti-abuse-scene-entry.md §4.1/§6 第 5 项)。
          # filter 级只声明 stat_prefix、不配桶 = 默认对所有 route 不限流;
          # 只有显式带 typed_per_filter_config 的 route(下方 login.Login exact 路由)才启用。
          # 必须排在 jwt_authn 之前:目的就是在 HS256 验签计算之前丢弃未鉴权洪水。
          # 为什么不用全局 RLS(ratelimit service):额外有状态服务 + Redis 依赖,§15.3 拒绝;
          # 精确按玩家的配额在业务层(login_fail_quota / per-player 冷却)用已有 Redis 做,
          # 边缘只负责挡「连 session 都没有的洪水」。local bucket 是每 Envoy 进程独立的,
          # 多副本部署时总额 = 桶值 × 副本数,调参须计入(当前单副本)。
          # ⚠️ 改动后部署前由 Codex 跑 `envoy --mode validate -c envoy.yaml`(local_ratelimit 在 v1.38 GA)。
          - name: envoy.filters.http.local_ratelimit
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
              stat_prefix: edge_rl

          # ⭐ 安全:剥离客户端伪造的身份头(必须排在 jwt_authn 之前)。
          # jwt_authn 的 claim_to_headers 只在「命中 rules 的鉴权 path」上覆写 x-pandora-player-id;
          # 对 bypass / allow_missing 的 path(login.Login / reflection),jwt_authn
          # 不跑 claim_to_headers,客户端自带的 x-pandora-player-id / x-pandora-jwt-payload 会原样透传
          # 给上游,上游 pmw.AuthOptional 会信任 → 任意未登录客户端可伪造 player_id(越权)。
          # 这里在入站第一时间无条件删掉这两个头,jwt_authn 随后只在鉴权成功时重新写入权威值;
          # 未鉴权 path 上游拿到的 player_id 恒为 0(匿名),无法被伪造。
          # ⚠️ 改动后部署前由 Codex 跑 `envoy --mode validate -c envoy.yaml` 确认 filter 可用(header_mutation 需 Envoy ≥ 1.25)。
          - name: envoy.filters.http.header_mutation
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
              mutations:
                request_mutations:
                - remove: "x-pandora-player-id"
                # 账号态身份头(两步登录 2026-08-18):与 player-id 同样必须无条件剥离。
                # 客户端面它只由 pandora_account provider 验签成功后重写;DS 面根本不该存在。
                # 漏剥离 = 任何调用方都能自带一个 x-pandora-account-id 打
                # ListAccountRoles / EnterRole,列出并进入**别人账号下的角色**。
                - remove: "x-pandora-account-id"
                - remove: "x-pandora-jwt-payload"
                # DS 网关标记头只属于 :8444 DS 面;客户端面无条件剥离,防公网客户端伪造
                # “我是 DS 面流量”干扰后端 DSCallbackGuard 判定(纵深防御)。
                - remove: "x-pandora-ds-gateway"
                # 受信客户端 IP 头(anti-abuse §6 第 4 项 IP 维度):入站无条件剥离,
                # 随后由 virtual_host 的 request_headers_to_add 用 Envoy 直接观测的
                # 下游地址重写 → 后端看到的值只可能出自 Envoy,客户端不可伪造。
                - remove: "x-pandora-client-ip"

          # ⭐ W3 ①:JWT 鉴权(HS256 + local_jwks)
          # provider pandora_session 用 login 服务签发的 SessionToken,issuer / audience
          # 必须跟 login etc/login-dev.yaml 的 login.jwt 完全一致。
          #
          # rules 列表只列"要鉴权的 path";没列到的 path(login / reflection)
          # 默认放行。bypass 列表用空 requirement 走 allow_missing 语义。
          #
          # claim_to_headers 把 sub claim 写到 x-pandora-player-id 头,业务服 pkg/middleware
          # 读这个头注入 ctx。原始 Authorization 不 forward 给上游(forward=false),
          # 但 sub / exp 等通过 x-pandora-jwt-payload(base64url JSON)向上游透传。
          - name: envoy.filters.http.jwt_authn
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
              providers:
                pandora_session:
                  issuer: "pandora-login"
                  audiences: [ "pandora-client" ]
                  forward: false
                  forward_payload_header: "x-pandora-jwt-payload"
                  claim_to_headers:
                  - header_name: "x-pandora-player-id"
                    claim_name: "sub"
                  local_jwks:
                    # ⚠️ HS256 共享 secret 的 JWKS 形式:kty=oct, alg=HS256, k=base64url(secret)
                    #    base64url("pandora-dev-jwt-secret-change-me-32!") = cGFuZG9yYS1kZXYtand0LXNlY3JldC1jaGFuZ2UtbWUtMzIh
                    #    secret 跟 services/account/login/etc/login-dev.yaml 的 login.jwt.secret 必须保持一致。
                    inline_string: |
                      {"keys":[{"kty":"oct","alg":"HS256","kid":"pandora-dev","k":"cGFuZG9yYS1kZXYtand0LXNlY3JldC1jaGFuZ2UtbWUtMzIh"}]}
                # ⭐ 账号态 provider(两步登录,2026-08-18)。
                #
                # 与 pandora_session **同密钥、不同 audience**,这是整个两步登录的安全根基:
                # 账号态 token 的 sub 是 account_id 而不是 player_id。两者若共用一个 aud,
                # 一张账号 token 就能通过 pandora_session 校验,把 account_id 经
                # claim_to_headers 写进 x-pandora-player-id —— 全后端会拿它当玩家身份,
                # 直接越权(team / chat / inventory / trade 全线)。
                #
                # 所以:
                #   - audiences 必须是 pandora-account(对应 pkg/auth 的 Config.AccountAudience,
                #     那边启动时硬断言它与 Audience 不同);
                #   - claim_to_headers 必须写到**另一个头** x-pandora-account-id,
                #     绝不能复用 x-pandora-player-id。
                #
                # 只有 login 的 ListAccountRoles / EnterRole 两个 path 挂本 provider。
                pandora_account:
                  issuer: "pandora-login"
                  audiences: [ "pandora-account" ]
                  forward: false
                  forward_payload_header: "x-pandora-jwt-payload"
                  claim_to_headers:
                  - header_name: "x-pandora-account-id"
                    claim_name: "sub"
                  local_jwks:
                    # 与 pandora_session 同一把 HS256 密钥(隔离靠 aud,不靠换密钥)。
                    inline_string: |
                      {"keys":[{"kty":"oct","alg":"HS256","kid":"pandora-dev","k":"cGFuZG9yYS1kZXYtand0LXNlY3JldC1jaGFuZ2UtbWUtMzIh"}]}
              rules:
              # ===== 账号态入口(两步登录 2026-08-18):必须挂 pandora_account =====
              # 挂错成 pandora_session 会让账号 token 因 aud 不符被拒(选角界面全线 401);
              # 不挂则完全不验签(rules 未列到的 path 默认放行),上游拿不到
              # x-pandora-account-id,服务层会一律 ErrUnauthorized。两种错法都会「登录后
              # 选不了角」,但日志形态不同 —— 401 是前者,ERR_UNAUTHORIZED 是后者。
              - match:
                  path: "/pandora.login.v1.LoginService/ListAccountRoles"
                requires:
                  provider_name: "pandora_account"
              - match:
                  path: "/pandora.login.v1.LoginService/EnterRole"
                requires:
                  provider_name: "pandora_account"
              # login.Logout / IssueDSTicket 需要 SessionToken(player_id 从 sub claim 来)
              - match:
                  path: "/pandora.login.v1.LoginService/Logout"
                requires:
                  provider_name: "pandora_session"
              - match:
                  path: "/pandora.login.v1.LoginService/IssueDSTicket"
                requires:
                  provider_name: "pandora_session"
              # login.SelectRole 选角(选角权威化 2026-07-08):需要 SessionToken,
              # player_id 从 sub claim 注入 x-pandora-player-id,请求体不信任自报 player_id
              - match:
                  path: "/pandora.login.v1.LoginService/SelectRole"
                requires:
                  provider_name: "pandora_session"
              # login.GetPlayerNo 查本人角色编号(2026-08-10):需要 SessionToken,
              # player_id 从 sub claim 注入 x-pandora-player-id,请求体为空不含自报身份。
              # 必须列在此处——rules 未列到的 path 默认放行(不验签),那样上游拿不到
              # x-pandora-player-id,服务端会一律 ErrUnauthorized。
              - match:
                  path: "/pandora.login.v1.LoginService/GetPlayerNo"
                requires:
                  provider_name: "pandora_session"
              # 已发布客户端的滚动升级兼容入口；与 GetPlayerNo 使用相同鉴权纪律。
              # 删除前必须先证明旧客户端版本已排空。
              - match:
                  path: "/pandora.login.v1.LoginService/GetRegisterNo"
                requires:
                  provider_name: "pandora_session"
              # push.Subscribe 必须带 SessionToken(玩家长连接订阅,W3 ④ kafka 路由依赖 player_id)
              - match:
                  prefix: "/pandora.push.v1.PushService/"
                requires:
                  provider_name: "pandora_session"
              # team 服务所有写 RPC 均需 JWT(player_id 以 JWT sub 为准,R5)
              - match:
                  prefix: "/pandora.team.v1.TeamService/"
                requires:
                  provider_name: "pandora_session"
              # matchmaker 服务所有 RPC 均需 JWT(玩家发起匹配,player_id 经 sub claim 注入 x-pandora-player-id)
              - match:
                  prefix: "/pandora.match.v1.MatchService/"
                requires:
                  provider_name: "pandora_session"
              # friend 服务所有 RPC 均需 JWT(player_id 以 JWT sub 为准,R5)
              - match:
                  prefix: "/pandora.friend.v1.FriendService/"
                requires:
                  provider_name: "pandora_session"
              # mission 服务客户端 RPC 均需 JWT(player_id 以 JWT sub 为准;系统 RPC
              # ReportMissionFacts / CompleteAllMissions 在下方 route 精确 403,不经此处)
              - match:
                  prefix: "/pandora.mission.v1.MissionService/"
                requires:
                  provider_name: "pandora_session"
              # chat 服务所有 RPC 均需 JWT(sender_id / player_id 以 JWT sub 为准,R5)
              - match:
                  prefix: "/pandora.chat.v1.ChatService/"
                requires:
                  provider_name: "pandora_session"
              # guild / group 服务所有 RPC 均需 JWT(player_id 以 JWT sub 为准,R5)
              - match:
                  prefix: "/pandora.guild.v1.GuildService/"
                requires:
                  provider_name: "pandora_session"
              - match:
                  prefix: "/pandora.group.v1.GroupService/"
                requires:
                  provider_name: "pandora_session"
              # trade 服务所有 RPC 均需 JWT(交易双方身份以 JWT sub 为准,R5)
              - match:
                  prefix: "/pandora.trade.v1.TradeService/"
                requires:
                  provider_name: "pandora_session"              # mail 服务面向玩家 RPC 均需 JWT（收件人以 JWT sub 为准；Send* 运营接口路由层 403 + 服务层 systemOnly 双保险拒玩家）
              - match:
                  prefix: "/pandora.mail.v1.MailService/"
                requires:
                  provider_name: "pandora_session"              # leaderboard 客户端只允许读榜;写 RPC 即使经此入口也会被服务层按 player_id 拒绝。
              - match:
                  prefix: "/pandora.leaderboard.v1.LeaderboardService/"
                requires:
                  provider_name: "pandora_session"
              # hub_allocator 仅开放「玩家侧」两个精确 method:列线路 + 主动切线(换实例)。
              # ⚠️ 用 path 精确匹配,绝不能挂整个 /pandora.hub.v1.HubAllocatorService/ 前缀,
              #    否则会把 AssignHub / ReleaseHub / Heartbeat / TransferHub 等后端内部/DS RPC
              #    暴露给公网客户端。player_id 由 sub claim 注入 x-pandora-player-id,服务层信 ctx 不信请求体。
              - match:
                  path: "/pandora.hub.v1.HubAllocatorService/ListHubLines"
                requires:
                  provider_name: "pandora_session"
              - match:
                  path: "/pandora.hub.v1.HubAllocatorService/TransferToLine"
                requires:
                  provider_name: "pandora_session"
              # player 服务所有 RPC 均需 JWT(player_id 以 JWT sub 为准,R5;服务层按 ctx 身份校验,
              # 系统/内部方法 GetMMR/UpdateMMR/UnlockHero/Grant* 由下方 route 精确 403 拦截,不对客户端开放)。
              - match:
                  prefix: "/pandora.player.v1.PlayerService/"
                requires:
                  provider_name: "pandora_session"
              # inventory 服务所有 RPC 均需 JWT(player_id 以 JWT sub 为准,R5;系统方法
              # GrantItems/GrantInstances/Freeze*/EnsureAuctionEscrow/Settle*/ReleaseEscrow/
              # EscrowOutInstances/ClaimTransferInstances/ReleaseTransferEscrow
              # 由下方 route 精确 403 拦截)。
              - match:
                  prefix: "/pandora.inventory.v1.InventoryService/"
                requires:
                  provider_name: "pandora_session"
              # 没列到的 path(login.Login / grpc reflection)默认按既有规则放行。
              # VerifyDSTicket 在下方 public route 精确 403，唯一入口是 :8444 exact route；
              # 后端还要求 DS Bearer + Redis active/projection，不能由玩家面 allow_missing 旁路。

          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

          route_config:
            name: pandora_routes
            virtual_hosts:
            - name: pandora_vh
              domains: [ "*" ]

              # 受信客户端 IP:Envoy 直连观测的下游地址(TLS socket 对端),配合上方
              # header_mutation 的入站剥离构成不可伪造链。login 的失败配额按它做 IP 维度;
              # 经 LB/多层代理部署时此值是最后一跳地址,需换 proxy_protocol / XFF 可信链再评估。
              request_headers_to_add:
              - header:
                  key: "x-pandora-client-ip"
                  value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
                append_action: OVERWRITE_IF_EXISTS_OR_ADD

              # virtual_host 级 CORS 策略(联调宽松,生产收紧)
              typed_per_filter_config:
                envoy.filters.http.cors:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                  allow_origin_string_match:
                  - safe_regex:
                      regex: ".*"
                  allow_methods: "POST, OPTIONS"
                  allow_headers: "content-type, x-grpc-web, x-user-agent, authorization, x-player-id, grpc-timeout, x-pandora-game-mode"
                  expose_headers: "grpc-status, grpc-message, grpc-status-details-bin"
                  max_age: "600"

              routes:
              # ----- DS-only:客户端面明确拒绝（必须排在 login prefix 前）-----
              - match:
                  path: "/pandora.login.v1.LoginService/VerifyDSTicket"
                direct_response:
                  status: 403
                  body:
                    inline_string: "DS-only method; use isolated :8444"
              - match:
                  path: "/pandora.login.v1.LoginService/ResolvePlayerNosForDS"
                direct_response:
                  status: 403
                  body:
                    inline_string: "DS-only method; use isolated :8444"
              # ----- login.Login:唯一未鉴权入口,挂边缘 token bucket(必须排在 login prefix 前)-----
              # anti-abuse §6 第 5 项:登录(含 dev 自动注册)是未鉴权路径,洪峰会在 jwt 验签
              # 与后端 bcrypt 之前被这里按桶丢弃。桶值推导:正常登录洪峰 = 开服重连风暴,
              # 单 Envoy 50 rps 持续 + 100 突发已高于压测观测的合法峰值一个量级,
              # ⚠️ 初值待压测复核(stress-discipline.md 口径:限流前后 login QPS 对比表)。
              # 只限 Login 一个方法:Logout / IssueDSTicket / SelectRole 已鉴权且是退出/进场
              # 关键路径,绝不能被边缘限流波及(验收底线 4)。
              - match:
                  path: "/pandora.login.v1.LoginService/Login"
                route:
                  cluster: login_cluster
                  timeout: 15s
                  idle_timeout: 60s
                typed_per_filter_config:
                  envoy.filters.http.local_ratelimit:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                    stat_prefix: edge_rl_login
                    token_bucket:
                      max_tokens: 100
                      tokens_per_fill: 50
                      fill_interval: 1s
                    filter_enabled:
                      runtime_key: edge_rl_login_enabled
                      default_value: { numerator: 100, denominator: HUNDRED }
                    filter_enforced:
                      runtime_key: edge_rl_login_enforced
                      default_value: { numerator: 100, denominator: HUNDRED }
                    # gRPC 客户端拿 RESOURCE_EXHAUSTED(与 errcode.ErrRateLimited 的 gRPC 映射
                    # 一致,UE 侧按可重试处理),而不是裸 429。
                    rate_limited_as_resource_exhausted: true

              # ----- login 其余方法(unary,立即完成型,demo 15s 超时)-----
              - match:
                  prefix: "/pandora.login.v1.LoginService/"
                route:
                  cluster: login_cluster
                  timeout: 15s
                  idle_timeout: 60s

              # ----- push(server stream,长连接必须 0 超时)-----
              - match:
                  prefix: "/pandora.push.v1.PushService/"
                route:
                  cluster: push_cluster
                  # ⭐ server stream 铁律:timeout=0(否则 Envoy 默认 15s 后断流)
                  timeout: 0s
                  idle_timeout: 0s
                  # 会话门纵深(P0,INC-20260722-004):JWT 只在建流被 jwt_authn 验一次,
                  # 流本身要有界寿命,到期强制客户端带新 token 重建(重建再过建流会话门)。
                  # 服务端流内另有 30s jti/exp 复查(biz/push.go),这里是独立兜底层,
                  # 取 1h 平衡重连风暴与 token 逾期存活上限;grpc-status 可重试,UE 自动重订。
                  max_stream_duration:
                    max_stream_duration: 3600s
                    grpc_timeout_header_max: 0s

              # ----- team(unary,立即完成型,demo 15s 超时)-----
              - match:
                  prefix: "/pandora.team.v1.TeamService/"
                route:
                  cluster: team_cluster
                  timeout: 15s
                  idle_timeout: 60s

              # ----- matchmaker(unary,立即受理型,demo 15s 超时)-----
              # 撮合进度由 pandora.match.progress push 驱动,这里只是受理 RPC,不是长连。
              # ⚠️ ReleaseMatch 是后端内部接口(battle_result 结算落库后直连调用),绝不对客户端
              #    开放:精确 path 直接 403(服务层还有 callerID!=0 拒绝兜底,双保险)。
              - match:
                  path: "/pandora.match.v1.MatchService/ReleaseMatch"
                direct_response:
                  status: 403
                  body:
                    inline_string: "internal rpc"
              - match:
                  path: "/pandora.match.v1.MatchService/ResolvePlayerMatchContext"
                direct_response:
                  status: 403
                  body:
                    inline_string: "internal rpc"
              # PVE 匹配实例路由:客户端带 header `x-pandora-game-mode: pve` → PVE matchmaker(:20018,
              # game_mode=pve_coop + walk_in=true,单人/整队直进副本);不带 = 默认 PVP 撮合实例。
              # 设计既定「一个 game_mode 一个 matchmaker 部署」;同一 gRPC 服务名靠 header 分流是 Envoy 标准做法。
              # 安全:此头只选择实例,player_id 仍以 JWT sub 为准(两实例同一 jwt_authn 规则),伪造头最多进错池。
              - match:
                  prefix: "/pandora.match.v1.MatchService/"
                  headers:
                  - name: "x-pandora-game-mode"
                    string_match:
                      exact: "pve"
                route:
                  cluster: match_pve_cluster
                  timeout: 15s
                  idle_timeout: 60s
              - match:
                  prefix: "/pandora.match.v1.MatchService/"
                route:
                  cluster: match_cluster
                  timeout: 15s
                  idle_timeout: 60s

              # ----- friend(unary,立即完成型,demo 15s 超时)-----
              - match:
                  prefix: "/pandora.friend.v1.FriendService/"
                route:
                  cluster: friend_cluster
                  timeout: 15s
                  idle_timeout: 60s

              # ----- mission(unary,立即完成型,demo 15s 超时)-----
              # ⚠️ 系统 RPC 绝不对客户端开放:ReportMissionFacts 是任务进度的唯一写入通道
              #    (battle_result 出箱内网直连),CompleteAllMissions 是 GM 批量完成 ——
              #    精确 path 必须排在下方 prefix 前直接 403(服务层还有 systemOnly 兜底,双保险)。
              - match:
                  path: "/pandora.mission.v1.MissionService/ReportMissionFacts"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              - match:
                  path: "/pandora.mission.v1.MissionService/CompleteAllMissions"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              - match:
                  prefix: "/pandora.mission.v1.MissionService/"
                route:
                  cluster: mission_cluster
                  timeout: 15s
                  idle_timeout: 60s

              # ----- chat(unary,立即完成型,demo 15s 超时)-----
              - match:
                  prefix: "/pandora.chat.v1.ChatService/"
                route:
                  cluster: chat_cluster
                  timeout: 15s
                  idle_timeout: 60s

              # ----- guild / group(unary,立即完成型,demo 15s 超时)-----
              - match:
                  prefix: "/pandora.guild.v1.GuildService/"
                route:
                  cluster: guild_cluster
                  timeout: 15s
                  idle_timeout: 60s
              - match:
                  prefix: "/pandora.group.v1.GroupService/"
                route:
                  cluster: guild_cluster
                  timeout: 15s
                  idle_timeout: 60s

              # ----- mail(unary,立即完成型,demo 15s 超时)-----
              # ⚠️ 运营发信接口(SendSystemMail/SendGuildMail/SendPersonalMail)是后端内部 RPC
              #    (运营工具 / battle_result 背包满转邮件,内网直连不经 Envoy),绝不对客户端开放:
              #    精确 path 直接 403(服务层还有 systemOnly 兜底,双保险),防玩家自助群发/发带附件邮件。
              - match:
                  path: "/pandora.mail.v1.MailService/SendSystemMail"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              - match:
                  path: "/pandora.mail.v1.MailService/SendGuildMail"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              - match:
                  path: "/pandora.mail.v1.MailService/SendPersonalMail"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              # DS 三段式领取(bag phase 2):owner DS 内网直连专用,客户端一律 403
              # (服务层 systemOnly 兜底;玩家可自助调用 = 冒领意图/伪造终结)。
              - match:
                  path: "/pandora.mail.v1.MailService/GetClaimableAttachments"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              - match:
                  path: "/pandora.mail.v1.MailService/MarkMailClaimed"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              # phase 2 cutover 预留:DS 领取链全量启用并排空旧客户端后取消注释(与 UseItem/SellItem 同批)。
              # - match:
              #     path: "/pandora.mail.v1.MailService/ClaimMail"
              #   direct_response: { status: 403, body: { inline_string: "moved to ds claim chain (phase 2)" } }
              - match:
                  prefix: "/pandora.mail.v1.MailService/"
                route:
                  cluster: mail_cluster
                  timeout: 15s
                  idle_timeout: 60s

              # ----- trade(unary,立即完成型,demo 15s 超时)-----
              - match:
                  prefix: "/pandora.trade.v1.TradeService/"
                route:
                  cluster: trade_cluster
                  timeout: 15s
                  idle_timeout: 60s

              # ----- leaderboard(读接口客户端可见;写接口服务层拒绝玩家 JWT)-----
              - match:
                  prefix: "/pandora.leaderboard.v1.LeaderboardService/"
                route:
                  cluster: leaderboard_cluster
                  timeout: 15s
                  idle_timeout: 60s

              # ----- hub_allocator 玩家侧(仅两个精确 method:列线路 + 主动切线)-----
              # ⚠️ 精确 path 路由,绝不路由整个 HubAllocatorService 前缀(内部/DS RPC 不对客户端开放)。
              - match:
                  path: "/pandora.hub.v1.HubAllocatorService/ListHubLines"
                route:
                  cluster: hub_allocator_cluster
                  timeout: 15s
                  idle_timeout: 60s
              - match:
                  path: "/pandora.hub.v1.HubAllocatorService/TransferToLine"
                route:
                  cluster: hub_allocator_cluster
                  timeout: 15s
                  idle_timeout: 60s

              # ----- player(角色档案 / 属性加点 / 出战装备 / 天赋 / 领奖,unary 15s 超时)-----
              # 客户端自助养成入口。系统/内部方法绝不对客户端开放:精确 path 直接 403
              # (服务层还有 systemOnly 兜底,双保险),防玩家自助刷段位 / 加点 / 解锁英雄。
              - match:
                  path: "/pandora.player.v1.PlayerService/UpdateMMR"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              - match:
                  path: "/pandora.player.v1.PlayerService/GetMMR"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              - match:
                  path: "/pandora.player.v1.PlayerService/UnlockHero"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              - match:
                  path: "/pandora.player.v1.PlayerService/GrantAttributePoints"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              - match:
                  path: "/pandora.player.v1.PlayerService/GrantTalentPoints"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              - match:
                  path: "/pandora.player.v1.PlayerService/AddExperience"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              # 技能卡发放是系统 RPC(抽卡 / 活动 / GM 驱动),对客户端开放 = 玩家自助发卡。
              - match:
                  path: "/pandora.player.v1.PlayerService/GrantSkillCards"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              # EnsureProfile 是 login 播种角色名用的系统 RPC(账号 / 角色分离 2026-08-18)。
              # 对客户端开放 = 玩家能拿它给自己起任意昵称,绕过改名的全部限制
              # (长度 / 屏蔽字 / 唯一性之外的业务规则)。服务层 systemOnly 兜底,这里双保险。
              - match:
                  path: "/pandora.player.v1.PlayerService/EnsureProfile"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              # GetPlayerNames 是 DS 面的铭牌取名接口(只在 :8444 放行)。对客户端开放
              # 等于给出一个「按任意 player_id 查名字」的公开入口;玩家看别人的名字应走
              # team / friend / guild 各自的成员列表,那里有关系校验。
              - match:
                  path: "/pandora.player.v1.PlayerService/GetPlayerNames"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              - match:
                  prefix: "/pandora.player.v1.PlayerService/"
                route:
                  cluster: player_cluster
                  timeout: 15s
                  idle_timeout: 60s

              # ----- inventory(大厅背包:货币/道具/装备实例 使用·出售·鉴定·整理,unary 15s 超时)-----
              # 系统方法(发放 / 拍卖·交易结算 / 挂单冻结)绝不对客户端开放:精确 path 直接 403
              # (服务层还有 callerID==0 兜底),防玩家自助发道具 / 结算套现。
              - match:
                  path: "/pandora.inventory.v1.InventoryService/GrantItems"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              - match:
                  path: "/pandora.inventory.v1.InventoryService/GrantInstances"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              - match:
                  path: "/pandora.inventory.v1.InventoryService/ConsumeBattleItem"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              - match:
                  path: "/pandora.inventory.v1.InventoryService/DiscardBattleItem"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              - match:
                  path: "/pandora.inventory.v1.InventoryService/FreezeForOrder"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              - match:
                  path: "/pandora.inventory.v1.InventoryService/EnsureAuctionEscrow"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              - match:
                  path: "/pandora.inventory.v1.InventoryService/SettleAuctionMatch"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              - match:
                  path: "/pandora.inventory.v1.InventoryService/SettlePlayerTrade"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              - match:
                  path: "/pandora.inventory.v1.InventoryService/ReleaseEscrow"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              # 邮件 transfer 实例托管三 RPC(2026-07-22,bag-domain.md §7.1):同为系统方法,
              # 玩家可自助调用 = 凭空托管/冒领/释放他人实例,精确 403 + 服务层 callerID==0 兜底。
              - match:
                  path: "/pandora.inventory.v1.InventoryService/EscrowOutInstances"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              - match:
                  path: "/pandora.inventory.v1.InventoryService/ClaimTransferInstances"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              - match:
                  path: "/pandora.inventory.v1.InventoryService/ReleaseTransferEscrow"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              - match:
                  path: "/pandora.inventory.v1.InventoryService/ConsumeTransferEscrow"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              # CheckItemsOwned(2026-07-25,player.SetEquipment 拥有权校验用):系统方法,
              # 玩家可自助调用 = 可探测任意 player_id 的持有情况,精确 403 + 服务层 callerID==0 兜底。
              - match:
                  path: "/pandora.inventory.v1.InventoryService/CheckItemsOwned"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              - match:
                  path: "/pandora.inventory.v1.InventoryService/CheckInstancesOwned"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }
              # ----- phase 2 cutover 预留(bag-domain.md §10):DS 背包/领取链全量启用并排空旧客户端后,
              # 取消注释砍客户端直连 UseItem/SellItem(mail 侧同批砍 ClaimMail,见 mail 路由段)。
              # - match:
              #     path: "/pandora.inventory.v1.InventoryService/UseItem"
              #   direct_response: { status: 403, body: { inline_string: "moved to ds bag journal (phase 2)" } }
              # - match:
              #     path: "/pandora.inventory.v1.InventoryService/SellItem"
              #   direct_response: { status: 403, body: { inline_string: "moved to ds bag journal (phase 2)" } }
              - match:
                  prefix: "/pandora.inventory.v1.InventoryService/"
                route:
                  cluster: inventory_cluster
                  timeout: 15s
                  idle_timeout: 60s

              # ----- 背包域(pandora.bag.v1,bag-domain.md)-----
              # 全部是内部系统接口(调用方 = owner DS 内网直连),不对客户端开放:
              # 整个前缀 403(即使未来误配路由,service 层还有拒客户端 JWT 的双保险)。
              - match:
                  prefix: "/pandora.bag.v1.BagService/"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }

              # ----- owner 权威(pandora.owner.v1,owner-authority.md,§9.22)-----
              # 内部系统接口(调用方 = login / allocator / DS 回调链),不对客户端开放。
              - match:
                  prefix: "/pandora.owner.v1.OwnerService/"
                direct_response: { status: 403, body: { inline_string: "internal rpc" } }

              # ----- gRPC reflection(联调用,grpcurl list/describe)-----
              # W2 dev:放行,联调省心
              # W3 生产:用 ext_authz / direct_response 403 块掉
              - match:
                  prefix: "/grpc.reflection.v1.ServerReflection/"
                route:
                  cluster: login_cluster   # 任意一个上游都行(reflection 是 server-level)
                  timeout: 0s
                  idle_timeout: 0s
              - match:
                  prefix: "/grpc.reflection.v1alpha.ServerReflection/"
                route:
                  cluster: login_cluster
                  timeout: 0s
                  idle_timeout: 0s

  # ============================================================================
  # DS gRPC-Web 入口监听器(:8444) —— UE Hub/Battle DS → 内部服务(agones-dev.md §5.1 方案 A)
  # ----------------------------------------------------------------------------
  # 为什么独立监听器而不是复用 :8443:
  #   :8443 是「客户端面」(玩家 SessionToken + jwt_authn),若把内部服务路由挂上去,
  #   未列入 jwt_authn rules 的 path 会被 allow_missing 放行 → 任意公网客户端可直接调
  #   battle_result.ReportResult / locator.SetLocation 伪造战绩/定位。故 DS 面单独开
  #   :8444,与客户端面物理隔离,便于后续单独加 mTLS / 网络策略锁死「只允许 DS pod 访问」。
  #
  # UE DS 走 gRPC-Web(FHttpModule),内部服务(login :20001 / hub :20021 / ds :20020 / locator :20006 /
  # battle_result :20022)裸端口是原生 gRPC(h2c),这里用 grpc_web filter 做协议转换。
  # UE DS `UPandoraDSBackendSubsystem` 的各 Endpoint 经 SetEndpoints / Game.ini 指向
  # 本地 dev 监听器用 http://host:8444（bUseTls=false），避免 Linux DS 容器无法信任宿主 mkcert 根证书。
  # 同集群生产环境仍保持应用层明文，由 NetworkPolicy 收敛；未来 mesh mTLS 对业务透明。
  # 只有 DS 位于集群外、显式接入 TLS 边缘时，才为 DS 镜像配置受信 CA 并开启应用层 TLS。
  #
  # ⚠️ 鉴权说明:本监听器**不挂 player jwt_authn**(DS→后端内部调用不带玩家 SessionToken,
  # 内部服务用 pmw.AuthOptional)。UE NetDriver 的 DSTicket 只认证「玩家→DS」，不认证
  # 「DS→后端」；本面使用 exact method 白名单 + DS Bearer + Redis active/projection，
  # NetworkPolicy 继续收敛可达性；生产仍须补基础设施 mTLS/ACL，:8444 绝不可直接暴露公网。
  # ============================================================================
  - name: pandora_ds_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8444
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: pandora_ds_hcm
          codec_type: AUTO
          stream_idle_timeout: 0s
          request_timeout: 0s
          common_http_protocol_options:
            idle_timeout: 0s
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
          http_filters:
          # ⭐ gRPC-Web 字节流 → 标准 gRPC(DS 侧同客户端,复用 grpc-web codec)
          - name: envoy.filters.http.grpc_web
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
          # ⭐ 安全:DS 面不挂 jwt_authn,内部服务用 pmw.AuthOptional 直接读 x-pandora-player-id。
          # DS→后端调用不该携带玩家身份头(SetLocation 的 player_id 是业务 body 参数),
          # 故无条件剥离客户端/DS 伪造的 x-pandora-player-id / x-pandora-jwt-payload,防止 DS 越权冒充玩家。
          - name: envoy.filters.http.header_mutation
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
              mutations:
                request_mutations:
                - remove: "x-pandora-player-id"
                # 账号态身份头(两步登录 2026-08-18):与 player-id 同样必须无条件剥离。
                # 客户端面它只由 pandora_account provider 验签成功后重写;DS 面根本不该存在。
                # 漏剥离 = 任何调用方都能自带一个 x-pandora-account-id 打
                # ListAccountRoles / EnterRole,列出并进入**别人账号下的角色**。
                - remove: "x-pandora-account-id"
                - remove: "x-pandora-jwt-payload"
                # 入站先剥离网关标记头(防伪造),再由下方 vh 统一盖回 "1":
                # 后端 DSCallbackGuard 凭此头区分「DS 面流量(须验令牌)」与「内部东西向直连」。
                - remove: "x-pandora-ds-gateway"
                # 受信客户端 IP 头同 :8443 一并入站剥离(纵深防御):当前 :8444 白名单里
                # 没有该头的消费者(login.Login 不可达),但伪 DS 不得预置一个可被将来 RPC 误信的
                # x-pandora-client-ip;:8444 不注入该头(DS 面无客户端 IP 语义)。
                - remove: "x-pandora-client-ip"
          # 注意:DS 面不挂 jwt_authn(见上方鉴权说明)。
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            name: pandora_ds_routes
            virtual_hosts:
            - name: pandora_ds_vh
              domains: [ "*" ]
              # DS 网关标记头(审核 P1 #1):经 :8444 进后端的请求一律盖上 x-pandora-ds-gateway: "1"
              # (入站已先剥离,不可伪造)。后端 ds_auth.mode=permissive/enforce 时,凭此头要求
              # DS 必须带 Bearer 服务令牌(hub 令牌绑 pod / battle 令牌绑 match_id);
              # 内部东西向直连无此头,不受影响。
              request_headers_to_add:
              - header: { key: "x-pandora-ds-gateway", value: "1" }
                append_action: OVERWRITE_IF_EXISTS_OR_ADD
              routes:
              # ⚠️ DS 面双层防护(2026-07-10,回应审核 P1;§5 五轮更新):
              #  1) 方法白名单:8444 无 jwt_authn(边缘客户端面 :8443 才做 JWT 校验),故只放行 DS / Hub DS
              #     **文档明确会回调**的 method,用 path 精确匹配;deny-by-default:未匹配路由 Envoy 直接 404 →
              #     伪 DS / 局域网调用者无法调 Allocate/Release/Transfer/List/ClearLocation 等非 DS 回调方法。
              #  2) DS 服务令牌:入站已剥离并重盖 x-pandora-ds-gateway,后端 ds_auth.mode=enforce 时,
              #     白名单放行的方法仍要求 DS 带 Bearer 服务令牌(hub 令牌绑 pod / battle 令牌绑 match_id)才通过
              #     ——不再是「仅靠网络信任」,SetLocation/ReportResult/Heartbeat 均经令牌鉴权。
              #  新增 DS 方法必须显式加一行,并确认后端已纳入 ds_auth 校验。
              # ----- Hub/Battle DS → login.VerifyDSTicket(玩家在线入场权威)-----
              - match:
                  path: "/pandora.login.v1.LoginService/VerifyDSTicket"
                route:
                  cluster: login_cluster
                  timeout: 15s
                  idle_timeout: 60s
              # ----- Hub/Battle DS → login.ResolvePlayerNosForDS(头顶展示编号批量权威)-----
              - match:
                  path: "/pandora.login.v1.LoginService/ResolvePlayerNosForDS"
                route:
                  cluster: login_cluster
                  timeout: 15s
                  idle_timeout: 60s
              # ----- Hub DS → hub_allocator.Heartbeat(unary 5s 心跳)-----
              - match:
                  path: "/pandora.hub.v1.HubAllocatorService/Heartbeat"
                route:
                  cluster: hub_allocator_cluster
                  timeout: 15s
                  idle_timeout: 60s
              - match:
                  path: "/pandora.hub.v1.HubAllocatorService/AcknowledgeAdmission"
                route:
                  cluster: hub_allocator_cluster
                  timeout: 15s
                  idle_timeout: 60s
              - match:
                  path: "/pandora.hub.v1.HubAllocatorService/AcknowledgeDeparture"
                route:
                  cluster: hub_allocator_cluster
                  timeout: 15s
                  idle_timeout: 60s
              # ----- Battle DS → ds_allocator.Heartbeat(unary 5s 心跳)-----
              - match:
                  path: "/pandora.ds.v1.DSAllocatorService/Heartbeat"
                route:
                  cluster: ds_allocator_cluster
                  timeout: 15s
                  idle_timeout: 60s
              # ----- Battle DS → gm.GmService(GM 指令拉取/回执,复用 ds_allocator 同进程)-----
              # ⚠️ 只放 DS 侧发起的两个精确 method:PollCommands(拉队列) + AckCommand(回执)。
              #    SendCommand(运维下发)**绝不**经任一 Envoy 监听器暴露,只内网直连 ds_allocator
              #    :20020(gmctl / 运维跳板机),防 DS 或玩家侧越权下发道具(§14 闭环 + 最小暴露)。
              - match:
                  path: "/pandora.gm.v1.GmService/PollCommands"
                route:
                  cluster: ds_allocator_cluster
                  timeout: 15s
                  idle_timeout: 60s
              - match:
                  path: "/pandora.gm.v1.GmService/AckCommand"
                route:
                  cluster: ds_allocator_cluster
                  timeout: 15s
                  idle_timeout: 60s
              # ----- Hub DS → player_locator.SetLocation(上报 HUB；MATCHING/BATTLE 由 matchmaker 写)-----
              - match:
                  path: "/pandora.locator.v1.PlayerLocatorService/SetLocation"
                route:
                  cluster: locator_cluster
                  timeout: 15s
                  idle_timeout: 60s
              # ----- Hub DS → player_locator.ReportDisconnect(玩家断线快速上报,缩短 HUB TTL)-----
              - match:
                  path: "/pandora.locator.v1.PlayerLocatorService/ReportDisconnect"
                route:
                  cluster: locator_cluster
                  timeout: 15s
                  idle_timeout: 60s
              # ----- Battle DS → battle_result.ReportResult(同步结算上报,§6)-----
              - match:
                  path: "/pandora.battle.v1.BattleResultService/ReportResult"
                route:
                  cluster: battle_result_cluster
                  timeout: 15s
                  idle_timeout: 60s
              # ----- Battle DS → battle_result.ReportProgress(战斗中实时进度批,realtime-progression.md)-----
              - match:
                  path: "/pandora.battle.v1.BattleResultService/ReportProgress"
                route:
                  cluster: battle_result_cluster
                  timeout: 15s
                  idle_timeout: 60s
              # ----- owner DS → bag 域 journal 直写(bag-domain.md phase 2,BagService 由 inventory 承载)-----
              # hub/battle owner DS 三条写路径;五要件①身份由服务侧 DSCallbackGuard 验签 Bearer。
              - match:
                  path: "/pandora.bag.v1.BagService/LoadBag"
                route:
                  cluster: inventory_cluster
                  timeout: 15s
                  idle_timeout: 60s
              - match:
                  path: "/pandora.bag.v1.BagService/AppendJournal"
                route:
                  cluster: inventory_cluster
                  timeout: 15s
                  idle_timeout: 60s
              - match:
                  path: "/pandora.bag.v1.BagService/SaveCheckpoint"
                route:
                  cluster: inventory_cluster
                  timeout: 15s
                  idle_timeout: 60s
              - match:
                  path: "/pandora.bag.v1.BagService/PurchaseCapacity"
                route:
                  cluster: inventory_cluster
                  timeout: 15s
                  idle_timeout: 60s
              # ----- Hub DS → mail DS 三段式领取(bag phase 2)-----
              - match:
                  path: "/pandora.mail.v1.MailService/GetClaimableAttachments"
                route:
                  cluster: mail_cluster
                  timeout: 15s
                  idle_timeout: 60s
              - match:
                  path: "/pandora.mail.v1.MailService/MarkMailClaimed"
                route:
                  cluster: mail_cluster
                  timeout: 15s
                  idle_timeout: 60s
              # ----- Hub DS → team/guild 社交归属反查(2026-08-12)-----
              # DS 在玩家进场时按 player_id 反查队伍 / 公会编号,写到实体上复制给全场,
              # 「谁和谁是一伙的」才有权威来源。两个方法在服务端都有 systemOnly 门(带玩家
              # JWT 的调用一律拒),这里只补 DS 面路由。集群内等价配置见
              # deploy/k8s/agones/16-ds-envoy.yaml;两处必须同增同减。
              # 超时取 5s(与集群侧一致):进场路径上的只读反查,失败按未知处理不阻塞出生,
              # 没有理由等到 15s。
              - match:
                  path: "/pandora.team.v1.TeamService/GetPlayerTeam"
                route:
                  cluster: team_cluster
                  timeout: 5s
                  idle_timeout: 60s
              - match:
                  path: "/pandora.guild.v1.GuildService/GetPlayerGuild"
                route:
                  cluster: guild_cluster
                  timeout: 5s
                  idle_timeout: 60s
              # ----- Hub/Battle DS → player.GetLoadout(开战前出战快照)-----
              # DS 在 PlayerState 初始化时按 player_id 拉专精 / 预设装备,失败按空处理
              # (装备与专精整局丢失,但不阻断出生)。只放这一个精确方法:DS 不需要
              # SetEquipment / Grant* 等写接口,放整前缀等于把玩家存档写权限暴露给 DS 网段。
              # 服务端 resolvePlayerID 在 callerID==0(DS 无玩家 JWT)时以请求体 player_id 为准。
              # 超时取 10s(不是社交反查的 5s):本方法要向 inventory 二次取实例详情,
              # 且超时的代价是玩家整局没装备,取值与 UE 侧 PlayerGetLoadout 的 10s
              # 客户端超时对齐,两边不互相截断。
              - match:
                  path: "/pandora.player.v1.PlayerService/GetLoadout"
                route:
                  cluster: player_cluster
                  timeout: 10s
                  idle_timeout: 60s
              # DS 批量反查角色显示名(头顶铭牌,2026-08-18)。铭牌名字的权威是
              # players.nickname;DS 此前只能回退 CfgRole 职业名,全场人人同名。
              # 只放这一个精确方法:它是最小映射(player_id → nickname),不像 GetProfile
              # 会把等级 / 段位 / 战绩整份档案开到 DS 网段。服务端 systemOnly 兜底。
              # 集群内等价配置见 deploy/k8s/agones/16-ds-envoy.yaml;两处必须同增同减。
              # 超时 5s(同社交反查):进场路径只读,失败按未知处理不阻塞出生。
              - match:
                  path: "/pandora.player.v1.PlayerService/GetPlayerNames"
                route:
                  cluster: player_cluster
                  timeout: 5s
                  idle_timeout: 60s

  clusters:
  # ===== login_cluster =====
  - name: login_cluster
    type: STRICT_DNS
    # ⭐ 强制 IPv4：Windows Docker Desktop 上 host.docker.internal 默认返 IPv6，
    #   envoy 连上去会 cx_connect_fail → upstream connect error。
    #   Linux 同样用 host-gateway 时 IPv4 才能走通。
    dns_lookup_family: V4_ONLY
    connect_timeout: 1s
    lb_policy: ROUND_ROBIN
    # ⭐ 上游 h2c:业务服跑的是明文 HTTP/2,不显式声明会用 HTTP/1.1 → gRPC 415
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: login_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                # ⭐ host.docker.internal:Windows / macOS Docker Desktop 默认解析到宿主
                #   Linux:docker-compose 用 extra_hosts: host-gateway 补,见 docker-compose.dev.yml
                address: host.docker.internal
                port_value: 20001

  # ===== push_cluster(server stream,idle 0)=====
  - name: push_cluster
    type: STRICT_DNS
    dns_lookup_family: V4_ONLY   # 同 login_cluster，避 IPv6 解析坐这个坑
    connect_timeout: 1s
    lb_policy: ROUND_ROBIN
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
        # 上游 idle 也设 0,防 push stream 被 Envoy 主动断
        common_http_protocol_options:
          idle_timeout: 0s
    load_assignment:
      cluster_name: push_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: host.docker.internal
                port_value: 20014

