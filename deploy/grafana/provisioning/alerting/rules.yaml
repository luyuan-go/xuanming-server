# Grafana 统一告警 —— 告警规则(2026-07-10)
#
# 首批规则消费 ds_allocator 容量巡检暴露的指标(pandora_ds_allocator_fleet_*,
# 见 services/battle/ds_allocator/internal/biz/capacity.go)。数据源 uid=pandora-prometheus
# (deploy/grafana/provisioning/datasources/datasources.yml)。
#
# 新增告警照此追加:一条规则 = 一个 Prometheus 查询(refId A)+ 一个阈值表达式(refId C)。
# label severity 决定路由(notification-policies.yaml);annotations 决定通知文案(templates.yaml)。
apiVersion: 1

groups:
  - orgId: 1
    name: ds-capacity
    folder: Pandora Alerts
    interval: 1m
    rules:
      # ── 战斗 DS 并发接近容量上限(warning)──────────────────────────────────
      # allocated/replicas ≥ 0.8 持续 5m → 提醒调大 FleetAutoscaler maxReplicas
      # (deploy/k8s/agones/25-fleetautoscaler-battle.yaml;日常伸缩已由 autoscaler 自动做)。
      - uid: pandora-ds-fleet-near-limit
        title: 战斗DS并发接近容量上限
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: warning
          service: ds_allocator
        annotations:
          summary: '战斗 DS Fleet {{ $labels.fleet }} 并发占用 ≥80%,接近容量上限'
          description: '考虑调大 FleetAutoscaler maxReplicas(25-fleetautoscaler-battle.yaml);当前占用比 {{ with $values.A }}{{ humanizePercentage .Value }}{{ else }}无数据{{ end }}'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: pandora-prometheus
            model:
              editorMode: code
              expr: max by (fleet) (pandora_ds_allocator_fleet_usage_ratio)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { type: gt, params: [0, 0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: $A >= 0.8
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math

      # ── 战斗 DS 容量打满 / 无空闲(critical)────────────────────────────────
      # ready==0 持续 2m → 新对局分配必失败(玩家匹配成功进不去),立即扩容。
      - uid: pandora-ds-fleet-exhausted
        title: 战斗DS容量打满无空闲
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: critical
          service: ds_allocator
        annotations:
          summary: '战斗 DS Fleet {{ $labels.fleet }} 无空闲副本(ready=0),新对局分配将失败'
          description: '已触顶 FleetAutoscaler maxReplicas(25-fleetautoscaler-battle.yaml),立即调大;玩家匹配成功但可能进不了战斗。INC-20260724-001 降噪:desired(spec.replicas)==0 的 Fleet 被排除——未做金丝雀发布时 canary 常态 0 副本,旧规则让它长期 firing 淹没了 stable 的真实告警。用 unless 而非 and:若 allocator 未上报 desired 序列(旧版本/回滚),规则退化为原判据继续告警,不会被静默。多副本滚动期只要任一副本上报 desired==0 即排除该 fleet 全部序列。'
        data:
          - refId: A
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: pandora-prometheus
            model:
              editorMode: code
              expr: max by (fleet) (pandora_ds_allocator_fleet_ready) unless on (fleet) (max by (fleet) (pandora_ds_allocator_fleet_desired_replicas) == 0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      # ── ds_allocator 实例不可达 / metrics 采集中断(critical)──────────────
      # 上面两条容量规则 noDataState=OK(Fleet 未部署时指标本就不存在,不该误报);
      # 但这样一来 exporter 挂掉 / 抓取中断时 ready=0 critical 也会被 NoData 静默成 OK,
      # 形成"最该告警时反而不响"的盲区(三审 P1-8)。这条可用性规则补齐该盲区:
      # up{service=ds_allocator}==0(目标配置在案但抓不到)或整条 up 序列消失(NoData→Alerting)
      # 持续 2m 即告警。目标在 prometheus.yml 静态登记,稳态下 up 必存在,不会误报。
      - uid: pandora-ds-allocator-down
        title: DS调度实例不可达
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        labels:
          severity: critical
          service: ds_allocator
        annotations:
          summary: 'ds_allocator 实例不可达或 metrics 抓取中断,容量告警已失效'
          description: '容量规则依赖 ds_allocator 暴露的 fleet 指标;实例挂掉时这些规则会被 NoData 静默。请立即检查 ds_allocator 进程与 21020 端口。'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: pandora-prometheus
            model:
              editorMode: code
              expr: max (up{job="pandora-go-services", service="ds_allocator"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      # ── Hub 归属/容量账本长期无写者(critical)──────────────────────────────
      # R11 复审 P0-2:hub_allocator 是 assignment/容量账本的单写者,写权由 etcd 继任
      # 租约授予(pkg/dsauthfence/writerlease)。此前"长期无主"只能人工逐 Pod 直连健康
      # 页发现——尤其竞选或激活钩子**永久阻塞**(而非返回错误)时,失败计数器一次都不
      # 会动,degraded 恒 false,日志也不再输出,完全静默。
      #
      # 判据取全局而非单副本:失主副本是**有意的热备**(拒写但可秒级接管),单副本
      # held=0 属正常。真正的故障是**没有任何副本上报 held=1**——同时覆盖竞选阻塞、
      # 激活阻塞、全体竞选失败三种形态,不依赖"某个函数返回了错误"这个前提。
      #
      # for: 1m > lease TTL 兜底接任窗口(15s)+ 滚动让位(亚秒),正常发布不误报。
      # noDataState/execErrState=Alerting:指标序列消失(进程全挂/抓取中断)同样是
      # "无法证明有写者",必须响,不能被 NoData 静默成 OK(同上条 ds_allocator 教训)。
      # 未启用继任租约时(legacy/off,单写由部署策略保证)enabled=0,用 unless 排除,
      # 避免 dev/单副本 Recreate 部署常态 firing。
      - uid: pandora-hub-allocator-no-writer
        title: Hub账本长期无写者
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        labels:
          severity: critical
          service: hub_allocator
        annotations:
          summary: 'hub_allocator 无任何副本持有写者租约,Hub 归属/容量写入全部被拒'
          description: '玩家 AssignHub / Transfer / Admission 将持续失败(可重试错误)。检查 etcd 可达性与选举 key /pandora/writerlease/hub_allocator/writer;逐 Pod 看 pandora_hub_allocator_writer_campaign_errors 与 _activation_errors 区分"选不上"与"选上了激活不过"。激活连续失败 = 继任者 fence 水位推扫未完成,此时拒写是正确的 fail-closed,但必须尽快恢复。'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: pandora-prometheus
            model:
              editorMode: code
              expr: sum (pandora_hub_allocator_writer_held) unless (max (pandora_hub_allocator_writer_lease_enabled) == 0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      # ── DS 心跳超时扫描长期无写者(critical)────────────────────────────────
      # 2026-07-29 事故闭环:ds_allocator 改为多副本 + RollingUpdate 后,心跳超时扫描
      # 由 etcd 继任租约串行化(election=ds_allocator/sweep)。扫描是 §9 不变量 4
      # 「DS 崩溃必有补偿」的唯一驱动:没有它,abandoned 对局不会被标记、不会回收 pod、
      # 不会发 ds.lifecycle,段位回滚与结算补偿整条链静默停摆——而所有 RPC 仍然正常,
      # 从外部看不出任何异常。这正是必须靠指标而不是靠"报错"发现的故障形态。
      #
      # 判据同 hub:失主副本是**有意的热备**(照常服务 Heartbeat/AllocateBattle),
      # 单副本 held=0 属正常;真正的故障是**没有任何副本上报 held=1**。
      # for: 1m > lease TTL 兜底接任窗口(15s)+ 滚动让位(亚秒),正常发布不误报。
      # 未启用继任租约时(off,单扫描者由单副本 Recreate 保证)enabled=0,用 unless 排除。
      - uid: pandora-ds-allocator-no-sweep-writer
        title: DS心跳扫描长期无写者
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        labels:
          severity: critical
          service: ds_allocator
        annotations:
          summary: 'ds_allocator 无任何副本持有心跳扫描租约,DS 崩溃补偿链已停摆'
          description: '心跳超时的战斗不会被标记 abandoned、不会回收 GameServer、不会发 ds.lifecycle,段位回滚与结算补偿全部积压;但 RPC 一切正常,外部无感。检查 etcd 可达性与选举 key /pandora/writerlease/ds_allocator/sweep;逐 Pod 看 pandora_ds_allocator_writer_campaign_errors 区分"选不上"与"全体都在热备"。'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: pandora-prometheus
            model:
              editorMode: code
              expr: sum (pandora_ds_allocator_writer_held) unless (max (pandora_ds_allocator_writer_lease_enabled) == 0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

  # ══ 出箱积压(2026-08-24 补)═══════════════════════════════════════════════
  # 与 Kafka 投递链相关的事务出箱有 4 处,此前一条告警规则都没有:堆积时只有 dbguard 的
  # ERROR 日志(pkg/dbguard/dbguard.go 预算超限分支)+ 发布器自己的 WARN,没人看日志就是
  # 完全静默 —— 而"静默堆积"恰好是玩家侧只表现为"段位没变 / 经验不动 / 任务进度不刷"的
  # 那类故障,从 RPC 看一切正常。
  #
  # 【指标从哪来】pkg/kafkax/metrics.go(2026-08-24 同批次新增)有投递侧指标
  # (pandora_kafka_produce_total / consume_total / dlq_total / consumer_lag),但它们表达的是
  # **投递失败率**,表达不了**积压深度**。查行数唯一的来源仍是 dbguard 的
  # pandora_db_table_rows{db,table}(information_schema 估算,毫秒级不锁表)。各服务在
  # internal/data/budgets.go 给出箱表登记的 MaxRows **不是容量上限而是积压告警线**(三处
  # budgets.go 的注释都明写了这一点),同一个数字由 pandora_db_table_rows_budget 一并上报,
  # dbguard 的 metric Help 写的判据是 "rows > budget > 0";本组用 >= 1(即 rows >= budget),
  # 比 dbguard 自己的 ERROR 日志早一格响 —— 刻意的,告警要先于"已经超了"。
  #
  # 【为什么用比值,不把 100000 / 200000 抄进 yaml】抄一份就有两份事实,改 budgets.go 时
  # 告警会静默漂移(battle_result/budgets.go 为同一理由拒绝再抄一份保留期常量)。这里
  # A = rows / (budget > 0),C 判 $A >= 1:预算改到哪告警线跟到哪。某表没登记预算
  # (budget=0)时被 "> 0" 过滤掉 → 无序列 → NoData → OK,不会变成恒响的噪声。
  #
  # 【本组是"堵了很久"的兜底,不是早期信号】按容量规划口径(battle_result 1 万局/天 × 10 人),
  # 投递链彻底断掉也要约两天才够 20 万行触发;当前量级远低于规划值时可能数周不响。真正的
  # 早期信号在下面的 kafka-health 组(投递失败率 / 消费循环报错 / DLQ),分钟级。两组是互补的:
  # 那组答"投不出去",本组答"已经堆了多少"。
  #
  # 【检测延迟的真实上界是 1h,不是 for 时长】gauge 由各服务 runCapacityGuard 的
  # time.NewTicker(time.Hour) 刷新(启动先跑一轮),/metrics 每次抓取都有样本,但**值**一小时
  # 才动一次。所以 for: 15m 只是防抖(滚动重启 / 抓取空档会让序列短暂消失,NoData 重置 for
  # 计时),真正的发现延迟 ≤ 1h + 15m。要更快必须改巡检节拍,不是改这里的 for。
  #
  # 【已知精度边界】TABLE_ROWS 是 InnoDB 采样估算,而出箱恰好是"插了就删"的高 churn 表,
  # 贴近空表时估算可以偏得很离谱;但真堆到 10 万行量级时数量级是准的,而告警看的就是数量级
  # (§9.24 同款口径)。要精确值用 tools/migrate/cmd/dbcheck -exact,不放告警路径。
  #
  # 【盲区,照实记】noDataState=OK:表未迁移 / 服务未部署时 dbguard 压根不 Set 这些序列
  # (Check 里 stats 查不到该表就 continue),不该误报;代价是进程挂掉 / 抓取中断时本组规则
  # 一起被静默。ds-capacity 组是同样的取舍,那边靠 pandora-ds-allocator-down 兜底;
  # battle_result / player / mission 目前**没有**对应的 up==0 可用性规则,这是已知缺口。
  #
  # 【缺第 4 条:auction 成交事件出箱无指标可查,故意不写】auction 的出箱不是独立表,而是
  # auction_matches.event_pending=1 这个**行内 marker**(services/economy/auction/internal/
  # data/auction_repo.go 的 ListPendingMatchEvents)。pandora_db_table_rows
  # {table="auction_matches"} 数的是全表行数(含 90 天已结算流水,单分片预算 1350 万行),
  # 积压再多也淹没在基数里 —— 没有任何现存指标能表达它,所以这里刻意不放一条永远不触发的
  # 规则充数。补法(最小埋点,不新建 timer / goroutine,§15.2 + §16.10):在既有周期 worker
  # AuctionUsecase.ReconcilePendingMatchEvents(internal/biz/auction.go)每轮开头调一个新增的
  # repo.CountPendingMatchEvents,逐分片 Set 一个 pandora_auction_match_event_pending_rows
  # {shard} gauge(label 只放 shard,§12 低基数);COUNT 必须与 ListPendingMatchEvents 复用
  # **同一 WHERE**(dbguard SweepTable 强制 Count/Delete 同 where 的同款纪律,否则会出现
  # "报告 0、实际堵着"),走已有索引 idx_match_event_ready(event_pending,
  # event_next_attempt_at_ms, matched_at_ms, match_id)是纯索引区间扫,不必新加迁移。
  # 埋完照本组形状加第 4 条规则即可。
  - orgId: 1
    name: outbox-backlog
    folder: Pandora Alerts
    interval: 1m
    rules:
      # ── 战斗结算段位出箱积压(warning)────────────────────────────────────
      # 登记线 20 万行(services/battle/battle_result/internal/data/budgets.go),按容量规划
      # 口径(1 万局/天 × 10 人 = 10 万 player.update/天)约等于两天的量堆着没投出去。
      # severity 取 warning 而非 critical:出箱行落在 MySQL 不丢,player 侧 mmr_history uk
      # 幂等吸收重投,是"要去查"而不是"服务不能用"——但**恢复未必自动**,见 description。
      - uid: pandora-battle-result-outbox-backlog
        title: 战斗结算出箱积压
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: warning
          service: battle_result
        annotations:
          summary: '战斗结算出箱 {{ $labels.table }} 积压达告警线,player.update(段位/经验)事件长期未投递'
          description: '出箱投递成功即删,稳态应接近空;达到 budgets.go 登记的积压线说明 kafka 投递链已堵很久。数据不丢(行在 pandora_battle,player 侧 mmr_history uk 幂等吸收重投),但玩家会看到"打完段位没变"。恢复不一定自动,先分清两种形态:①kafka producer 已注入、只是运行期抖动 → RunOutboxPublisher 每拍重试,kafka 回来会自己排空,不用人管;②producer 根本没注入(kafka.brokers 空 / 启动时构造失败)→ 循环还在跑但每轮空转,日志每 60s 一条 outbox_pending_without_pusher,kafka 恢复后进程不会自愈,必须重启 battle_result 才会补发。区分完再查 outbox_publish_failed 的 player_id / outbox_id:同玩家按 id 保序,队首那行卡住会挡住该玩家后续全部 player.update。当前占积压线 {{ with $values.A }}{{ humanizePercentage .Value }}{{ else }}无数据{{ end }}。'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: pandora-prometheus
            model:
              editorMode: code
              expr: max by (table) (pandora_db_table_rows{db="pandora_battle", table="player_update_outbox"}) / max by (table) (pandora_db_table_rows_budget{db="pandora_battle", table="player_update_outbox"} > 0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { type: gt, params: [0, 0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: $A >= 1
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math

      # ── 玩家经验推送出箱积压(warning)────────────────────────────────────
      # 登记线 10 万行(services/account/player/internal/data/budgets.go)。
      # 2026-08-24 起 player 的经验 producer 改成 kafkax.LazyProducer(惰性建连),所以
      # "kafka 挂了 → 永远不自愈"那一档已经消失:pusher 恒非 nil,发布器照常起、每拍重试。
      # 现在只剩 kafka.brokers 根本没配这一档会让发布器入口 return,而那一档本来就要改配置。
      - uid: pandora-player-push-outbox-backlog
        title: 玩家推送出箱积压
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: warning
          service: player
        annotations:
          summary: '玩家推送出箱 {{ $labels.table }} 积压达告警线,经验/等级推送长期未投递'
          description: '权威态(players.exp / level)在 MySQL 没坏,坏的是推送:客户端经验条不动,重登或下次拉取才对得上。恢复多数情况不需要重启:producer 走惰性建连(kafkax.LazyProducer),发布器一直在跑、每拍重试,kafka 回来会自己排空。只有日志出现 push_outbox_publisher_disabled 时才是另一档 —— 那表示 kafka.brokers 根本没配、发布器入口直接 return,补上配置并重启 player 才会排空。producer 正常却仍堆积时,第二个常见成因是单写者租约无人当选:查 push_outbox_leadership_changed,全体 held=false 就是没人排空(热备副本刻意不发,防投递交错);再不然看 push_outbox_publish_batch_failed。当前占积压线 {{ with $values.A }}{{ humanizePercentage .Value }}{{ else }}无数据{{ end }}。'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: pandora-prometheus
            model:
              editorMode: code
              expr: max by (table) (pandora_db_table_rows{db="pandora_player", table="player_push_outbox"}) / max by (table) (pandora_db_table_rows_budget{db="pandora_player", table="player_push_outbox"} > 0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { type: gt, params: [0, 0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: $A >= 1
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math

      # ── 任务推送出箱积压(warning)────────────────────────────────────────
      # 登记线 10 万行(services/social/mission/internal/data/budgets.go)。
      # 与 player 同构:2026-08-24 起也走 kafkax.LazyProducer,kafka 抖动可自愈;
      # 只有 kafka.brokers 没配时发布器才入口 return。
      - uid: pandora-mission-push-outbox-backlog
        title: 任务推送出箱积压
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: warning
          service: mission
        annotations:
          summary: '任务推送出箱 {{ $labels.table }} 积压达告警线,任务进度推送长期未投递'
          description: '权威态在 pandora_mission 没坏,客户端只能靠 ListMissions / push.resync 兜底看到正确进度,实时刷新是断的。恢复多数情况不需要重启:producer 走惰性建连(kafkax.LazyProducer),发布器一直在跑、每拍重试,kafka 回来会自己排空。只有日志出现 mission_push_publisher_disabled 时才是另一档 —— 那表示 kafka.brokers 根本没配,补上配置并重启 mission 才会排空。producer 正常却仍堆积时按日志分诊:mission_push_publish_failed = 投递失败中断本轮(本表是全局 FIFO 不是每玩家 FIFO,队首行哈希到的分区不可用会连累其它分区的玩家,这是已归档的刻意取舍,分区恢复后按原序自动排空);mission_push_publish_raced = 多副本同时在发,单写者租约未生效或正处滚动升级共存窗口;push_outbox_leadership_changed 全体 held=false = 没人排空。当前占积压线 {{ with $values.A }}{{ humanizePercentage .Value }}{{ else }}无数据{{ end }}。'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: pandora-prometheus
            model:
              editorMode: code
              expr: max by (table) (pandora_db_table_rows{db="pandora_mission", table="mission_push_outbox"}) / max by (table) (pandora_db_table_rows_budget{db="pandora_mission", table="mission_push_outbox"} > 0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { type: gt, params: [0, 0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: $A >= 1
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math

  # ══ Kafka 投递链健康(2026-08-24 补)═════════════════════════════════════
  # 与上面 outbox-backlog 组互补:那组答「已经堆了多少」(容量水位,MTTD 以天计),
  # 本组答「现在投不投得出去」(速率,MTTD 以分钟计)。只有后者能在 broker 半夜自杀时
  # 当场响 —— 免Docker Windows 链已有 8 类 broker 自杀故障(INC-20260821-001),而它的
  # 现场表现是 matchmaker / matchmaker_pve / battle_result 被 fail-fast 连带 exit 1,
  # 查那三个服务全是白查。本组的价值就是把矛头直接指回 Kafka。
  #
  # 【指标来源】pkg/kafkax/metrics.go(Go)与 python/pandorapy/metrics.py(Python,名字与
  # label 逐字对齐)。15 个接 Kafka 的服务都已挂 /metrics 且在 prometheus.yml 的
  # pandora-go-services job 里,不需要新增抓取配置。
  #
  # 【为什么用 rate 而不是 increase】三条都是「持续在错」而非「错过一次」才值得叫醒人:
  # 单次投递失败在出箱型链路上下一拍就重试掉了,for 时长负责滤掉抖动。
  - orgId: 1
    name: kafka-health
    folder: Pandora Alerts
    interval: 1m
    rules:
      # ── 消费主循环持续报错(critical)──────────────────────────────────
      # 这条是「Kafka 死了」最快的判据:它数的是**根本没拿到消息**(broker 不可达 /
      # rebalance 失败 / 协调者不可用),与 pandora_kafka_consume_total 是两回事。
      # 两者的组合就是分诊表:本条在涨而 consume_total 静止 = Kafka 侧问题;
      # 反过来 consume_total 出现 result=retry/exhausted = 业务 handler 的问题。
      # critical 的理由:battle_result 停止消费 ds.lifecycle 即判弃补偿链停摆,
      # 与既有 critical 三条(分配必失败 / 写入全拒 / 补偿链停摆)同一量级。
      - uid: pandora-kafka-consume-loop-failing
        title: Kafka 消费循环持续报错
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: critical
        annotations:
          summary: 'Kafka 消费循环持续报错 topic={{ $labels.topic }} group={{ $labels.group }},多半是 broker 不可达'
          description: '消费者连消息都拿不到(不是处理失败)。先确认 broker 本身:免Docker 链跑 local_infra.ps1 -Action kafka-health,k8s 看 kafka Pod。broker 若已死,matchmaker / matchmaker_pve / battle_result 会被 fail-fast 连带 exit 1,不要去查那三个服务。消费循环自带 200ms→30s 指数退避,不会打满 CPU,但在 broker 恢复前推送与判弃补偿都是停的。当前速率 {{ with $values.A }}{{ humanize .Value }}{{ else }}无数据{{ end }} 次/秒。'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: pandora-prometheus
            model:
              editorMode: code
              expr: sum by (topic, group) (rate(pandora_kafka_consume_loop_error_total[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { type: gt, params: [0, 0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: $A > 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math

      # ── 投递持续失败(warning)────────────────────────────────────────────
      # 出箱型 topic(player.update / player.experience / mission.update / auction.match)
      # 失败只是延迟,下轮重投不丢;best-effort 型(chat.* / *.audit / 各类 push 事件)
      # 失败即**永久丢事件**,没有任何补偿。所以按 topic 分诊,不要笼统看总量。
      - uid: pandora-kafka-produce-failing
        title: Kafka 投递持续失败
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: 'Kafka 投递持续失败 topic={{ $labels.topic }},出箱型只是延迟、best-effort 型是永久丢事件'
          description: '先按 topic 分档:pandora.player.update / .player.experience / .mission.update / .auction.match 走事务出箱,行留在 MySQL,kafka 恢复后自动排空,只是玩家看到的段位、经验、任务进度会延迟;pandora.chat.* 与 .trade.audit / .auction.audit / .leaderboard.settle 是 best-effort,这段时间的事件永久丢失、没有补偿。若同时有 pandora-kafka-consume-loop-failing 在响,那就是 broker 整体不可达,先修 broker。当前失败速率 {{ with $values.A }}{{ humanize .Value }}{{ else }}无数据{{ end }} 次/秒。'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: pandora-prometheus
            model:
              editorMode: code
              expr: sum by (topic) (rate(pandora_kafka_produce_total{result="error"}[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { type: gt, params: [0, 0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: $A > 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math

      # ── 有消息进了死信队列(warning)──────────────────────────────────────
      # ⚠️ 全仓**没有任何 DLQ 消费者 / 回放器**,infra.md §4.4 承诺的「人工介入」此前没有
      # 任何触发机制 —— 这条规则就是 DLQ 唯一的发现手段。响了必须有人去看 DLQ topic,
      # 否则那些消息就永远躺在那里,而链路看起来一切正常。
      # for 只有 5m:进 DLQ 已经是重试耗尽之后的终态,不需要再等它「持续」。
      - uid: pandora-kafka-dlq-nonzero
        title: 有消息进入死信队列
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: '有消息进入 DLQ topic={{ $labels.topic }} group={{ $labels.group }},没有自动回放,必须人工处理'
          description: '消息已重试耗尽或被判为毒丸,转投 pandora.dlq.<domain>.<event> 后 ack。全仓没有 DLQ 消费者,不会自动回放 —— 不去捞就是永久丢。先看 pandora_kafka_consume_total 的 result 维度定性:poison 多半是双端协议漂移(解码失败),exhausted 是下游持续不可用。再去 DLQ topic 按 dlq-src-topic / dlq-src-partition / dlq-src-offset 三个 header 溯源。当前进 DLQ 速率 {{ with $values.A }}{{ humanize .Value }}{{ else }}无数据{{ end }} 条/秒。'
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: pandora-prometheus
            model:
              editorMode: code
              expr: sum by (topic, group) (rate(pandora_kafka_dlq_total{result="ok"}[15m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { type: gt, params: [0, 0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: $A > 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math
