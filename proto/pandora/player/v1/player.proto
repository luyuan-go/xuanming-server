// Pandora PlayerService 协议。
//
// 职责(docs/design/go-services.md §2.2):
//   - 玩家档案(昵称/头像/等级/段位)
//   - 英雄解锁记录 / 皮肤
//   - MMR 读写(写由 battle_result 调,必须幂等 idempotency_key=match_id)

syntax = "proto3";

package pandora.player.v1;

import "pandora/common/v1/errcode.proto";
import "pandora/inventory/v1/inventory.proto";

service PlayerService {
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateNickname(UpdateNicknameRequest) returns (UpdateNicknameResponse);

  // EnsureProfile 建档并**播种角色名**(账号 / 角色分离,2026-08-18)。
  //
  // 系统 RPC:只允许后端内部直连(当前唯一调用方是 login),带玩家 JWT 的客户端调用一律拒,
  // 且在 Envoy 路由层精确 403 —— 否则玩家可以拿它给自己起任意昵称,绕过改名的所有限制。
  //
  // 语义是 **INSERT IGNORE(建档即定名),不是 UPSERT**:
  //   - 档案不存在 → 建档,nickname = 请求里的 nickname;
  //   - 档案已存在 → **完全不动**,原样返回既有昵称(created=false)。
  // 这条纪律是"角色名 = 账号名"能安全落地的前提:login 每次登录都会尽力播种(补上
  // 之前因 player 不可达而漏掉的),若语义是覆盖式,玩家将来自己改的名字会在下次登录
  // 被账号名冲掉。
  //
  // 昵称冲突(uk_nickname 已被别人占用)返回 ErrPlayerNicknameTaken,由调用方决定
  // 降级策略(login 的做法:记日志放弃播种,让 player 自己的默认前缀名生效,不阻断登录)。
  rpc EnsureProfile(EnsureProfileRequest) returns (EnsureProfileResponse);

  // GetPlayerNames 批量反查**角色显示名**(Hub DS 头顶铭牌用,2026-08-18)。
  //
  // 系统 RPC:只允许后端内部直连(当前调用方是 Hub DS),带玩家 JWT 的调用一律拒,
  // 且在 Envoy 客户端面精确 403、只在 DS 面(:8444)放行。玩家想看别人的名字走
  // team / friend / guild 各自的成员列表,不该有一个「按任意 player_id 查名字」的公开入口。
  //
  // 为什么单开一个而不复用 GetProfile:GetProfile 返回等级 / 段位 / 战绩 / 经验一整份档案,
  // 而 DS 只需要一个名字。把整份档案开到 DS 面等于无谓放大爆炸半径(§9.6「爆炸半径」内核),
  // 且 500 人大厅逐个 GetProfile 是 500 次往返 —— 本 RPC 是批量的。
  //
  // 只读幂等。查不到的 player_id **不出现在响应里**(不返回空名字占位):
  // 「查不到」与「名字是空串」必须可区分,前者调用方应保留旧值 / 走兜底,后者是真数据。
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE DS 与 Team internal 入口共用 canonical name messages。
  rpc GetPlayerNames(GetPlayerNamesRequest) returns (GetPlayerNamesResponse);
  rpc ListHeroes(ListHeroesRequest) returns (ListHeroesResponse);
  rpc UnlockHero(UnlockHeroRequest) returns (UnlockHeroResponse);
  rpc GetMMR(GetMMRRequest) returns (GetMMRResponse);
  rpc UpdateMMR(UpdateMMRRequest) returns (UpdateMMRResponse);

  // ── 出战养成(选英雄 / 属性加点 / 出战快照)──
  // 边界(docs/design/ds-arch.md §0):仅大厅态持久化与配置;纯战斗内逻辑(技能/出装/
  // 道具即时使用)走 UE GAS,不经 gRPC。GetLoadout 提供"开战前快照"。
  rpc SelectHero(SelectHeroRequest) returns (SelectHeroResponse);
  rpc GetActiveHero(GetActiveHeroRequest) returns (GetActiveHeroResponse);
  rpc GrantAttributePoints(GrantAttributePointsRequest) returns (GrantAttributePointsResponse);
  rpc AllocateAttributePoints(AllocateAttributePointsRequest) returns (AllocateAttributePointsResponse);
  rpc ResetAttributes(ResetAttributesRequest) returns (ResetAttributesResponse);
  rpc GetAttributes(GetAttributesRequest) returns (GetAttributesResponse);

  // ── 出战装备预设 / 天赋树(W5 ② loadout)──
  // 装备预设 = 大厅态"出装预设"(引用装备配置 ID),开战前转成初始 GameplayEffect;
  // 战斗内买装 / 换装走 UE GAS,不经 gRPC(ds-arch.md §0.1、§0.5)。
  rpc SetEquipment(SetEquipmentRequest) returns (SetEquipmentResponse);
  rpc GetEquipment(GetEquipmentRequest) returns (GetEquipmentResponse);
  rpc GrantTalentPoints(GrantTalentPointsRequest) returns (GrantTalentPointsResponse);
  rpc SetTalents(SetTalentsRequest) returns (SetTalentsResponse);
  rpc ResetTalents(ResetTalentsRequest) returns (ResetTalentsResponse);
  rpc GetTalents(GetTalentsRequest) returns (GetTalentsResponse);

  // 技能卡:持有(GrantSkillCards 系统发放)、培养(UpgradeSkillCard 消耗碎片升级)、
  // 更换(SetSkillSlots 全量替换卡槽装配)。
  rpc GrantSkillCards(GrantSkillCardsRequest) returns (GrantSkillCardsResponse);
  rpc UpgradeSkillCard(UpgradeSkillCardRequest) returns (UpgradeSkillCardResponse);
  rpc SetSkillSlots(SetSkillSlotsRequest) returns (SetSkillSlotsResponse);
  rpc GetSkillCards(GetSkillCardsRequest) returns (GetSkillCardsResponse);

  rpc GetLoadout(GetLoadoutRequest) returns (GetLoadoutResponse);

  // ── 领奖(签到里程碑 / 成就 / 新手 / 永久任务 / 活动)──
  // 客户端经 Envoy 调用领取奖励档位;服务端权威判重幂等(不变量 §2 / §7),
  // 永久类与活动类分别落进玩家领奖记录(见 RewardClaimStorageRecord)。
  // 响应只回客户端可见最小视图(§14),不外露存储位图。
  rpc ClaimReward(ClaimRewardRequest) returns (ClaimRewardResponse);
  rpc GetRewardClaims(GetRewardClaimsRequest) returns (GetRewardClaimsResponse);

  // ── 玩家等级经验(实时成长,docs/design/realtime-progression.md)──
  // AddExperience 幂等入账经验并结算等级(连升多级 / Lv 上限封顶 / 满级 no-op)。
  // 系统 RPC:只允许后端内部直连(battle_result progress 出箱 worker / 任务完成点 / GM),
  // 带玩家 JWT 的客户端调用一律拒绝,且不在 Envoy 暴露(客户端不能给自己加经验)。
  // 入账成功与经验推送出箱(PlayerExperienceEvent)同一事务提交,push 经独立 topic
  // pandora.player.experience(event_type=1)通知客户端刷新经验条 / 播升级表现
  // (不复用 pandora.player.update:旧 player 副本按 MMR 事件解码会被污染,§21 混跑安全)。
  rpc AddExperience(AddExperienceRequest) returns (AddExperienceResponse);
}

// PlayerInternalService 只供受信后端服务读取 player 域权威最小投影。
// 不经客户端/DS Envoy 暴露；实现层仍强制 request-bound internalrpcauth，网络位置不是身份。
service PlayerInternalService {
  // ResolvePlayerNames 供 team 组装成员视图时按 player_id 有界批量读取角色显示名。
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE Team 与 DS 入口共用 canonical name messages。
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME 避免复制同形 request 造成协议漂移。
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME 避免复制同形 response 造成协议漂移。
  rpc ResolvePlayerNames(GetPlayerNamesRequest) returns (GetPlayerNamesResponse);
}

// ===== 玩家档案 =====

// PlayerRating 是玩家在**某一个段位池**下的一份段位分(2026-08-11 段位分区)。
//
// rating_pool 的取值来自关卡表「段位池」列(如 "5v5_ranked" / "3v3_ranked"),
// 语义只有"同值即同一份段位"——服务端不解析其内容,只当分区键用。
// 存储权威是 `player_mmr(player_id, rating_pool)`;本 message 是客户端可见结构
// (§5.11:不外露 updated_at 等存储侧字段)。
message PlayerRating {
  string rating_pool = 1;
  int32  mmr         = 2;
}

message PlayerProfile {
  uint64 player_id     = 1;
  string nickname      = 2;
  int32  level         = 3;
  // mmr #4 是已发布客户端读取的单值段位兼容字段。段位分池 expand 窗口内不能原地删除；
  // 新服务须继续填充本字段（旧全局口径 / 默认池兼容视图），新客户端改读 ratings #52。
  // 等最后一个旧客户端版本排空并完成 Stable/Canary 混跑验证后，才能另行 contract：
  // reserved 4 + reserved "mmr"。在此之前只允许 deprecated，不允许删除或改号。
  int32  mmr           = 4 [deprecated = true];
  string avatar        = 5;
  int64  created_at_ms = 6;
  int64  last_seen_ms  = 7;
  // 8-9 reserved core
  reserved 8 to 9;

  int32  total_battles = 10;
  int32  total_wins    = 11;
  // 12-49 reserved for stats
  reserved 12 to 49;

  // ── 玩家等级经验(实时成长;level 字段见 3)──
  // exp_in_level 是**级内经验**(不是账号累计);客户端用 CfgPlayerLevelExp 表补
  // "升到下一级所需经验"。is_max_level=true 时 UI 显示满条 + MAX(exp_in_level 恒 0)。
  // 用 50/51 新编号,不收窄 12-49 预留段(buf breaking RESERVED 门禁保持绿,审计 P1)。
  uint64 exp_in_level = 50;
  bool   is_max_level = 51;

  // ── 段位(按 rating_pool 分区,2026-08-11)──
  // 一个玩家在每个段位池下各有一份分,由关卡表 rating_pool 列决定某张图算进哪一份
  // (「3v3 与 5v5 不共用同一份段位」是产品口径)。只返回该玩家**已有记录**的池:
  // 没打过的池不在列表里(不返回"基线 1500"占位——那会把"没打过"伪装成"已定级")。
  // 顺序按 rating_pool 字典序,保证同一份档案多次查询结果稳定(客户端可直接渲染)。
  // 用 52 新编号,不收窄 12-49 预留段(同 exp_in_level/is_max_level 的做法)。
  repeated PlayerRating ratings = 52;
}

message GetProfileRequest {
  uint64 player_id = 1;
}

message GetProfileResponse {
  pandora.common.v1.ErrCode code = 1;
  PlayerProfile profile = 2;
}

message UpdateNicknameRequest {
  uint64 player_id = 1;
  string nickname  = 2;
}

message UpdateNicknameResponse {
  pandora.common.v1.ErrCode code = 1;
}

message EnsureProfileRequest {
  uint64 player_id = 1;
  // nickname:建档时要用的角色名。空 = 用 player 服务自己的默认前缀名(Player_<player_id>),
  // 与本 RPC 出现之前的行为一致。
  //
  // 仅在**首次建档**时生效(见 RPC 注释:INSERT IGNORE 语义)。档案已存在时本字段被忽略,
  // 绝不覆盖玩家现有昵称。
  string nickname  = 2;
}

// PlayerName 是「角色实体 → 显示名」的最小映射(客户端可见结构,§5 第 8 条)。
message PlayerName {
  uint64 player_id = 1;
  string nickname  = 2;
}

message GetPlayerNamesRequest {
  // player_ids:要反查的角色实体 ID。
  //
  // 服务端按 max_player_names_per_query(默认 200)截断:§9.18 要求读取侧有单次返回上限。
  // 500 人大厅由调用方自己分批 —— 不在服务端做隐式分页,否则调用方会以为拿全了。
  repeated uint64 player_ids = 1;
}

message GetPlayerNamesResponse {
  pandora.common.v1.ErrCode code = 1;
  // names:只含**查到的**角色。请求里有、响应里没有 = 该角色无档案,
  // 调用方应保留旧值或走自己的兜底,不要当成"名字是空串"。
  repeated PlayerName names = 2;
}

message EnsureProfileResponse {
  pandora.common.v1.ErrCode code = 1;
  // created:true = 本次调用真的建了档(nickname 生效);false = 档案早就存在,什么都没改。
  // 调用方据此判断"播种成功了没有",不要靠 code==OK 推断 —— 两种情况都是 OK。
  bool created = 2;
  // effective_nickname:调用结束后该角色**实际**的昵称。
  // created=false 时即既有昵称(可能与请求的 nickname 不同),供调用方对账 / 打日志。
  string effective_nickname = 3;
  // level:调用结束后该角色的等级(刚建档为 1)。
  //
  // 顺带返回是因为调用方(login 的选角列表)本来就要展示它,而档案行此刻就在手边;
  // 单独再发一次 GetProfile 等于在登录热路径上多一次跨服务往返。
  uint32 level = 4;
}

// ===== 英雄 =====

message ListHeroesRequest {
  uint64 player_id = 1;
}

message ListHeroesResponse {
  pandora.common.v1.ErrCode code = 1;
  repeated uint32 hero_ids = 2;
}

message UnlockHeroRequest {
  uint64 player_id = 1;
  uint32 hero_id   = 2;
  string source   = 3;  // "purchase" | "reward" | "freebie"
}

message UnlockHeroResponse {
  pandora.common.v1.ErrCode code = 1;
}

// ===== MMR(段位)=====

message GetMMRRequest {
  uint64 player_id = 1;
  // 段位池:查哪一份段位分。空 = 默认池(见 biz.DefaultRatingPool),
  // 兼容旧调用方与本字段上线前的行为(§9.21)。
  string rating_pool = 2;
}

message GetMMRResponse {
  pandora.common.v1.ErrCode code = 1;
  int32 mmr = 2;
  // 回显本次实际查询的池(空入参被解析成默认池后的结果),便于调用方对账。
  string rating_pool = 3;
  // found=false 表示该玩家在该池**没有任何记录**(没打过),mmr 为基线分。
  // 与"打到基线分"不同:前者不该展示成已定级,由调用方决定怎么呈现。
  bool found = 4;
}

// UpdateMMR 必须幂等(idempotency_key 通常是 match_id)。
// 同一 idempotency_key 重复调用,服务端只算一次。
message UpdateMMRRequest {
  uint64 player_id       = 1;
  int32  delta           = 2;
  string reason          = 3;  // "win" | "lose" | "abandon" | "rollback"
  string idempotency_key = 4;  // 一般是 match_id
  // 段位池:改哪一份段位分。空 = 默认池(§9.21 兼容旧调用方)。
  // 幂等键仍是 (player_id, idempotency_key) —— 一个 match 只属于一个池,
  // 不把 rating_pool 混进幂等键(否则同一场比赛换个池名就能重复入账)。
  string rating_pool = 5;
}

message UpdateMMRResponse {
  pandora.common.v1.ErrCode code = 1;
  int32 new_mmr = 2;
}

// ===== 推送事件(kafka pandora.player.update / pandora.player.experience)=====

// PlayerUpdateEvent 是玩家档案变更事件(kafka key = player_id,不变量 §9)。
//
// W4 ③:battle_result 结算后发本事件携带 mmr_delta(reason="win"/"lose"/"abandon"),
// player 服务上线后消费做幂等 UpdateMMR(idempotency_key=match_id);push 可订阅推客户端。
// W4 ③ 阶段尚无消费方,先定义 proto + 生产侧打通,至少投递一次保留供后续消费。
message PlayerUpdateEvent {
  uint64 player_id = 1;
  uint64 match_id  = 2;  // 幂等键来源
  int32  mmr_delta = 3;
  string reason    = 4;  // "win" | "lose" | "draw" | "abandon"
  int64  ts_ms     = 5;
  // 本局段位池,由 battle_result 从 canonical BattleStorageRecord 定格值带出。
  // 空 = 默认池(旧记录 / 滚动升级期),消费侧按 DefaultRatingPool 兜底。
  string rating_pool = 6;
}

// PlayerPushEventType 是 player 域推送事件类型判别键
// (push.proto §域内多事件类型路由:producer 写 kafka header event_type,
// push 透传进 PushFrame.EventType,客户端按 (topic, event_type) 选 message 反序列化)。
// 0 永远 = pandora.player.update 现有旧事件(PlayerUpdateEvent);编号只增不复用。
// ⚠️ 新事件类型必须开新 topic 而非复用 pandora.player.update:player 旧副本消费该 topic
// 不看 header,新事件会被按 MMR 误解码(§21 混跑安全,详见 pkg/kafkax/topics.go)。
enum PlayerPushEventType {
  PLAYER_PUSH_EVENT_TYPE_LEGACY_UPDATE = 0;  // PlayerUpdateEvent(MMR / 战绩,topic pandora.player.update)
  PLAYER_PUSH_EVENT_TYPE_EXPERIENCE    = 1;  // PlayerExperienceEvent(等级经验快照,topic pandora.player.experience)
}

// PlayerExperienceEvent 玩家经验变化推送(客户端可见结构,player 服务入账后出箱生产,
// kafka topic = pandora.player.experience,key=player_id)。
//
// 客户端契约:
//   - 收到即用权威快照刷新经验条(RequiredExp 查客户端 CfgPlayerLevelExp 表);
//   - levels_gained > 0 → 播一次升级表现(连升多级只播终级一次);
//   - 按"(level, exp_in_level) 单调不回退"丢弃乱序 / 离线补推的旧事件;
//   - is_max_level=true → 显示 MAX 满条(exp_in_level 恒 0)。
message PlayerExperienceEvent {
  uint64 player_id     = 1;
  int32  level         = 2;  // 入账后权威等级
  uint64 exp_in_level  = 3;  // 入账后级内经验(满级恒 0)
  bool   is_max_level  = 4;
  uint32 levels_gained = 5;  // 本次入账升了几级(0 = 未升级)
  int64  ts_ms         = 6;
}

// ===== 出战养成(选英雄 / 属性加点 / 出战快照)=====

// AttributeAllocation 是某条属性的已分配点数(客户端可见结构)。
// attr_key 是属性键(如 "str" / "agi" / "int" / "vit"),由配置约定。
message AttributeAllocation {
  string attr_key = 1;
  int32  points   = 2;
}

// SelectHero 设定出战英雄(只能选已解锁英雄;功能开关关闭时返回 ERR_PLAYER_FEATURE_DISABLED)。
message SelectHeroRequest {
  uint64 player_id = 1;
  uint32 hero_id   = 2;
}

message SelectHeroResponse {
  pandora.common.v1.ErrCode code = 1;
}

message GetActiveHeroRequest {
  uint64 player_id = 1;
}

message GetActiveHeroResponse {
  pandora.common.v1.ErrCode code = 1;
  uint32 hero_id = 2;  // 0 表示未选定
}

// GrantAttributePoints 幂等授予可分配点(idempotency_key 防重复授予,来源:升级/活动)。
message GrantAttributePointsRequest {
  uint64 player_id       = 1;
  int32  points          = 2;  // 须 > 0
  string idempotency_key = 3;
}

message GrantAttributePointsResponse {
  pandora.common.v1.ErrCode code = 1;
  int32 unspent_points = 2;  // 授予后剩余可分配点
}

// AllocateAttributePoints 分配属性点(点数不足返回 ERR_PLAYER_INSUFFICIENT_POINTS)。
message AllocateAttributePointsRequest {
  uint64 player_id = 1;
  repeated AttributeAllocation allocations = 2;  // 每条 points 须 > 0
}

message AllocateAttributePointsResponse {
  pandora.common.v1.ErrCode code = 1;
  int32 unspent_points = 2;  // 分配后剩余可分配点
}

// ResetAttributes 洗点(已分配点全退回可分配点)。
message ResetAttributesRequest {
  uint64 player_id = 1;
}

message ResetAttributesResponse {
  pandora.common.v1.ErrCode code = 1;
  int32 unspent_points = 2;  // 洗点后可分配点
}

message GetAttributesRequest {
  uint64 player_id = 1;
}

message GetAttributesResponse {
  pandora.common.v1.ErrCode code = 1;
  repeated AttributeAllocation attributes = 2;
  int32 unspent_points = 3;
}

// LoadoutEquipment 是出战装备预设的一个槽位(大厅态;开战前转成初始 GameplayEffect,ds-arch §0.5)。
// slot 是装备部位编号(>0,与道具表 equip_slot 同一编号空间);item_config_id 是装备配置 ID(uint32,§12)。
// instance_id 精确定位玩家拥有的唯一装备实例(uint64,§11)。0 仅用于读取上线前的旧预设:
// 新 SetEquipment 写入必须携带非 0 instance_id,GetLoadout 不会把 instance_id=0 的旧预设
// 转成战斗初始效果,避免同配置多实例时错用词条。
// identified/attributes 是 inventory 域在 GetLoadout 时按 exact pair 返回的权威快照;
// 不从 SetEquipment 请求信任或持久化这两个字段。DS 必须只用此快照施加装备词条。
message LoadoutEquipment {
  uint32 slot           = 1;
  uint32 item_config_id = 2;
  uint64 instance_id    = 3;
  bool identified = 4;
  repeated pandora.inventory.v1.ItemAttribute attributes = 5;
}

// TalentNode 是天赋树某节点的已点等级(客户端可见结构)。
// talent_id 是天赋配置 ID(uint32,§12);level 是已点等级(>0)。
message TalentNode {
  uint32 talent_id = 1;
  int32  level     = 2;
}

// SetEquipment 全量替换出战装备预设(功能开关关闭时返回 ERR_PLAYER_FEATURE_DISABLED)。
message SetEquipmentRequest {
  uint64 player_id = 1;
  repeated LoadoutEquipment equipment = 2;  // 槽位/instance_id 各自唯一;两类 ID 均须 > 0
}

message SetEquipmentResponse {
  pandora.common.v1.ErrCode code = 1;
}

message GetEquipmentRequest {
  uint64 player_id = 1;
}

message GetEquipmentResponse {
  pandora.common.v1.ErrCode code = 1;
  repeated LoadoutEquipment equipment = 2;
}

// GrantTalentPoints 幂等授予天赋点(来源:升级 / 活动,idempotency_key 防重复授予)。
message GrantTalentPointsRequest {
  uint64 player_id       = 1;
  int32  points          = 2;  // 须 > 0
  string idempotency_key = 3;
}

message GrantTalentPointsResponse {
  pandora.common.v1.ErrCode code = 1;
  int32 unspent_points = 2;  // 授予后剩余可点天赋点
}

// SetTalents 全量重置天赋分配(re-spec;sum(level) 超过已授予天赋点 → ERR_PLAYER_INSUFFICIENT_POINTS)。
message SetTalentsRequest {
  uint64 player_id = 1;
  repeated TalentNode talents = 2;  // talent_id 唯一;level 须 > 0
}

message SetTalentsResponse {
  pandora.common.v1.ErrCode code = 1;
  int32 unspent_points = 2;  // 设置后剩余可点天赋点
}

// ResetTalents 清空天赋分配(全部退回可点天赋点)。
message ResetTalentsRequest {
  uint64 player_id = 1;
}

message ResetTalentsResponse {
  pandora.common.v1.ErrCode code = 1;
  int32 unspent_points = 2;
}

message GetTalentsRequest {
  uint64 player_id = 1;
}

message GetTalentsResponse {
  pandora.common.v1.ErrCode code = 1;
  repeated TalentNode talents = 2;
  int32 unspent_points = 3;
}

// ── 技能卡(持有 / 培养 / 更换)────────────────────────────────────────────────

// SkillCard 是玩家持有的一张技能卡(客户端可见结构)。
//   card_id 指向 j_技能卡.xlsx;level 是已培养等级(>=1,获得即 1 级);
//   shards 是该卡当前碎片余量(升级消耗从这里扣;重复获得同名卡转化为碎片)。
message SkillCard {
  uint32 card_id = 1;
  uint32 level   = 2;
  uint32 shards  = 3;
}

// SkillSlot 是一个技能卡槽的装配(大厅态;开战前随 Loadout 下发,DS 据此给技能)。
//   slot 是槽位序号(0..N-1);card_id 是装在该槽的卡,0 表示空槽。
message SkillSlot {
  uint32 slot    = 1;
  uint32 card_id = 2;
}

// GrantSkillCards 幂等发放技能卡 / 碎片(系统 RPC,不经 Envoy;来源:抽卡 / 活动 / GM)。
//   已持有该卡时,shards 累加到碎片余量;未持有则以 1 级建卡并把 shards 记为初始余量。
message GrantSkillCardsRequest {
  uint64 player_id       = 1;
  repeated SkillCardGrant grants = 2;
  string idempotency_key = 3;
}

// SkillCardGrant 一次发放中的一项。shards 可以为 0——那表示"只解锁这张卡,不给碎片"。
message SkillCardGrant {
  uint32 card_id = 1;
  uint32 shards  = 2;
}

message GrantSkillCardsResponse {
  pandora.common.v1.ErrCode code = 1;
  repeated SkillCard cards = 2;  // 发放后该玩家的全部持有卡
  bool already = 3;              // true = 幂等命中,本次未重复发放
}

// UpgradeSkillCard 消耗碎片把一张卡升一级(每次只升一级,便于客户端逐级确认消耗)。
message UpgradeSkillCardRequest {
  uint64 player_id = 1;
  uint32 card_id   = 2;
}

message UpgradeSkillCardResponse {
  pandora.common.v1.ErrCode code = 1;
  SkillCard card = 2;          // 升级后的该卡状态(等级 + 剩余碎片)
  uint32 shard_cost = 3;       // 本次实际消耗的碎片数
}

// SetSkillSlots 全量替换卡槽装配(更换技能卡;未列出的槽视为清空)。
//   card_id=0 表示显式清空该槽;同一张卡不得占用多个槽。
message SetSkillSlotsRequest {
  uint64 player_id = 1;
  repeated SkillSlot slots = 2;
}

message SetSkillSlotsResponse {
  pandora.common.v1.ErrCode code = 1;
  repeated SkillSlot slots = 2;  // 设置后的权威装配
}

message GetSkillCardsRequest {
  uint64 player_id = 1;
}

message GetSkillCardsResponse {
  pandora.common.v1.ErrCode code = 1;
  repeated SkillCard cards = 2;
  repeated SkillSlot slots = 3;  // 一次往返拿齐"有哪些卡"和"装了哪几张"
}

// PlayerLoadout 是开战前快照(出战英雄 + 属性点 + 装备预设 + 天赋 + 技能卡槽),
// 供匹配/进战下发(客户端可见结构)。
message PlayerLoadout {
  uint64 player_id = 1;
  uint32 active_hero_id = 2;
  repeated AttributeAllocation attributes = 3;
  int32 unspent_attr_points = 4;
  repeated LoadoutEquipment equipment = 5;
  repeated TalentNode talents = 6;
  int32 unspent_talent_points = 7;
  // 技能卡槽装配 + 卡等级(DS 据此给技能;等级随卡带出,免得 DS 再查一次持有表)。
  repeated LoadoutSkillCard skill_cards = 8;
}

// LoadoutSkillCard 是出战快照里的一个已装配卡槽(槽位 + 卡 + 该卡等级)。
message LoadoutSkillCard {
  uint32 slot    = 1;
  uint32 card_id = 2;
  uint32 level   = 3;
}

message GetLoadoutRequest {
  uint64 player_id = 1;
}

message GetLoadoutResponse {
  pandora.common.v1.ErrCode code = 1;
  PlayerLoadout loadout = 2;
}

// ===== 领奖记录(存储快照)=====

// RewardClaimStorageRecord 是玩家"领奖记录"的服务端存储快照(CLAUDE.md §5.8 四类命名:
// 存储快照 = <Domain>StorageRecord)。用变长位图(bytes)记录每个奖励档位是否已领取,
// 判重 O(1)、落地紧凑;由 pkg/rewardclaim 在内存里维护、序列化进本 record 的 bytes。
//
// 落地:整条 record 序列化成 bytes 存进 pandora_player.player_reward_claims.record 列
// (player_id PK + version 乐观锁)。和玩家档案同库同 player_id,回档随库一起恢复、
// 合服随 player_id 一起迁移,天然原子(不变量 §2 / §7 幂等;§14 不外露)。
//
// ⚠️ §5.10 / §5.11 / 不变量 §14:本 record 是存储快照,禁止直接返回 / 推送给客户端。
// 面向客户端的领奖结果只回最小视图(已领 / 可领布尔、奖励内容),由服务端从本 record 组装。
//
// permanent:永久类(签到里程碑 / 成就 / 新手 / 永久任务……),key = 来源名(如 "sign_in"
//   / "achievement"),只增不删,bit 位永久稳定。
// activity:活动类,key = 活动实例 ID(每期唯一,含轮次 / 版本);活动下线整条删除回收,
//   下期新活动用新实例 ID 从零开始,即使复用相同档位 bit 也不串味。
message RewardClaimStorageRecord {
  map<string, bytes> permanent = 1;  // 来源名 → 领取位图(变长 bitmap bytes)
  map<uint64, bytes> activity  = 2;  // 活动实例 ID → 领取位图(变长 bitmap bytes)
}

// RewardSourceType 区分领奖来源的两类生命周期(对应 RewardClaimStorageRecord 两张 map)。
enum RewardSourceType {
  REWARD_SOURCE_TYPE_UNSPECIFIED = 0;
  REWARD_SOURCE_TYPE_PERMANENT   = 1;  // 永久类:按来源名(sign_in / achievement / ……)
  REWARD_SOURCE_TYPE_ACTIVITY    = 2;  // 活动类:按活动实例 ID,下线整条回收
}

// ClaimRewardRequest 领取一档奖励(客户端 → player,经 Envoy 鉴权)。
// 服务端把 reward_id(配置 ID)映射成 bit 位,判重幂等后置位并持久化(乐观锁)。
message ClaimRewardRequest {
  uint64 player_id = 1;
  RewardSourceType source_type = 2;
  // 永久类:来源名(如 "sign_in" / "achievement");活动类留空。
  string source = 3;
  // 活动类:活动实例 ID(每期唯一,含轮次);永久类填 0。
  uint64 activity_instance_id = 4;
  // 奖励档位配置 ID(uint32,§12);服务端映射成 bit 位记录领取。
  uint32 reward_id = 5;
}

message ClaimRewardResponse {
  pandora.common.v1.ErrCode code = 1;
}

// GetRewardClaimsRequest 查询某来源已领取的档位(客户端可见最小视图)。
message GetRewardClaimsRequest {
  uint64 player_id = 1;
  RewardSourceType source_type = 2;
  string source = 3;                 // 永久类:来源名;活动类留空
  uint64 activity_instance_id = 4;   // 活动类:活动实例 ID;永久类填 0
}

// GetRewardClaimsResponse 只回已领取的奖励配置 ID 列表(§14 最小视图,不外露存储位图)。
message GetRewardClaimsResponse {
  pandora.common.v1.ErrCode code = 1;
  repeated uint32 claimed_reward_ids = 2;
}

// ===== 玩家等级经验(实时成长)=====

// AddExperienceRequest 幂等入账经验(系统 RPC,不经 Envoy)。
// 幂等键约定(单点入口清单见 realtime-progression.md §4.4):
//   击杀怪物  progress:{match_id}:{seq}:{player_id}:exp(battle_result progress 出箱)
//   完成任务  quest:{player_id}:{quest_id}
//   GM 补发   gm:{operation_id}
message AddExperienceRequest {
  uint64 player_id       = 1;
  uint64 exp_delta       = 2;  // 须 > 0(服务端另有单次上限,超限拒)
  string reason          = 3;  // "monster_kill" | "quest" | "gm"(审计)
  string idempotency_key = 4;
  // 段位池:改哪一份段位分。空 = 默认池(§9.21 兼容旧调用方)。
  // 幂等键仍是 (player_id, idempotency_key) —— 一个 match 只属于一个池,
  // 不把 rating_pool 混进幂等键(否则同一场比赛换个池名就能重复入账)。
  string rating_pool = 5;
}

message AddExperienceResponse {
  pandora.common.v1.ErrCode code = 1;
  int32  level         = 2;  // 入账后权威等级
  uint64 exp_in_level  = 3;  // 入账后级内经验(满级恒 0)
  bool   is_max_level  = 4;
  uint32 levels_gained = 5;  // 本次入账升级数(幂等命中 / 满级 no-op 时为 0)
  bool   already       = 6;  // true = 幂等命中,本次未重复入账
}
