// Pandora TeamService 协议。
//
// 职责(docs/design/go-services.md §2.7):组队(5 人队)
// 状态机:FORMING → READY(全员 ready)→ MATCHING → IN_BATTLE → DISBANDED
//
// 推送架构(ds-arch.md §0.8):
//   "队伍状态变更"通过 kafka topic `pandora.team.update`(key=player_id)
//   广播给所有相关玩家所在的 push 服务 → push 服务 server stream 推给客户端。
//   本 service **不提供** StreamTeamUpdates RPC。

syntax = "proto3";

package pandora.team.v1;

import "pandora/common/v1/errcode.proto";

// 所有写 RPC 均为"立即完成型":biz 完成状态机迁移 + 写 redis + 发 kafka 后立刻返回。
//   - 不阻塞等待外部服务;不 hold 连接
//   - PushToPlayers 不发给 caller(协议原则 2)
// StartMatch → 由 matchmaker 负责(W3 ⑧),此处不提供 RPC。
service TeamService {
  rpc CreateTeam(CreateTeamRequest) returns (CreateTeamResponse);       // 立即完成型
  rpc Invite(InviteRequest) returns (InviteResponse);                    // 立即完成型;push 不发 inviter
  rpc AcceptInvite(AcceptInviteRequest) returns (AcceptInviteResponse);  // 立即完成型
  rpc LeaveTeam(LeaveTeamRequest) returns (LeaveTeamResponse);           // 立即完成型
  rpc Kick(KickRequest) returns (KickResponse);                          // 立即完成型;push 不发 captain
  rpc SetReady(SetReadyRequest) returns (SetReadyResponse);              // 立即完成型
  rpc GetTeam(GetTeamRequest) returns (GetTeamResponse);                 // 只读,按 team_id 查任意队伍快照
  rpc GetMyTeam(GetMyTeamRequest) returns (GetMyTeamResponse);           // 只读,登录后进大厅查"我的队伍"完整快照(队伍主界面)
  rpc ListMyPendingInvites(ListMyPendingInvitesRequest) returns (ListMyPendingInvitesResponse);  // 只读,拉取兜底:查"发给我的待处理邀请"

  // ── 找队伍(玩家没有队伍时的入口) ──────────────────────────────────────────
  rpc SetTeamMap(SetTeamMapRequest) returns (SetTeamMapResponse);        // 立即完成型;队长设置本队目标关卡(招募/列表筛选依据)
  rpc ListOpenTeams(ListOpenTeamsRequest) returns (ListOpenTeamsResponse);  // 只读,列开放招募的队伍(全部 / 指定 map_id),单次上限见 max_open_teams_per_query
  rpc ApplyToTeam(ApplyToTeamRequest) returns (ApplyToTeamResponse);     // 立即完成型;按服务端 join_policy 走"申请待审批"或"直接入队"
  rpc ListTeamApplications(ListTeamApplicationsRequest) returns (ListTeamApplicationsResponse);  // 只读,队长查本队待处理入队申请
  rpc HandleTeamApplication(HandleTeamApplicationRequest) returns (HandleTeamApplicationResponse);  // 立即完成型;队长同意/拒绝一份入队申请

  // ── 内部:组票前的 roster fence(matchmaker 专用,不对客户端开放)─────────────
  //
  // BeginTeamMatch 在 team 自己的乐观锁内**原子地**完成
  // 「校验 + 冻结名单 + **消费 ready** + 返回消费前快照」。
  //
  // # ready 是一次开局授权,在这里被一次性消费(方案 A,2026-08-13 拍板)
  //
  // 队伍的 ready 不是「一个可以反复使用的状态」,而是**一次 StartMatch 的单次授权**。
  // 本 RPC 在同一把锁里把它兑掉:清空本次名单成员的 ready、把队伍转回 FORMING,
  // 并返回**消费前**的名单快照给 matchmaker 建票。
  //
  // 这样「一次 ready 意图最多授权一次 StartMatch」就是一把乐观锁的直接后果,
  // 而不是要靠赛后一条可能丢失、可能迟到、可能跨代的复位 RPC 去维持的东西。
  // 由此消失的整类问题:ACK 丢失后重投抹掉新意图、离队重入的 player_id 级 ABA、
  // 「claim 已释放但 End 还没到」窗口里用旧 ready 开出下一局、以及发布顺序依赖。
  //
  // 代价(已知并接受):排队取消、准入闸拒绝、成局失败之后,玩家都要**重新点准备**。
  // 失败方向是安全的 —— 多按一次,不会多开一局。
  //
  // 重试语义见 MatchStartReceipt:同一 attempt 的重试拿回同一份快照,不会消费两次。
  //
  // 为什么名单必须在锁内冻结:matchmaker 原先用只读 GetTeam 取名单,而 team 侧的自动摘人
  // (离线超时)用的是另一把锁,两者跨服务凑不出共同线性化点 —— 于是存在
  // 「闸门放行 → 名单被冻进票据 → 才把人摘走」的窗口,结果是人在票据里却不在队伍里,
  // 被拉进一场自己不在场的对局。把「读名单」升级成「在锁内读并上锁」,窗口才真正消失。
  //
  // 锁的形态刻意是**短租约**而不是 TeamState=MATCHING:
  //   - 写 State 需要有人负责改回来,matchmaker 中途崩溃就会把队伍永久卡在 MATCHING
  //     (违反不变量 §20「任何代码都不能让玩家卡死」),这也正是 State 至今没有写入点的原因;
  //   - 短租约到期自净,不需要补偿路径。它只需覆盖「组票 → ClaimPlayer 落地」这一小段(秒级);
  //     此后整场对局的占用判定仍由 matchmaker 的 player→ticket claim(ResolvePlayerMatchContext)负责。
  // 因此这把锁不是权威状态,只是一个有界互斥窗口,不得被解释成「队伍在对局中」。
  rpc BeginTeamMatch(BeginTeamMatchRequest) returns (BeginTeamMatchResponse);

  // EndTeamMatch 对局结束后复位队伍准备状态。
  //
  // # 它不再是正确性路径(方案 A,2026-08-13 拍板)
  //
  // 事故的第一根因是 team 侧**没有任何一条 match-ended 路径**:一局打完队伍仍是
  // TEAM_STATE_READY、全员 ready 原样保留,队长可以在队友还卡在结算界面时立刻再开一局
  // (当天仅隔 75 秒),把人冻进新票据 —— DS 拿到 6 人 roster 只进来 5 个。
  //
  // 修法有两条路。曾经的 v2 走「ready 保留到赛后,由本 RPC 复位」,但那要求本 RPC 携带完整
  // 代际 fence 才能跨代幂等(ACK 丢失 → 玩家 re-ready → 旧 outbox 重投抹掉新意图),
  // 且 claim 释放到 End 成功之间仍留着用旧 ready 开下一局的窗口。
  //
  // 拍板改走方案 A:**ready 在 BeginTeamMatch 里被一次性消费**(见该 RPC)。
  // 于是「一次 ready 意图最多授权一次 StartMatch」由一把乐观锁保证,根本不存在
  // 「结束后还欠一次复位」的状态,本 RPC 也就不再承担任何正确性。
  //
  // # 那为什么还留着
  //
  // 纯粹为**滚动升级共存窗口**:新 matchmaker 可能打到**旧 team**(Begin 还不消费 ready),
  // 那种组合下仍靠本 RPC 复位,否则事故行为会在升级窗口内复现。等 team 全量升级后,
  // 下一个版本可以连同调用方一起删除(§9.21 加法演进,先停止调用再删接口)。
  //
  // 对**新 team** 而言本 RPC 已是准 no-op:ready 早在 Begin 就清空了,重复调用零写零推送。
  rpc EndTeamMatch(EndTeamMatchRequest) returns (EndTeamMatchResponse);

  // ── 内部:按 player_id 反查队伍编号(DS 出生编制专用,不对客户端开放)────────────
  //
  // DS 在玩家进场时需要把「谁和谁是一伙的」写到实体上,否则大厅里所有玩家共用玩家阵营,
  // 队友与路人无从区分。它手上只有 player_id。
  //
  // 为什么不复用现有两个读接口:
  //   - GetMyTeam 的 player_id 已被删除并 reserved,身份一律取自 JWT。「客户端不应自报」
  //     是刻意的 IDOR 防线,不能为了 DS 的需要把它开回去;
  //   - GetTeam 按 team_id 查,而 DS 不知道 team_id。
  //
  // 只回编号不回名单:DS 只需要判定「同队与否」,把整份 Team 快照发给它是无谓的扩面。
  rpc GetPlayerTeam(GetPlayerTeamRequest) returns (GetPlayerTeamResponse);
}

enum TeamState {
  TEAM_STATE_UNSPECIFIED = 0;
  TEAM_STATE_FORMING     = 1;
  TEAM_STATE_READY       = 2;
  TEAM_STATE_MATCHING    = 3;
  TEAM_STATE_IN_BATTLE   = 4;
  TEAM_STATE_DISBANDED   = 5;
}

// TeamJoinPolicy 决定 ApplyToTeam 的语义:走"申请 → 队长审批"还是"直接入队"。
//
// **不是每队一份存储状态**:取值来自服务端配置 TeamConf.join_policy,由服务端在组装
// 客户端可见结构时填入(§9.11 派生字段服务端重算 / §9.22 不重复影子状态)。改配置即时
// 对全服生效,不需要给每支队伍存一份、也不存在队伍存的值与配置漂移的问题。
//
// 客户端只用它决定按钮文案与交互(「申请入队」还是「加入队伍」),不得据此跳过服务端校验;
// UNSPECIFIED(老服务端未填 / 未知新值)一律按 APPROVAL 保守渲染,能不能进以服务端返回为准。
enum TeamJoinPolicy {
  TEAM_JOIN_POLICY_UNSPECIFIED = 0;  // 未知:客户端按 APPROVAL 保守处理
  TEAM_JOIN_POLICY_APPROVAL    = 1;  // 申请进入队伍待处理列表,队长同意才入队
  TEAM_JOIN_POLICY_OPEN        = 2;  // 未满即直接入队,无需队长操作
}

message TeamMember {
  uint64 player_id = 1;
  string nickname  = 2;
  int32  mmr       = 3;
  bool   ready     = 4;
  uint32 hero_id   = 5;
  // 6-9 reserved
  reserved 6 to 9;
  // player_no 是 login/account 权威分配的角色展示编号；0 表示仍在补号或本次投影查询失败。
  // 它绝不能替代 player_id 参与身份、路由、外键、幂等或队伍成员关系判断，也不写入
  // TeamMemberStorageRecord，避免在 team Redis 中形成会漂移的展示影子。
  uint64 player_no = 10;
}

message Team {
  uint64 team_id       = 1;
  uint64 captain_id    = 2;
  repeated TeamMember members = 3;
  TeamState state      = 4;
  int64  created_at_ms = 5;
  int32  max_size      = 6;  // MOBA 5
  // 7-9 reserved
  reserved 7 to 9;
  // 本队目标关卡(FCfgLevel::Id / 配置表 ID,§5.6 用 uint32)。0 = 队长尚未选图。
  // 队长通过 SetTeamMap 设置;ListOpenTeams 按它做"固定 map_id"筛选;StartMatch 仍以
  // 客户端本次请求携带的 map_id 为准(本字段是招募展示与筛选依据,不改匹配入口签名,§17.1)。
  uint32 map_id        = 10;
  // 本次响应组装时的入队策略(派生自服务端配置,非队伍存储状态,见 TeamJoinPolicy 注释)。
  TeamJoinPolicy join_policy = 11;
}

// Redis 内部存储快照,对应 key `pandora:team:{team_id}` 的 protobuf bytes。
// 不直接复用 Team,因为存储层需要 updated_at_ms。
message TeamMemberStorageRecord {
  uint64 player_id = 1;
  string nickname  = 2;
  int32  mmr       = 3;
  bool   ready     = 4;
  uint32 hero_id   = 5;
  // 6-9 reserved
  reserved 6 to 9;
}

message TeamStorageRecord {
  uint64 team_id       = 1;
  uint64 captain_id    = 2;
  TeamState state      = 3;
  repeated TeamMemberStorageRecord members = 4;
  int64  created_at_ms = 5;
  int64  updated_at_ms = 6;
  int32  max_size      = 7;
  // 8-9 reserved
  reserved 8 to 9;
  // 队长设置的目标关卡(配置表 ID,§5.6 uint32)。0 = 未选图,仍会出现在"全部"列表里。
  // 存储侧只存这一份权威;join_policy 不存(全局配置派生,§9.22 不重复影子状态)。
  // 新增字段,老副本写回不会丢(§9.17:read-modify-write 全走 proto.Unmarshal→改→Marshal,
  // 不 DiscardUnknown)。
  uint32 map_id        = 10;

  // ── 组票 roster fence(短租约互斥,见 BeginTeamMatch)────────────────────────
  //
  // match_lock_until_ms:租约截止(unix ms)。到期即自动失效,**没有任何解锁路径需要维护**
  // —— matchmaker 中途崩溃只会让队伍多等这一小段,不会永久卡住(不变量 §20)。
  // match_lock_operation_id:本次组票的稳定 operation id,仅供排障与幂等重入识别。
  //
  // ⚠️ 这两个字段**不表示「队伍在对局中」**。对局占用的唯一权威是 matchmaker 的
  // player→ticket claim(ResolvePlayerMatchContext);这里只是一个秒级的互斥窗口,
  // 用来让「冻结名单」与「移除离线成员」落在 team 的同一把乐观锁里。
  // 任何按「是不是在打」做的判断都不得读这两个字段(§9.22 不重复影子状态)。
  int64  match_lock_until_ms       = 11;
  string match_lock_operation_id   = 12;

  // ── ready 代际 + 待复位标记(INC-20260813-001 ①②)────────────────────────────
  //
  // ready_generation:**任何改变「谁准备好了」的写都必须推进它**(SetReady / 入队 / 离队 /
  // 踢人 / 掉线软化 / 对局结束复位)。它是 EndTeamMatch 的 CAS 依据 ——
  // 没有它,一条迟到的旧局释放会把**下一局**的准备状态清掉:
  // ACK 丢失 → outbox 重投 → 期间玩家已重新点准备 / 离队重入 / 队长已开新局,
  // 旧重投照样把 ready 抹平。有了它,旧重投的 expected 对不上当前代际,直接 no-op。
  //
  // 单调、只增、不回退;0 = 旧记录(滚动升级前写的),按「代际未知」处理 —— 见 EndTeamMatchRequest。
  uint64 ready_generation = 13;

  // 14 曾是 pending_match_reset_gen(「进过一局还没复位」的 durable 标记)。
  // 那是「ready 保留到赛后复位」那一版的兜底;方案 A 把 ready 改成 Begin 时一次性消费后,
  // 整条路径失去存在理由(不存在任何一局「结束后还欠一次复位」),连同兜底一起删除。
  // 该字段从未部署过,编号直接回收;保留 reserved 防将来误用。
  reserved 14;

  // match_start_receipt:上一次 BeginTeamMatch 消费 ready 的收据(方案 A)。
  //
  // 存在的唯一理由是**响应丢失后的重试**:ready 已被消费、队伍已转 FORMING,
  // 没有收据的话 matchmaker 的重试只会拿到「队伍未准备」—— 玩家明明刚点过准备,
  // 却被要求重新点,而第一次调用其实是成功的。收据让同一次尝试的重试拿回
  // **同一份**消费前名单,既不重复消费也不误报失败(§9.23 端到端幂等)。
  MatchStartReceipt match_start_receipt = 15;
}

// MatchStartReceipt 是「这一代 ready 已经被哪一次组票消费掉了」的凭据(方案 A)。
//
// # 重入判定为什么必须同时看 attempt_id 与 post_ready_generation
//
// 只看 attempt_id 不够:matchmaker 的 attempt_id 取自 (team_id, captain_id),
// 对同一个队长的**每一局都相同**(它原本是为「重试续租同一把锁」设计的)。
// 只按它判重入,队长打完一局、全队重新点准备后再开一局,会被误认成上一局的重试,
// 拿回一份**过期名单** —— 那比本次事故更糟。
//
// post_ready_generation 是消费**之后**的代际。任何 ready 意图变更都会推进代际
// (见 ready_generation.go),于是:
//   - 真·重试(玩家什么都没动)→ 当前代际仍等于它 → 判重入,返回同一份快照;
//   - 第二次真实点击(玩家重新点过准备)→ 代际早已前进 → 不是重入 → 正常重新消费。
//
// 这一条同时让**旧 matchmaker 打到新 team 也安全**:它那个跨局复用的 operation_id
// 不再有害。因此方案 A 不需要「谁必须先上线」的发布顺序约束(§9.21)。
message MatchStartReceipt {
  // attempt_id:消费掉这一代 ready 的 BeginTeamMatchRequest.operation_id。
  string attempt_id = 1;
  // roster:消费**前**的队伍快照(各成员当时的 ready 位仍为 true)。
  // 重试必须拿回它而不是当前队伍 —— 当前队伍的 ready 已经被清空了。
  // 用存储侧结构:本消息内嵌在 TeamStorageRecord 里,不外露给客户端(§5.8/§9.14)。
  repeated TeamMemberStorageRecord roster = 2;
  // consumed_ready_generation:被消费掉的那一代(消费前代际),供排障对账。
  uint64 consumed_ready_generation = 3;
  // post_ready_generation:消费落定后的代际,是重入判定的 CAS 依据(见上)。
  uint64 post_ready_generation = 4;
  // created_at_ms:开收据的时刻。超过重入窗后即使前两项都匹配也不再当重试 ——
  // 那时队伍处于 FORMING,玩家本就该重新点准备。窗口是 fail-safe 方向的兜底,
  // 防「消费后长期无人操作,很久以后的一次真实点击被误当成重试」。
  int64 created_at_ms = 5;
}

// ===== RPC =====

message CreateTeamRequest {
  // player_id 已删:身份一律以 JWT x-pandora-player-id 为准,客户端无需也不应自报。
  // 保留字段号 1(勿复用):老客户端仍会发 field 1(varint),复用会让其字节被误解。
  reserved 1;
  reserved "player_id";
}

message CreateTeamResponse {
  pandora.common.v1.ErrCode code = 1;
  uint64 team_id = 2;
  Team   team    = 3;  // 完整快照;客户端无需再发 GetTeam
}

message InviteRequest {
  uint64 team_id          = 1;
  // inviter_id 已删:邀请人以 JWT x-pandora-player-id 为准;字段号 2 勿复用(老客户端仍会发)。
  reserved 2;
  reserved "inviter_id";
  uint64 target_player_id = 3;
}

message InviteResponse {
  pandora.common.v1.ErrCode code = 1;
  Team   team          = 2;  // 发送邀请后的完整队伍快照
  uint64 invite_id     = 3;  // 邀请令牌 ID;AcceptInvite 时回传可校验未过期
  int64  expires_at_ms = 4;  // 邀请过期时间(unix ms)
}

message AcceptInviteRequest {
  // player_id 已删:身份以 JWT x-pandora-player-id 为准;字段号 1 勿复用(老客户端仍会发)。
  reserved 1;
  reserved "player_id";
  uint64 team_id   = 2;
  uint64 invite_id = 3;  // 可选;传入时服务端校验未过期/未取消;不传时仅校验 team_id
}

message AcceptInviteResponse {
  pandora.common.v1.ErrCode code = 1;
  Team team = 2;  // 加入后的完整队伍快照(协议原则 1)
}

message LeaveTeamRequest {
  uint64 team_id   = 1;
  // player_id 已删:身份以 JWT x-pandora-player-id 为准;字段号 2 勿复用(老客户端仍会发)。
  reserved 2;
  reserved "player_id";
}

message LeaveTeamResponse {
  pandora.common.v1.ErrCode code = 1;
  Team team = 2;  // 离开后的队伍快照(已解散时 team.state=DISBANDED)
}

message KickRequest {
  uint64 team_id           = 1;
  // captain_id 已删:队长以 JWT x-pandora-player-id 为准;字段号 2 勿复用(老客户端仍会发)。
  reserved 2;
  reserved "captain_id";
  uint64 target_player_id  = 3;
}

message KickResponse {
  pandora.common.v1.ErrCode code = 1;
  Team team = 2;  // 踢人后的完整队伍快照
}

message SetReadyRequest {
  uint64 team_id   = 1;
  // player_id 已删:身份以 JWT x-pandora-player-id 为准;字段号 2 勿复用(老客户端仍会发)。
  reserved 2;
  reserved "player_id";
  bool   ready     = 3;
  uint32 hero_id   = 4;  // 0=不改 hero 只切 ready 状态;≥1=设英雄并 ready(选英雄一并设置)
}

message SetReadyResponse {
  pandora.common.v1.ErrCode code = 1;
  Team team = 2;  // 变更 ready 状态后的完整队伍快照
}

message GetTeamRequest {
  uint64 team_id = 1;
}

message GetTeamResponse {
  pandora.common.v1.ErrCode code = 1;
  Team team = 2;
}

// GetMyTeam:登录后进大厅时调用,客户端不需要预先知道 team_id。
// 服务端从 JWT x-pandora-player-id 取 player_id → 查 pandora:team:player:<id> 索引。
// 返回完整 Team 快照(队伍主界面直接渲染,无需再发 GetTeam)。
// 带宽说明:这是登录进大厅调一次的 unary,5 人队 Team 序列化后 ~200 字节,
// 比拆成两次 RPC(先查 team_id 再 GetTeam)更省;Team 本身已是 §5.11 客户端最小视图。
message GetMyTeamRequest {
  // player_id 已删:服务端从 JWT x-pandora-player-id 取 player_id,客户端无需也不应自报。
  // 保留字段号 1(勿复用):老客户端仍会发 field 1(varint),复用会让其字节被误解。
  reserved 1;
  reserved "player_id";
}

message GetMyTeamResponse {
  pandora.common.v1.ErrCode code = 1;
  bool has_team_msg = 2;  // false=玩家当前没有队伍(正常态,code 仍为 OK)
  Team team         = 3;  // has_team_msg=false 时为空;完整快照,队伍主界面直接用
}

// ListMyPendingInvites:查询"发给我的待处理邀请"(只读,拉取兜底)。
//
// 为什么需要它(推送单点消除):邀请令牌的唯一权威在 Redis(pandora:team:invite:*),
// kafka→push 推送只是投影/加速器(不变量 §9-22)。此前 invite_id 只能从推送获得,
// producer 故障窗口 / push 副本崩溃 / 客户端恰好断线,邀请就静默失效到 TTL 过期。
// 客户端在登录、回前台、打开组队 UI 时调用本 RPC 兜底,丢推送最多延迟弹窗,不丢邀请。
//
// 上限治理(不变量 §9-18,组队邀请是"客户端可写入的堆积列表"):
//   - 写入侧:同一被邀请人 pending 邀请数上限 TeamConf.max_pending_invites(默认 10),
//     超限 Invite 返回 ERR_TEAM_INVITE_PENDING_LIMIT(3008)。
//   - 读取侧:单次全量返回,服务端按同一上限截断(写入侧硬上限已兜住总量,无需分页)。
message ListMyPendingInvitesRequest {
  // 身份一律以 JWT x-pandora-player-id 为准,客户端无需也不应自报 player_id。
}

// PendingInvite 是待处理邀请的查询视图,与 TeamInviteEvent(推送)字段对齐:
// 客户端拿到后走与收到推送完全相同的弹框/接受流程(AcceptInvite 回传 invite_id)。
message PendingInvite {
  uint64 team_id       = 1;  // 邀请加入的队伍
  uint64 invite_id     = 2;  // 邀请令牌;AcceptInvite 回传校验未过期/未取消
  uint64 inviter_id    = 3;  // 发起邀请的玩家
  int64  expires_at_ms = 4;  // 邀请过期时间(unix ms)
}

message ListMyPendingInvitesResponse {
  pandora.common.v1.ErrCode code = 1;
  repeated PendingInvite invites = 2;  // 按过期时间升序;数量 ≤ max_pending_invites
}

// ===== 找队伍:列表 / 申请 / 审批 =====
//
// 场景:玩家没有队伍时,大厅给一个"获取队伍"入口,拉一批正在招募的队伍,点其中一支申请加入。
//
// 为什么不是新开一条进场链:本组 RPC 只处理**组队**,不碰进入场景/副本的那一条链
// (§17 进入接口仍只有 MatchService.StartMatch)。队伍目标关卡 map_id 是招募展示与筛选
// 依据,读关卡表判定,不引入按关卡分叉的业务逻辑。

// SetTeamMap:队长设置本队目标关卡(招募展示 + ListOpenTeams 的 map_id 筛选依据)。
// 队长身份以 JWT + 服务端队伍快照为准;map_id=0 合法,表示"未指定",只出现在"全部"列表里。
message SetTeamMapRequest {
  uint64 team_id = 1;
  uint32 map_id  = 2;  // 目标关卡配置 ID;0 = 清空(未指定)
}

message SetTeamMapResponse {
  pandora.common.v1.ErrCode code = 1;
  Team team = 2;  // 设置后的完整队伍快照
}

// OpenTeamBrief 是"正在招募的队伍"在列表里的最小展示视图(§9.14 客户端只拿客户端可见结构)。
//
// 刻意不含成员数组:列表页只需要"哪支队、队长是谁、几个人、打哪张图、怎么加入";
// 点进去要看成员再走 GetTeam。队长名字/编号在查询时分别从 player/login 权威批量投影，
// 不读取 TeamMemberStorageRecord.nickname，也不写回组队存储。
message OpenTeamBrief {
  uint64 team_id       = 1;
  uint64 captain_id    = 2;
  uint32 member_count  = 3;  // 当前人数
  uint32 max_size      = 4;  // 队伍容量
  uint32 map_id        = 5;  // 目标关卡;0 = 队长未选图
  int64  created_at_ms = 6;
  TeamJoinPolicy join_policy = 7;  // 决定客户端渲染"申请入队"还是"加入队伍"
  string captain_nickname = 8;     // player 权威角色名；空表示未设置或本次投影失败
  uint64 captain_player_no = 9;    // login/account 权威展示编号；0 表示补号中或本次投影失败
}

// ListOpenTeams:列"开放招募"的队伍。开放 = state=FORMING 且未满员。
//
// 筛选(用户需求的两个参数):
//   - map_id = 0  → 全部开放队伍;
//   - map_id > 0  → 只要目标关卡等于该值的队伍。
// 数量(用户需求的上限 10):limit=0 取服务端默认,服务端一律钳到 [1, max_open_teams_per_query]
// (默认 10)。这是读取侧上限(不变量 §9-18);列表本身是从 Redis 索引读的**非权威投影**,
// 服务端逐条回权威队伍记录复核后才返回,索引脏了只会少返几条,不会返回错的队伍。
message ListOpenTeamsRequest {
  uint32 map_id = 1;  // 0 = 不限关卡
  uint32 limit  = 2;  // 0 = 服务端默认;服务端钳到 [1, max_open_teams_per_query]
}

message ListOpenTeamsResponse {
  pandora.common.v1.ErrCode code = 1;
  repeated OpenTeamBrief teams = 2;  // 按最近活跃降序;数量 ≤ max_open_teams_per_query
}

// ApplyToTeam:申请加入指定队伍。申请人以 JWT x-pandora-player-id 为准。
//
// 一个 RPC 承载两种策略(TeamConf.join_policy),客户端不分叉:
//   - open     → 服务端当场入队,返回 joined=true + 入队后完整快照(与 AcceptInvite 同一入队事务);
//   - approval → 写一份短 TTL 申请令牌,返回 joined=false + expires_at_ms,等队长审批。
// 重复申请同一队伍是幂等的:刷新同一条令牌的过期时间,不额外占配额。
message ApplyToTeamRequest {
  uint64 team_id = 1;
}

message ApplyToTeamResponse {
  pandora.common.v1.ErrCode code = 1;
  bool   joined        = 2;  // true = 已直接入队(open 策略)
  Team   team          = 3;  // joined=true 时为入队后完整快照;joined=false 时不填
  int64  expires_at_ms = 4;  // joined=false 时申请令牌过期时间(unix ms),供客户端显示有界等待
}

// TeamApplication 是一份待处理入队申请的客户端查询视图。
// nickname/player_no 在查询时分别从 player/login 权威批量投影，不写入申请 Redis；
// 两者都只是展示信息，审批、身份、路由和成员关系仍必须只使用 player_id。
message TeamApplication {
  uint64 player_id     = 1;  // 申请人
  int64  expires_at_ms = 2;  // 申请过期时间(unix ms)
  string nickname      = 3;  // player 权威角色名；空表示未设置或本次投影失败
  uint64 player_no     = 4;  // login/account 权威展示编号；0 表示补号中或本次投影失败
}

// ListTeamApplications:队长查本队待处理入队申请(只读,拉取兜底)。
//
// 与 ListMyPendingInvites 同构:申请令牌唯一权威在 Redis,kafka→push
// (TeamUpdateEvent reason=APPLICATION_RECEIVED)只是加速器(§9.22)。队长在打开组队 UI、
// 回前台、收到推送时调用本 RPC 兜底,丢推送最多延迟看到申请,不丢申请。
//
// 上限治理(不变量 §9-18,入队申请是"客户端可写入的堆积列表"):
//   - 写入侧:同一队伍 pending 申请数上限 TeamConf.max_applications_per_team(默认 10),
//     超限 ApplyToTeam 返回 ERR_TEAM_APPLY_PENDING_LIMIT(3009);
//   - 读取侧:单次全量返回,服务端按同一上限截断(写入侧硬上限已兜住总量,无需分页)。
// 非队长调用返回 ERR_TEAM_NOT_CAPTAIN(3003):申请人名单不对普通成员开放。
message ListTeamApplicationsRequest {
  uint64 team_id = 1;
}

message ListTeamApplicationsResponse {
  pandora.common.v1.ErrCode code = 1;
  repeated TeamApplication applications = 2;  // 按过期时间升序;数量 ≤ max_applications_per_team
}

// HandleTeamApplication:队长同意 / 拒绝一份入队申请。队长身份以 JWT + 队伍快照为准。
//
// accept=true  → 与 AcceptInvite 完全相同的入队事务(先 ClaimPlayer 保不变量 §1,再改成员表),
//                入队失败(满员/申请人已在别队)按业务错误返回,申请令牌一并消耗;
// accept=false → 只删申请令牌,释放该队配额。
// 两种结果都幂等:令牌已不在(过期/已被处理/申请人已进队)返回 ERR_TEAM_APPLY_NOT_FOUND(3010)。
message HandleTeamApplicationRequest {
  uint64 team_id      = 1;
  uint64 applicant_id = 2;
  bool   accept       = 3;
}

message HandleTeamApplicationResponse {
  pandora.common.v1.ErrCode code = 1;
  Team team = 2;  // 处理后的完整队伍快照(accept 成功时含新成员)
}

// ===== Kafka 推送 payload =====
//
// topic: pandora.team.update
// key:   player_id(每个相关玩家收到一份;同队 5 人 = 5 条消息,不变量 §9)
// 消费方:push 服务 KafkaConsumer → ConnectionManager.SendTo → 客户端 server stream。
//
// 该 message 通过 KafkaEnvelope.payload 传输,不通过 gRPC 直接 stream。

// TeamPushEventType 是 pandora.team.update **域内的事件类型判别键**,
// 填入 PushFrame.event_type(见 pandora/push/v1/push.proto §event_type)。
//
// 作用:pandora.team.update 这一个 topic 下要承载多种「结构不同」的事件 message;
//       客户端按 (topic=pandora.team.update, event_type) 定位该反序列化哪个 message。
//       这样域内加新事件类型**不新增 topic**(拒绝 topic 爆炸)。
//
// ⚠️ 与 TeamUpdateReason 是两个不同的轴,别混:
//   - TeamPushEventType:选「哪个 message」(TeamUpdateEvent vs 将来的 TeamInviteEvent...)。
//   - TeamUpdateReason  :在 TeamUpdateEvent **内部**说明「这次 update 为什么触发」(播动画/音效)。
//
// 编号规则:**每域独立**(team 的 1 与 match 的 1 无关);**0 永远 = 现有 TeamUpdateEvent**
// (兼容正在游戏中的老客户端:老 producer 不填→缺省 0→旧事件);枚举值只增不复用。
enum TeamPushEventType {
  TEAM_PUSH_EVENT_TYPE_UNSPECIFIED = 0;  // = TeamUpdateEvent(旧事件,向后兼容)
  TEAM_PUSH_EVENT_TYPE_INVITE      = 1;  // payload=TeamInviteEvent(邀请专属事件,见下)
  // 将来新增(示例,当前未启用):
  //   TEAM_PUSH_EVENT_TYPE_DISBAND = 2;  // payload=TeamDisbandEvent
}

// TeamUpdateReason 描述本次 TeamUpdateEvent 的触发原因,供客户端决定播放哪段动画/音效。
// 枚举值编号永不复用(只 reserved)。
enum TeamUpdateReason {
  TEAM_UPDATE_REASON_UNSPECIFIED      = 0;
  TEAM_UPDATE_REASON_MEMBER_JOINED    = 1;
  TEAM_UPDATE_REASON_MEMBER_LEFT      = 2;
  TEAM_UPDATE_REASON_MEMBER_KICKED    = 3;
  TEAM_UPDATE_REASON_MEMBER_READY     = 4;
  TEAM_UPDATE_REASON_HERO_CHANGED     = 5;
  TEAM_UPDATE_REASON_CAPTAIN_TRANSFER = 6;
  TEAM_UPDATE_REASON_STATE_CHANGED    = 7;
  TEAM_UPDATE_REASON_DISBANDED        = 8;
  TEAM_UPDATE_REASON_INVITE_SENT      = 9;
  // 有人申请加入本队(只推给队长)。事件本身不改队伍,只是"去重查申请列表"的提示:
  // 申请令牌的唯一权威在 Redis,ListTeamApplications 才是权威查询(§9.22),推送丢帧
  // 最多延迟队长看到申请,不丢申请。
  TEAM_UPDATE_REASON_APPLICATION_RECEIVED = 10;
  // 队长改了本队目标关卡(SetTeamMap)。
  TEAM_UPDATE_REASON_MAP_CHANGED          = 11;
  // 成员离线超过 team.offline_leave.threshold 被服务端自动移出队伍。
  // 与 MEMBER_KICKED 区分开:那是队长的主动操作,这是系统行为,客户端文案不同
  // (「XXX 掉线已离队」而不是「XXX 被踢出队伍」)。老客户端不认识本值时按
  // UNSPECIFIED 走默认刷新分支,队伍快照仍然正确,只是少一句文案。
  TEAM_UPDATE_REASON_MEMBER_OFFLINE_LEFT  = 12;
}

message TeamUpdateEvent {
  Team   team         = 1;
  // 2 was string change_summary — 已删除(W3 ⑦ Phase 1)
  reserved 2;
  reserved "change_summary";
  uint64 by_player_id = 3;  // 触发本次变更的玩家
  uint64 to_player_id = 4;  // 接收推送的玩家(也是 kafka key)
  int64  ts_ms        = 5;
  // 6-9 reserved
  reserved 6 to 9;
  TeamUpdateReason reason    = 10;  // 变更原因;客户端用于播动画/音效
  // ⚠️ invite_id 为历史字段:邀请曾复用 TeamUpdateEvent(reason=INVITE_SENT)承载。
  //    新客户端改用独立的 TeamInviteEvent(event_type=TEAM_PUSH_EVENT_TYPE_INVITE)。
  //    金丝雀共存期生产者"双发"(TeamConf.invite_push_mode=dual):老客户端认此字段、
  //    新客户端认独立事件,各弹一次不双弹。全量铺完新客户端后切 dedicated 停发本字段
  //    (字节兼容,勿删勿改号)。
  uint64           invite_id = 11;  // [legacy] reason=INVITE_SENT 时填;其他 reason 为 0
}

// TeamInviteEvent 是「收到组队邀请」的**专属事件**,通过 PushFrame.event_type=
// TEAM_PUSH_EVENT_TYPE_INVITE(=1)投递到 topic pandora.team.update。
//
// 为什么独立成一个 message(而不是继续塞进 TeamUpdateEvent):
//   邀请只需「谁邀请我、进哪个队、令牌、何时过期」这几项,不需要 team 全量快照,
//   也不属于「队伍成员变更」语义。塞进 TeamUpdateEvent 会让那个 message 随事件种类
//   膨胀成宽表(每种事件挂一批专属字段、对其他事件全是废字段)。event_type 的本意
//   就是「每种事件 payload 是它自己的 proto」,故邀请独立成 TeamInviteEvent。
//
// 客户端收到后弹「接受/拒绝」邀请框;AcceptInvite 时回传 invite_id 供服务端校验未过期。
message TeamInviteEvent {
  uint64 team_id       = 1;  // 邀请加入的队伍
  uint64 invite_id     = 2;  // 邀请令牌;AcceptInvite 回传校验未过期/未取消
  uint64 inviter_id    = 3;  // 发起邀请的玩家(队内成员)
  uint64 to_player_id  = 4;  // 被邀请人(也是 kafka key)
  int64  ts_ms         = 5;  // 事件产生时间(unix ms)
  int64  expires_at_ms = 6;  // 邀请过期时间(unix ms),与 InviteResponse.expires_at_ms 一致
  // 7-9 reserved(将来如需队长昵称等展示字段)
  reserved 7 to 9;
}

// BeginTeamMatchRequest 由 matchmaker 在组票前调用(内部东西向,不经客户端面)。
message BeginTeamMatchRequest {
  uint64 team_id      = 1;
  // captain_id 取自 matchmaker 已校验的 JWT sub;team 侧仍会复核它确实是本队队长。
  uint64 captain_id   = 2;
  // operation_id:本次进场尝试的 attempt id(§9.23)。同 attempt 重入必须幂等 ——
  // 既不得因为「已经上锁」把自己的重试判成冲突,也不得对同一次尝试**消费两次** ready。
  //
  // ⚠ 它只要求「跨客户端重试稳定」,**不要求全局唯一**:matchmaker 现取
  // (team_id, captain_id),对同一队长的每一局都相同。跨局的区分由收据里的
  // post_ready_generation 完成,不靠这个字段(见 MatchStartReceipt)。
  string operation_id = 3;
  // lease_ms:租约时长。取值只需覆盖「组票 → ClaimPlayer 落地」,秒级即可;
  // 服务端会钳到 [min, max] 防误配成 0(永不生效)或过长(拖住摘人)。
  int64  lease_ms     = 4;
  // require_ready:本图是否走「匹配前准备」(关卡表 ready_mode=PRE_READY)。
  //
  // true  → team 校验队伍 State==READY 才放行组票(不 READY 返回 ErrTeamWrongState);
  // false → 不设门槛,FORMING 也放行(新鲜度由 matchmaker 的撮合确认期承担)。
  //
  // # 为什么判定结果由 matchmaker 搬过来,而不是 team 自己查表
  //
  // 权威的 map_id 是**本次 StartMatch 请求**的那一个,只有 matchmaker 手里有;
  // team 记录里的 map_id 是队长在面板上的选择,可能与本次开局不是同一张图,
  // 拿它查表等于让门槛跟着一个**不参与本次判定**的字段走(§9.22 不建第二份判定)。
  // 这与 entry_mode 的既有做法同构:由 matchmaker 按关卡表解析一次,落定后随流程走。
  //
  // # 滚动升级(§9.21)
  //
  // 旧 matchmaker 不发本字段 → proto3 默认 false → 沿用「无门槛 + 确认期」,
  // 与本字段上线前的行为逐字节一致;新 matchmaker 打到旧 team 则本字段被忽略,
  // 同样退化成无门槛。两个方向都不会把玩家挡在开局之外,失败方向安全。
  bool   require_ready = 5;
}

message BeginTeamMatchResponse {
  pandora.common.v1.ErrCode code = 1;
  // team:**消费前**那一刻的权威快照(成员 ready 位仍为 true)。
  // matchmaker 必须用它建票,不得再另发 GetTeam —— 那读到的是消费**后**的队伍
  // (ready 已清空、状态已转 FORMING),既不是这一局的名单,也会把刚消灭的窗口重新打开。
  Team team = 2;
  // lease_expires_at_ms:租约截止,供 matchmaker 判断自己是否已超时(超时须重新 Begin)。
  //
  // 方案 A 下租约只剩**一个**职责:挡住「冻结名单 → ClaimPlayer 落地」这段时间里的
  // 自动摘人(TOCTOU)。它不再承担任何 ready 正确性 —— ready 在同一把锁里已经消费掉了。
  int64 lease_expires_at_ms = 3;
  // ready_generation:**被本次消费掉**的那一代 ready(消费前代际)。
  //
  // 方案 A 下它不再是正确性凭据(没有任何后续 RPC 拿它做 CAS),只用于两件事:
  //   ①排障对账 —— 把一张票据与 team 侧的哪一次 ready 意图对上;
  //   ②滚动升级共存窗口里,新 matchmaker 打到**旧 team**时仍按老路子回传给 EndTeamMatch。
  // 0 = 旧 team 服务没回。
  uint64 ready_generation = 4;
}

message EndTeamMatchRequest {
  uint64 team_id = 1;
  // player_ids:本局 roster 里属于该队伍的成员。
  // 只复位他们而不是全队,是为了不误伤**对局期间新加入、且自己已经点过准备**的人 ——
  // 他没参与这一局,凭什么被这一局的结束复位。留空 = 复位全队(调用方拿不到名单时的兜底)。
  repeated uint64 player_ids = 2;

  // expected_ready_generation:调用方 Begin 时拿到的 ready 代际。
  //
  // team 侧只在 `team.ready_generation == expected` 时才复位。方案 A 下新 team 的 ready
  // 早在 Begin 就消费掉了,本字段因此几乎总是对不上、本 RPC 几乎总是 no-op —— 这是**对的**:
  // 它只在「新 matchmaker + 旧 team」这一种共存组合里真正动手。
  //
  // 保留 CAS 而不是无条件复位,是因为那种组合下旧 team 的 ready 仍是保留语义,
  // 无条件复位会把玩家在结算期间重新点上的准备抹掉(旧 v2 的原始缺陷)。
  //
  // **0 = 代际未知**(旧 team 没回过代际,或旧 matchmaker 没带)。此时退化为
  // 「只在当前确实还是 READY / 有人挂着 ready 时复位一次」。不是跨代安全的,
  // 但严格优于「完全不复位」—— 那正是本事故的第一根因。
  uint64 expected_ready_generation = 3;
}

message EndTeamMatchResponse {
  pandora.common.v1.ErrCode code = 1;
}

// GetPlayerTeam:内部东西向只读。Envoy 是按 /pandora.team.v1.TeamService/ 整前缀放行的,
// 因此本方法在客户端面同样可达 —— service 层必须显式拒绝任何带玩家 JWT 的调用(callerID>0),
// 否则它就成了一个「查任意玩家在哪支队」的 IDOR 口子。
message GetPlayerTeamRequest {
  uint64 player_id = 1;
}

message GetPlayerTeamResponse {
  pandora.common.v1.ErrCode code = 1;
  // false 表示该玩家当前不属于任何队伍;这不是错误,code 仍为 OK。
  bool has_team = 2;
  // has_team=false 时为 0。
  uint64 team_id = 3;
}
