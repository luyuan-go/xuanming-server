// Pandora FriendService 协议。
//
// 职责(docs/design/go-services.md §2.4):好友 / 黑名单 / 待处理请求。
// 闭环 RPC:请求(AddFriend)/ 查待处理(ListFriendRequests)/ 接受(AcceptFriend)/
//   拒绝(RejectFriend)/ 列表(ListFriends)/ 删除(RemoveFriend)/
//   拉黑(Block)/ 取消拉黑(Unblock)/ 查黑名单(ListBlocks)。
//
// 数据落地:pandora_social 库(friendships / friend_requests / blocks),
// 结构化列直接映射 proto 字段(CLAUDE.md §5.9 关系型表不强制 proto 化 blob)。
// 好友请求 / 接受通过 kafka pandora.friend.event → push 推送给接收方。

syntax = "proto3";

package pandora.friend.v1;

import "pandora/common/v1/errcode.proto";

service FriendService {
  rpc AddFriend(AddFriendRequest) returns (AddFriendResponse);
  rpc AcceptFriend(AcceptFriendRequest) returns (AcceptFriendResponse);
  rpc RejectFriend(RejectFriendRequest) returns (RejectFriendResponse);
  rpc ListFriendRequests(ListFriendRequestsRequest) returns (ListFriendRequestsResponse);
  rpc ListFriends(ListFriendsRequest) returns (ListFriendsResponse);
  rpc RemoveFriend(RemoveFriendRequest) returns (RemoveFriendResponse);
  rpc Block(BlockRequest) returns (BlockResponse);
  rpc Unblock(UnblockRequest) returns (UnblockResponse);
  rpc ListBlocks(ListBlocksRequest) returns (ListBlocksResponse);
  rpc RecommendFriends(RecommendFriendsRequest) returns (RecommendFriendsResponse);
}

enum FriendRequestStatus {
  FRIEND_REQUEST_STATUS_UNSPECIFIED = 0;
  FRIEND_REQUEST_STATUS_PENDING     = 1;
  FRIEND_REQUEST_STATUS_ACCEPTED    = 2;
  FRIEND_REQUEST_STATUS_REJECTED    = 3;
  FRIEND_REQUEST_STATUS_EXPIRED     = 4;
}

// FriendInfo 是客户端可见的好友视图(CLAUDE.md §5.8 客户端可见结构)。
// is_online / last_seen_ms 由 player_locator 实时填充(弱依赖,查不到按离线)。
message FriendInfo {
  uint64 player_id    = 1;
  string nickname     = 2;
  bool is_online      = 3;
  int64 since_ms      = 4;
  int64 last_seen_ms  = 5;
}

message AddFriendRequest {
  // player_id 已删:身份以 JWT x-pandora-player-id 为准(R5);字段号 1 勿复用(老客户端仍会发)。
  reserved 1;
  reserved "player_id";
  uint64 target_player_id = 2;
}

message AddFriendResponse {
  pandora.common.v1.ErrCode code = 1;
  // request_id 是 snowflake 生成的好友请求 ID(uint64,不变量 §9.11)。
  uint64 request_id = 2;
}

message AcceptFriendRequest {
  // player_id 已删:身份以 JWT x-pandora-player-id 为准(R5);字段号 1 勿复用(老客户端仍会发)。
  reserved 1;
  reserved "player_id";
  uint64 request_id = 2;
}

message AcceptFriendResponse {
  pandora.common.v1.ErrCode code = 1;
}

message RejectFriendRequest {
  // player_id 已删:身份以 JWT x-pandora-player-id 为准(R5);字段号 1 勿复用(老客户端仍会发)。
  // 只有请求的 target 本人能拒绝;pending→rejected。不推送给 requester(避免尴尬)。
  reserved 1;
  reserved "player_id";
  uint64 request_id = 2;
}

message RejectFriendResponse {
  pandora.common.v1.ErrCode code = 1;
}

// FriendRequestInfo 是客户端可见的「收到的待处理好友请求」视图(CLAUDE.md §5.8)。
// 只暴露 pending 状态的入站请求(target = 查询者);不暴露内部 status 枚举。
// from_nickname/from_player_no 在查询时分别从 player/login 权威批量投影，不写回申请表；
// 两者只用于展示，接受/拒绝与身份判断仍只使用 request_id/from_player_id。
message FriendRequestInfo {
  uint64 request_id     = 1;
  uint64 from_player_id = 2;  // 发起方(requester)
  string from_nickname  = 3;  // player 权威角色名；空表示未设置或本次投影失败
  int64  created_ms     = 4;
  uint64 from_player_no = 5;  // login/account 权威展示编号；0 表示补号中或本次投影失败
}

message ListFriendRequestsRequest {
  // player_id 已删:身份以 JWT x-pandora-player-id 为准(R5);字段号 1 勿复用(老客户端仍会发)。
  reserved 1;
  reserved "player_id";
}

message ListFriendRequestsResponse {
  pandora.common.v1.ErrCode code = 1;
  // 发给本人且仍 pending 的好友请求(离线错过 push 后靠本接口补拉)。
  repeated FriendRequestInfo requests = 2;
}

message ListFriendsRequest {
  // player_id 已删:身份以 JWT x-pandora-player-id 为准(R5);字段号 1 勿复用(老客户端仍会发)。
  reserved 1;
  reserved "player_id";
}

message ListFriendsResponse {
  pandora.common.v1.ErrCode code = 1;
  repeated FriendInfo friends = 2;
}

message RemoveFriendRequest {
  // player_id 已删:身份以 JWT x-pandora-player-id 为准(R5);字段号 1 勿复用(老客户端仍会发)。
  reserved 1;
  reserved "player_id";
  uint64 target_player_id = 2;
}

message RemoveFriendResponse {
  pandora.common.v1.ErrCode code = 1;
}

message BlockRequest {
  // player_id 已删:身份以 JWT x-pandora-player-id 为准(R5);字段号 1 勿复用(老客户端仍会发)。
  reserved 1;
  reserved "player_id";
  uint64 target_player_id = 2;
}

message BlockResponse {
  pandora.common.v1.ErrCode code = 1;
}

message UnblockRequest {
  // player_id 已删:身份以 JWT x-pandora-player-id 为准(R5);字段号 1 勿复用(老客户端仍会发)。
  reserved 1;
  reserved "player_id";
  uint64 target_player_id = 2;
}

message UnblockResponse {
  pandora.common.v1.ErrCode code = 1;
}

// BlockInfo 是客户端可见的黑名单条目视图(CLAUDE.md §5.8)。
// nickname 留空,由客户端按 player_id 解析显示名。
message BlockInfo {
  uint64 player_id = 1;  // 被拉黑玩家
  string nickname  = 2;
  int64  since_ms  = 3;
}

message ListBlocksRequest {
  // player_id 已删:身份以 JWT x-pandora-player-id 为准(R5);字段号 1 勿复用(老客户端仍会发)。
  reserved 1;
  reserved "player_id";
}

message ListBlocksResponse {
  pandora.common.v1.ErrCode code = 1;
  repeated BlockInfo blocks = 2;
}

// RecommendedFriendInfo 是客户端可见的「推荐好友」视图(CLAUDE.md §5.8)。
// nickname 留空,由客户端按 player_id 向 player 服务批量解析展示名(最小数据单位)。
// mutual_friend_count 是与查询者的共同好友数(排序依据,0 表示随机兜底候选)。
message RecommendedFriendInfo {
  uint64 player_id           = 1;
  string nickname            = 2;
  bool   is_online           = 3;
  int64  last_seen_ms        = 4;
  uint32 mutual_friend_count = 5;
}

message RecommendFriendsRequest {
  // player_id 已删:身份以 JWT x-pandora-player-id 为准(R5);字段号 1 勿复用(老客户端仍会发)。
  reserved 1;
  reserved "player_id";
  // limit 期望返回数量(默认 5,服务端按上限收敛,0 取默认)。
  uint32 limit = 2;
  // exclude_player_ids 本轮已展示 / 不感兴趣的候选,刷新时回传以拿到新一批(无状态去重)。
  repeated uint64 exclude_player_ids = 3;
}

message RecommendFriendsResponse {
  pandora.common.v1.ErrCode code = 1;
  // 推荐候选:好友的好友(按共同好友数排序)优先,不足时随机活跃玩家兜底。
  // 已排除自己 / 已是好友 / 互相拉黑 / pending 请求 / exclude_player_ids。
  repeated RecommendedFriendInfo recommendations = 2;
}

// ===== 推送事件(kafka pandora.friend.event)=====

// FriendPushEventType 是 pandora.friend.event **域内的事件类型判别键**,
// 填入 PushFrame.event_type(见 pandora/push/v1/push.proto §event_type)。
//
// 作用:pandora.friend.event 这一个 topic 下要承载多种「结构不同」的事件 message;
//       客户端按 (topic=pandora.friend.event, event_type) 定位该反序列化哪个 message。
//
// ⚠️ 与 FriendEventReason 是两个不同的轴,别混:
//   - FriendPushEventType:选「哪个 message」(FriendEvent vs 将来的新事件 message...)。
//   - FriendEventReason  :在 FriendEvent **内部**说明本次好友事件具体是请求/接受。
//
// 编号规则:**每域独立**;**0 永远 = 现有 FriendEvent**(老 producer 不填→缺省 0→旧事件);枚举值只增不复用。
enum FriendPushEventType {
  FRIEND_PUSH_EVENT_TYPE_UNSPECIFIED = 0;  // = FriendEvent(旧事件,向后兼容)
}

// FriendEventReason 区分好友事件类型,客户端据此弹"收到好友请求" / "对方已接受"。
enum FriendEventReason {
  FRIEND_EVENT_REASON_UNSPECIFIED      = 0;
  FRIEND_EVENT_REASON_REQUEST_RECEIVED = 1;  // 收到 by_player_id 的好友请求
  FRIEND_EVENT_REASON_REQUEST_ACCEPTED = 2;  // by_player_id 接受了你的好友请求
}

// FriendEvent 是好友变更推送事件(kafka key = to_player_id,不变量 §9)。
//
// 每条事件精确标识一个接收方(to_player_id),由 friend 服务通过
// kafkax.PushToPlayers 发到 pandora.friend.event,push 服务转发给该玩家的 stream。
message FriendEvent {
  uint64 by_player_id = 1;  // 触发事件的玩家(发起请求 / 接受请求者)
  uint64 to_player_id = 2;  // 接收方(精确标识本条事件给谁)
  uint64 request_id   = 3;  // 关联的好友请求 ID(REQUEST_RECEIVED 时供 AcceptFriend 用)
  FriendEventReason reason = 4;
  int64  ts_ms        = 5;
}
