// Pandora 配置表:道具表。
//
// 源表:Pandora-Client-SVN/Table/道具/d_道具.xlsx(策划维护,SVN)。
// 产物:XuanMing-Server/configtable/dist/item.json(tools/configtable-gen 生成,git 跟踪)。
// 加载:服务端 pkg/configtable 以 protojson 读入本容器,全批校验通过后原子切换。
//
// 用途(服务端权威校验,不是展示):
//   - player.SetEquipment:按 equip_slot 判定「是不是装备」「部位对不对」,
//     不再只信客户端传来的槽位(见 services/account/player/internal/biz/player.go);
//   - 拥有权校验走 inventory 系统 RPC,不在本表范围。
// 客户端 CfgItem(UE DataTable)与本表同源导出,展示口径与服务端校验口径因此不会漂移。
//
// 规范:配置表 ID 默认 uint32(CLAUDE.md §5.6);流水线契约见 docs/design/config-table-hotreload.md。

syntax = "proto3";

package pandora.config.v1;

import "pandora/config/v1/excel.proto";

// ItemType 道具类型(对齐 d_道具.xlsx「类型」列取值,JSON 里用数字)。
enum ItemType {
  ITEM_TYPE_UNSPECIFIED = 0;
  ITEM_TYPE_CONSUMABLE  = 1; // 消耗品(可使用,如食物/药水)
  ITEM_TYPE_MATERIAL    = 2; // 材料
  ITEM_TYPE_EQUIPMENT   = 3; // 装备(可穿戴,装备部位 > 0)
  ITEM_TYPE_QUEST       = 4; // 任务道具
  ITEM_TYPE_CURRENCY    = 5; // 货币
}

// ItemHealType 道具在副本内使用时的回血公式。
enum ItemHealType {
  ITEM_HEAL_TYPE_UNSPECIFIED    = 0; // 未配置；兼容旧批次中“字段缺失 + use_heal_hp>0”的固定回血
  ITEM_HEAL_TYPE_FIXED          = 1; // 固定点数
  ITEM_HEAL_TYPE_MAX_HP_PERCENT = 2; // 按角色最大生命百分比
}

// ItemRow 道具表一行(列序 = 字段号序 = 表头 A..Y)。
message ItemRow {
  // ID(主键,即全链路 item_config_id)
  uint32 id = 1 [(excel_col) = "ID", (excel_required) = true];
  // 名称(策划可读名)
  string name = 2 [(excel_col) = "名称", (excel_required) = true];
  // 类型(枚举数字;0=UNSPECIFIED 不允许)
  ItemType type = 3 [(excel_col) = "类型", (excel_required) = true];
  // 品质(0 起的色阶下标,掉落物外观与背包底色共用)
  uint32 quality = 4 [(excel_col) = "品质", (excel_default) = "0"];
  // 堆叠上限(装备必须为 1:堆叠合并会改写实例 guid,破坏强化/词条跟随)
  uint32 max_stack_size = 5 [(excel_col) = "堆叠上限", (excel_required) = true];
  // 售价(单件出售金币)
  uint32 sell_price = 6 [(excel_col) = "售价", (excel_default) = "0"];
  // 图标(UE 贴图资产路径)
  string icon = 7 [(excel_col) = "图标", (excel_prefix) = "/"];
  // 描述文本
  string description = 8 [(excel_col) = "描述文本"];
  // 可使用(0=否;副本内使用食物/水等需与合法回血配置同时成立)
  bool usable = 9 [(excel_col) = "可使用", (excel_default) = "0"];
  // 固定使用回血量。use_heal_type=1 时必须 >0；旧批次允许 type=0 且该值>0；百分比类型必须为 0。
  uint32 use_heal_hp = 10 [(excel_col) = "使用回血量", (excel_default) = "0"];
  // 装备部位(0=不可穿戴;> 0 为部位编号,同部位同时只能穿一件。
  //   服务端 SetEquipment 用它做「是不是装备 + 部位是否匹配」两项权威校验,
  //   客户端 UMyBagComponent::ServerEquipItem 用同一列做副本内穿戴校验)
  uint32 equip_slot = 11 [(excel_col) = "装备部位", (excel_default) = "0"];
  // 装备鉴定词条池 ID。装备必须 >0，非装备必须为 0；池定义见 equipment_affix.proto。
  uint32 identify_pool_id = 12 [(excel_col) = "鉴定池ID", (excel_default) = "0"];
  // 角色身上装备外观。mesh/socket 必须同时为空或同时非空；空表示当前没有合格的独立美术资产。
  // 这些字段只供 UE 渲染，服务端仍加载并校验同一源表以阻止两端表头漂移。
  string equip_mesh = 13 [(excel_col) = "装备模型", (excel_prefix) = "/"];
  string equip_socket = 14 [(excel_col) = "装备挂点"];
  float equip_offset_x = 15 [(excel_col) = "装备偏移X", (excel_default) = "0"];
  float equip_offset_y = 16 [(excel_col) = "装备偏移Y", (excel_default) = "0"];
  float equip_offset_z = 17 [(excel_col) = "装备偏移Z", (excel_default) = "0"];
  float equip_yaw = 18 [(excel_col) = "装备旋转Yaw", (excel_default) = "0"];
  float equip_pitch = 19 [(excel_col) = "装备旋转Pitch", (excel_default) = "0"];
  float equip_roll = 20 [(excel_col) = "装备旋转Roll", (excel_default) = "0"];
  float equip_scale_x = 21 [(excel_col) = "装备缩放X", (excel_default) = "1"];
  float equip_scale_y = 22 [(excel_col) = "装备缩放Y", (excel_default) = "1"];
  float equip_scale_z = 23 [(excel_col) = "装备缩放Z", (excel_default) = "1"];
  // 回血类型:空=未配置/兼容旧批次,1=固定点数,2=最大生命百分比；其它值整批拒绝。
  ItemHealType use_heal_type = 24 [(excel_col) = "使用回血类型"];
  // 最大生命百分比；use_heal_type=2 时必须为 1..100，其它类型必须为 0。
  uint32 use_heal_max_hp_percent = 25 [(excel_col) = "使用回血百分比", (excel_default) = "0"];
}

// ItemTableData 道具整表容器(dist/item.json 的根对象;excel_file 注解 = 导表登记)。
message ItemTableData {
  option (excel_file) = "道具/d_道具.xlsx";
  // 源表第 1 行表头、2~3 行留给列说明,数据自第 4 行起(与玩家等级经验表同版式)。
  option (excel_data_start_row) = 4;

  repeated ItemRow rows = 1;
}
