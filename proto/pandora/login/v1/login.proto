// Pandora LoginService 协议。
//
// 职责(docs/design/go-services.md §2.1):
//   - 账号注册 / 登录 / 登出
//   - 颁发 Session Token(给客户端)
//   - 颁发 DS Ticket(JWT,给 UE DS 校验)
//   - 验证 DS Ticket(防重放,jti 黑名单)
//
// W2 (2026-06-05) 加 google.api.http 注解(Kratos protoc-gen-go-http 用):
//   - 业务服同时暴露 gRPC + HTTP 两套 endpoint
//   - Envoy gRPC-Web filter 把客户端请求转 gRPC,优先走 gRPC
//   - HTTP endpoint 给运营后台 / 第三方 webhook 用,玩家客户端不直连

syntax = "proto3";

package pandora.login.v1;

import "pandora/common/v1/errcode.proto";
import "google/api/annotations.proto";

service LoginService {
  // Login 立即完成型(synchronous),response 含完整 session_token + hub 地址
  // kafka push 不发给 caller(他看 RPC response 即可)
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/login"
      body: "*"
    };
  }

  // Logout 立即完成型,清 session
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/v1/logout"
      body: "*"
    };
  }

  // IssueDSTicket 立即完成型,DS 进入前 client 调拿短期票据
  rpc IssueDSTicket(IssueDSTicketRequest) returns (IssueDSTicketResponse) {
    option (google.api.http) = {
      post: "/v1/ds/ticket/issue"
      body: "*"
    };
  }

  // GetPlayerNo 立即完成型,查本人角色编号(展示专用,2026-08-10)。
  //
  // 为什么需要它:编号由 login 补号任务**异步**分配(player-no-and-login-surge.md §3),
  // 而本项目「首登即注册」——注册与登录是同一个请求,登录响应里的 player_no 必然是 0。
  // 若只靠 Login 下发,新玩家整个首次会话都只能看到「生成中」(编号约 15s 后才落库,
  // 客户端却已无处可取)。本 RPC 让客户端在拿到 0 时补拉,是异步生成的标准配套。
  //
  // player_id 取自 JWT sub(Envoy jwt_authn 注入 x-pandora-player-id),请求体不含
  // player_id ——只能查自己,不能拿别人的编号(§9.6 不信客户端自报身份)。
  // 幂等只读,无副作用;编号一经分配即不再变化,客户端拿到非 0 后应停止轮询。
  rpc GetPlayerNo(GetPlayerNoRequest) returns (GetPlayerNoResponse) {
    option (google.api.http) = {
      post: "/v1/player-no/get"
      body: "*"
    };
  }

  // GetRegisterNo 是 player_no 改名期间的只读兼容入口。
  //
  // 已发布客户端仍会调用旧 gRPC method / HTTP path，不能在滚动升级时原地移除；
  // 等最后一个旧客户端版本排空后，才可按 expand -> migrate -> contract 收缩本入口。
  // 新代码一律调用 GetPlayerNo，不得新增对本入口的依赖。
  rpc GetRegisterNo(GetRegisterNoRequest) returns (GetRegisterNoResponse) {
    option deprecated = true;
    option (google.api.http) = {
      post: "/v1/register-no/get"
      body: "*"
    };
  }

  // ListAccountRoles 立即完成型,列出**本账号名下的角色**(两步登录,2026-08-18)。
  //
  // 鉴权走**账号态 token**(aud=pandora-account),不是玩家 SessionToken:选角发生在
  // 「已认证账号、尚未绑定角色」这段中间态,此时服务端还没有 player_id 可以签 session。
  // account_id 取自账号态 JWT 的 sub(Envoy 注入 x-pandora-account-id),请求体不含
  // account_id ——只能列自己的角色(§9.6 不信客户端自报身份)。
  //
  // 幂等,但**不是纯读**:响应里的 effective_nickname 来自 player.EnsureProfile,
  // 它对「档案不存在」的角色会顺带建档(INSERT IGNORE 语义,已存在则原样返回)。
  // 之所以不换成看起来更"只读"的 GetProfile:player.GetProfile 内部同样先调
  // repo.EnsureProfile,而且播的是默认名 Player_<id> —— 在 Login 播种之前先调它,
  // 会把默认名抢先写死(INSERT IGNORE 先到先得),账号名就永远播不进去了。
  //
  // Login 的响应里已经带了同一份列表,本 RPC 用于选角界面停留期间的刷新
  // (比如创建角色功能上线后新建完角色回到列表)。
  rpc ListAccountRoles(ListAccountRolesRequest) returns (ListAccountRolesResponse) {
    option (google.api.http) = {
      post: "/v1/account/roles/list"
      body: "*"
    };
  }

  // EnterRole 立即完成型,**选定角色进入游戏**(两步登录第二步,2026-08-18)。
  //
  // 这是 player_id 从「账号身份」下沉为「角色实体身份」之后的进场入口:
  //   Login(账号密码) → 账号态 token + 角色列表 → EnterRole(选中的 player_id)
  //     → 绑定该角色的 SessionToken + hub 地址 + hub 票据。
  //
  // 鉴权走账号态 token。服务端**必须**核对 player_id 确实挂在该 account_id 名下
  // (account_roles 台账),不属于则 ErrLoginRoleNotOwned —— 这是越权尝试,要留审计。
  // 请求体里的 player_id 是「选哪个」而不是「我是谁」:它是从服务端刚下发的列表里选的,
  // 且服务端会回查归属,不构成自报身份。
  //
  // 幂等:重复 EnterRole 同一角色 = 重新登录一次该角色(轮换会话代际,顶掉旧会话)。
  rpc EnterRole(EnterRoleRequest) returns (EnterRoleResponse) {
    option (google.api.http) = {
      post: "/v1/role/enter"
      body: "*"
    };
  }

  // SelectRole 立即完成型,选**职业外观**(2026-07-08)。
  //
  // ⚠️ 名字容易与 EnterRole 混:本 RPC 的 role_id 是 **CfgRole 配置表 ID(职业 / 外观)**,
  // 不是角色实体。选哪个**角色实体**进游戏走 EnterRole(参数是 player_id)。
  // 两者正交:一个角色实体有它自己的职业。
  //
  // 玩家在选角界面确认角色后调用:服务端校验 role_id 合法 → 落库(player_roles,权威源)
  //   → 经 hub_allocator.AssignHub 拿"当前有效"大厅地址 + 把 role_id 签进全新 hub 票据。
  // 客户端凭 response 的 hub_ds_addr + hub_ticket ClientTravel 进大厅;
  // Hub DS 从票据 claim 读 role_id 生成角色(不再信任 URL ?role= 自报)。
  // player_id 取自 JWT sub(Envoy jwt_authn 注入 x-pandora-player-id),请求体不含 player_id。
  // 幂等:重复调用/换角色重选都是覆盖式 upsert。
  rpc SelectRole(SelectRoleRequest) returns (SelectRoleResponse) {
    option (google.api.http) = {
      post: "/v1/role/select"
      body: "*"
    };
  }

  // VerifyDSTicket 立即完成型,DS 内部用(不暴露 HTTP path 给客户端)
  // ⚠️ Envoy 应该用 ext_authz / route 限制此 path 只允许内网
  rpc VerifyDSTicket(VerifyDSTicketRequest) returns (VerifyDSTicketResponse) {
    option (google.api.http) = {
      post: "/v1/ds/ticket/verify"
      body: "*"
    };
  }

  // ResolvePlayerNosForDS 供 UE DS 按 player_id 单批读取账号域权威展示编号。
  // 不加 HTTP annotation；客户端 listener 必须 exact 403，DS listener 才 exact allow。
  // redis admission 模式下实现层还会强制 Bearer DS credential + active 权威。
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE DS 与 Team 入口共用同一 canonical batch messages。
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME 避免复制同形 request 造成协议漂移。
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME 避免复制同形 response 造成协议漂移。
  rpc ResolvePlayerNosForDS(ResolvePlayerNosRequest) returns (ResolvePlayerNosResponse);

  // GetResumeContext 让冷启动/前台恢复重新读取服务端权威路由；客户端不得继续相信
  // 旧地址、旧票据或本地超时推导。match_stage 可由 matchmaker durable saga 后续补齐。
  rpc GetResumeContext(GetResumeContextRequest) returns (GetResumeContextResponse) {
    option (google.api.http) = {
      post: "/v1/resume/context"
      body: "*"
    };
  }
}

// LoginInternalService 只供集群内服务读取账号域权威数据。
//
// 它刻意与客户端可见 LoginService 分开，且所有 RPC 均不加 google.api.http 注解：
// 客户端 Envoy 只转发 /pandora.login.v1.LoginService/，不会暴露本服务。实现层还必须
// 校验 request-bound internalrpcauth，不能把“没走 Envoy”误当成调用方身份。
service LoginInternalService {
  // ResolvePlayerNos 按 player_id 有界批量解析角色展示编号。
  // 输入只接受身份键 player_id；player_no 仅出现在结果中，绝不反向作为业务查询键。
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE Team 与 DS 入口共用同一 canonical batch messages。
  rpc ResolvePlayerNos(ResolvePlayerNosRequest) returns (ResolvePlayerNosResponse);
}

// ===== 登录 =====

message LoginRequest {
  string account        = 1;
  string password_hash  = 2;  // 客户端先 sha256
  string device_id      = 3;
  string client_version = 4;
  // 5-9 reserved core
  reserved 5 to 9;

  string region = 10;
  string locale = 11;
  // 12-49 reserved for client metadata
  reserved 12 to 49;

  // defer_role_entry(两步登录,2026-08-18):true = 只认证账号,**不要**自动进入角色。
  //
  // 为什么需要它:滚动升级期新旧客户端混跑。已发布的旧客户端只会调 Login,并期待
  // 响应里直接带 hub_ds_addr / hub_ticket / session_token —— 所以 Login 默认仍会
  // 自动进入默认角色(最近登录的那个),旧客户端零改动继续工作。
  // 新客户端走「Login → 选角界面 → EnterRole」,自动进入就成了纯浪费:白占一次 Hub
  // 座位、白签一张票、还白轮换一次会话代际(EnterRole 会立刻把它顶掉)。置 true 即跳过。
  //
  // true 时响应只填 account_token / account_id / roles,其余字段留空。
  bool defer_role_entry = 50;
}

message LoginResponse {
  pandora.common.v1.ErrCode code = 1;
  uint64 player_id     = 2;
  string session_token = 3;  // 连后端 gRPC 用
  string hub_ds_addr   = 4;  // 直连大厅 DS 的 IP:port
  string hub_ticket    = 5;  // hub DS 票据(JWT)
  // [proto] 全服扩容三层化(docs/design/scale-cellular-20m.md §3.2/§3.3):玩家确定性路由落点。
  // 客户端 / 边缘网关据此把后续连接(gRPC-Web、push stream)连到正确 Region 的正确 Cell。
  // 单 Cell / dev 部署为 0。uint32 拓扑维度(非 snowflake 业务 ID,CLAUDE.md §9.12)。
  uint32 region_id = 6;
  uint32 cell_id   = 7;
  // ===== 断线重连(docs/design/battle-reconnect.md)=====
  // 玩家已在 battle DS 中掉线,重新登录时 login 查 player_locator 发现其处于 BATTLE 态,
  // 直接下发原对局的 battle DS 直连信息(而非把玩家丢回大厅)。三字段"要么全空、要么全填":
  //   - 空(默认):玩家不在战斗中,客户端走 hub_ds_addr / hub_ticket 进大厅(既有流程)。
  //   - 非空:客户端应直连 battle_ds_addr 用 battle_ticket 重连原对局;
  //     连接失败(对局已结束 / 票据过期)再回退调 IssueDSTicket 拿 hub 地址回大厅。
  // battle 字段非空时 hub_ds_addr / hub_ticket 为空(login 检测到 BATTLE 不再分配 hub)。
  string battle_ds_addr = 8;  // 直连 battle DS 的 IP:port
  string battle_ticket  = 9;  // battle DS 票据(JWT,新 jti)
  uint64 match_id       = 10; // 重连对局 ID(Snowflake uint64,CLAUDE.md §9.11)
  // ===== 选角(2026-07-08)=====
  // 玩家当前已选角色(player_roles 表,服务端权威)。0 = 从未选过角。
  // 客户端登录后进选角界面,用此值预选中上次角色;确认后调 SelectRole。
  // uint32 配置表 ID(CfgRole.Id,非 snowflake 业务 ID,CLAUDE.md §9.12)。
  uint32 selected_role_id = 11;
  ResumeContext resume_context = 12;
  // ===== 角色编号(2026-08-10,docs/design/player-no-and-login-surge.md §3)=====
  // 展示专用的自增角色编号(按注册先后严格连续,全服全局一套)。由 login 补号任务
  // 异步分配:**0 = 尚未分配**(注册后 ~15s 的补号窗口,客户端显示「生成中」即可)。
  //
  // ⚠️ 「首登即注册」使**首次登录的响应必然是 0**(注册与登录是同一个请求)。客户端
  // 不能只靠本字段,否则新玩家整个首次会话都停在「生成中」——须在拿到 0 后调
  // GetPlayerNo 补拉(§3.7;拿到非 0 即停)。
  //
  // 语义(§3.6.1,卖角色业务决定):编号**绑定角色实体**而非账号——今 player_id 即角色
  // 身份,一账号建 N 个角色就有 N 个编号;角色过户(卖角色)时随角色走、值不变,
  // 是角色的资历凭证(编号小=老角色)。UI 呈现为「该角色的编号」,不是「账号编号」。
  //
  // 纯展示字段,客户端不得当身份 ID 用(身份永远是 player_id);服务端也禁止任何服务
  // 拿它当键 / 外键 / 路由键 / 幂等键(设计文档 §3.3 红线)。
  //
  // register_no #13 是旧客户端锁与当前正式描述符的兼容字段；新服务在迁移期与
  // player_no #14 双写。旧 protobuf 二进制仍按 wire #13 读取相同值；4e 期间生成的
  // JSON 调用方则读取同时输出的 playerNo #14。新代码只读 #14，最后一个旧调用方
  // 排空后，才可在独立 contract 版本 reserved #13。
  uint64 register_no = 13 [deprecated = true];
  uint64 player_no = 14;

  // ===== 账号 / 角色分离(两步登录,2026-08-18)=====
  //
  // 这三个字段是「已认证账号」的产物,与上面那批「已进入某个角色」的字段是两个层面:
  //   - account_token / account_id / roles:账号层,认证完就有;
  //   - player_id / session_token / hub_*:角色层,只有真正进入某个角色后才有。
  //
  // defer_role_entry=false(旧客户端 / 默认)时两批都填:服务端替它自动进了默认角色。
  // defer_role_entry=true 时只填账号层,客户端拿 roles 渲染选角界面,再调 EnterRole。

  // account_token:账号态 token(aud=pandora-account,短 TTL,默认 10min)。
  // 只能调 ListAccountRoles / EnterRole,**拿不到任何玩家面能力** —— 它的 sub 是
  // account_id,过不了玩家态 provider 的 aud 校验(pkg/auth 有测试钉死这条互斥性)。
  string account_token = 15;
  // account_id:账号身份(snowflake)。角色过户就是把角色的归属改到另一个 account_id。
  // 注意与 player_id 的区别:player_id 现在是**角色实体 ID**,不再等于账号。
  uint64 account_id = 16;
  // roles:本账号名下全部可用角色。创建角色功能上线前恒 1 个(注册时自动建,名字=账号名)。
  // 顺序:最近登录的在前,从未登录过的按 slot 升序排在后面 —— 客户端默认选中第一个即可。
  repeated AccountRole roles = 17;
  // account_token 过期时刻(unix ms)。客户端据此判断选角界面停留过久要重新登录。
  // §5.12:时间戳非负,用无符号。
  uint64 account_token_exp_ms = 18;
}

// AccountRole 是**一个角色实体**在选角界面上的可见结构(客户端可见结构,§5 第 8 条)。
//
// 命名消歧(全文最容易踩的一处):
//   - player_id 是**角色实体 ID**(snowflake)。全仓业务数据都以它为键;卖角色 = 把它
//     从一个 account_id 挂到另一个 account_id,业务数据零迁移。
//   - role_id 是 **CfgRole 配置表 ID**(职业 / 外观,uint32,§9.12),不是角色实体。
message AccountRole {
  uint64 player_id = 1;
  // role_name:角色名。创建角色功能上线前 = 账号名。
  //
  // 取数口径:优先取 player 服务的当前显示名(players.nickname,全服唯一、玩家可改);
  // player 服务不可达时降级为 account_roles.role_name(创建时定的名字)。
  // 两者在「玩家从未改过名」时恒等,而改名功能目前全仓无调用方,故当前恒等。
  string role_name = 2;
  // role_id:该角色已选的职业外观(CfgRole.Id)。0 = 尚未选过职业(需走 SelectRole)。
  uint32 role_id = 3;
  // player_no:角色编号(展示专用,绑角色实体不绑账号)。0 = 补号窗口内尚未分配。
  uint64 player_no = 4;
  // level:角色等级,选角界面展示用。player 服务不可达时为 0。
  uint32 level = 5;
  // last_login_at_ms:该角色最近一次进入游戏(unix ms)。0 = 从未进过。
  // 客户端按它决定默认选中项(服务端已按此排序,直接取第一个即可)。
  uint64 last_login_at_ms = 6;
  // slot:账号内槽位(0 起)。创建角色功能上线后用于稳定排序 / 定位。
  uint32 slot = 7;
}

message ListAccountRolesRequest {
  // 刻意为空:account_id 只能来自账号态 JWT 的 sub(Envoy 注入 x-pandora-account-id),
  // 不接受请求体自报 —— 否则任何人都能列别人账号下的角色。
}

message ListAccountRolesResponse {
  pandora.common.v1.ErrCode code = 1;
  // 排序同 LoginResponse.roles:最近登录的在前。
  repeated AccountRole roles = 2;
}

message EnterRoleRequest {
  // player_id:选中的角色实体 ID,必须来自服务端刚下发的 roles 列表。
  //
  // 这**不是**自报身份:服务端会按 account_roles 台账回查「该角色是否挂在本账号
  // (账号态 JWT 的 sub)名下」,不属于一律 ErrLoginRoleNotOwned 并留审计日志。
  uint64 player_id = 1;
  // device_id:与 LoginRequest.device_id 同义(设备绑定 + 顶号判别)。
  // 必须带:真正建立玩家会话的是本 RPC 而不是 Login,设备记账要落在这一步。
  string device_id = 2;
}

// EnterRoleResponse 与 LoginResponse 的「角色层」字段一一对应(刻意不复用 LoginResponse:
// 账号层字段在这里没有意义,塞进来会让客户端以为还能再拿一张 account_token)。
message EnterRoleResponse {
  pandora.common.v1.ErrCode code = 1;
  uint64 player_id     = 2;
  string session_token = 3;
  string hub_ds_addr   = 4;
  string hub_ticket    = 5;
  uint32 region_id     = 6;
  uint32 cell_id       = 7;
  // 断线重连三件套:语义完全同 LoginResponse(要么全空、要么全填)。
  // 选了一个正在战斗中的角色时,直接把它送回原对局而不是大厅。
  string battle_ds_addr = 8;
  string battle_ticket  = 9;
  uint64 match_id       = 10;
  // 该角色已选职业(CfgRole.Id);0 = 未选过,客户端应先进职业选择。
  uint32 selected_role_id = 11;
  ResumeContext resume_context = 12;
  uint64 player_no = 13;
}

enum ResumeRoute {
  RESUME_ROUTE_UNSPECIFIED = 0;
  RESUME_ROUTE_HUB = 1;
  RESUME_ROUTE_BATTLE = 2;
  RESUME_ROUTE_UNKNOWN = 3;
}

enum ResumeMatchStage {
  RESUME_MATCH_STAGE_UNSPECIFIED = 0;
  RESUME_MATCH_STAGE_NONE = 1;
  RESUME_MATCH_STAGE_QUEUED = 2;
  RESUME_MATCH_STAGE_CONFIRMING = 3;
  RESUME_MATCH_STAGE_ALLOCATING = 4;
  RESUME_MATCH_STAGE_READY = 5;
  RESUME_MATCH_STAGE_RUNNING = 6;
}

// ResumePlacementState distinguishes an admitted route from an in-flight
// transition. A route alone is never sufficient proof that ClientTravel /
// Admission completed: HUB_PENDING still routes toward Hub but must retain the
// operation/fence and retry.
enum ResumePlacementState {
  RESUME_PLACEMENT_STATE_UNSPECIFIED = 0;
  RESUME_PLACEMENT_STATE_PENDING = 1;
  RESUME_PLACEMENT_STATE_STABLE = 2;
}

// ResumeEntryState 是 §9.23「单一入口最小状态集」。统一进场入口只返回这五种之一,
// 客户端 UMyDsRecoveryCoordinator 按它决定:去选角 / 退避重查 / 幂等 no-op 或 Travel /
// 重新认证 / 停在终态 UI。
//
// 与 ResumePlacementState 的分工:entry_state 回答「客户端现在该做什么」,
// placement_state 只在 TARGET 下细分「owner 是 PENDING 还是已 ADMITTED」。
enum ResumeEntryState {
  RESUME_ENTRY_STATE_UNSPECIFIED = 0;
  // 未选角:不得提前分配 Hub、占座或签进场票(§9.23)。
  RESUME_ENTRY_STATE_ROLE_REQUIRED = 1;
  // 需要退避重查:权威不可达、结果不确定、或准入屏障未开。必须保留 session 与原
  // operation_id,由同一 coordinator 的 watchdog 按 retry_after_ms 到期重查。
  RESUME_ENTRY_STATE_WAIT = 2;
  // 已有明确归属目标:exact target + owner_epoch + placement_state 有效。
  RESUME_ENTRY_STATE_TARGET = 3;
  // 会话已过期/被撤销,必须重新认证(不是暂时失败,不得自动重试)。
  RESUME_ENTRY_STATE_REAUTH = 4;
  // 终态(封禁、强制版本不兼容等):停在可见 UI,不重试。
  RESUME_ENTRY_STATE_TERMINAL = 5;
}

// ResumeWaitReason 让 WAIT 可诊断、可给用户文案,并区分「安全等待」与「故障等待」。
// §9.23 要求 WAIT 必须带原因与 retry_after,不能是无出口的静默等待。
enum ResumeWaitReason {
  RESUME_WAIT_REASON_UNSPECIFIED = 0;
  // owner 权威不可达 / 结果不确定 → 必须 fail-closed 等待,禁止冒充 OFFLINE 或默认 Hub。
  RESUME_WAIT_REASON_OWNER_UNKNOWN = 1;
  // 新 owner 的 admit_not_before 屏障未开(旧 DS 最晚安全截止时间之前)。
  RESUME_WAIT_REASON_ADMIT_BARRIER = 2;
  // 撮合中(权威 match stage 已在 match_stage 字段给出)。
  RESUME_WAIT_REASON_MATCHING = 3;
  // 角色权威查询失败:查询缺失不等于 role=0,不得据此推导未选角。
  RESUME_WAIT_REASON_ROLE_UNKNOWN = 4;
  // 分配失败 / 暂无容量。
  RESUME_WAIT_REASON_NO_CAPACITY = 5;
}

message ResumeContext {
  ResumeRoute route = 1;
  uint64 match_id = 2;
  ResumeMatchStage match_stage = 3;
  uint64 placement_version = 4;
  string operation_id = 5;
  ResumePlacementState placement_state = 6;
  string ds_pod_name = 7;
  string ds_instance_uid = 8;
  string hub_assignment_id = 9;
  uint32 ds_instance_epoch = 10;
  string allocation_id = 11;
  string release_track = 12;
  // Canonical matchmaker namespace (for example 5v5_ranked / pve_coop).
  // Cold-start clients must restore the matching route header before any
  // Cancel/Confirm/GetProgress mutation.
  string game_mode = 13;
  // [proto] 本局副本编号(g_关卡.xlsx 关卡 id,uint32 配置表 ID,CLAUDE.md §9.12),
  // 透传自 matchmaker ResolvePlayerMatchContext(权威 ticket/match 记录)。
  // BATTLE route 及持有活跃撮合 claim 的 HUB route 时按权威填;0 = 未指定/默认,
  // 客户端保留 DS 握手后按地图包名反查关卡表的兜底路径。
  uint32 map_id = 14;
  // ── §9.23 query-first 全量字段(R11 复审 架构 P0)────────────────────────────
  // owner_epoch:每玩家单调不回退的归属代次(§9.22 权威本体,区别于 ds_instance_epoch /
  // writer epoch / session epoch)。客户端必须用 (entry_state, exact target, owner_epoch)
  // 三元组判定「当前连接是否已精确匹配 owner」,匹配则幂等 no-op,不得再 Travel/占座。
  uint64 owner_epoch = 15;
  // retry_after_ms:WAIT 时的建议退避(0 = 由客户端用自己的退避+jitter 兜底)。
  // ADMIT_BARRIER 时由权威的 admit_not_before 推导,保证客户端不会在屏障开前空转重试。
  uint32 retry_after_ms = 16;
  // entry_state:§9.23 最小状态集。老客户端读不到本字段时按 route/placement_state 兼容运行。
  ResumeEntryState entry_state = 17;
  // wait_reason:entry_state=WAIT 时的原因(诊断 + 用户文案)。
  ResumeWaitReason wait_reason = 18;
}

message GetResumeContextRequest {
  string session_token = 1;
}

message GetResumeContextResponse {
  pandora.common.v1.ErrCode code = 1;
  ResumeContext context = 2;
}

message LogoutRequest {
  string session_token = 1;
}

message LogoutResponse {
  pandora.common.v1.ErrCode code = 1;
}

// ===== DS 票据 =====

// DSTicket 是 JWT 的 payload(不直接传输,这里 message 描述结构以便 cpp/go 共享)。
message DSTicket {
  uint64 player_id      = 1;
  uint64 match_id       = 2;  // battle DS 才有,hub 为 0
  int64  issued_at_ms   = 3;
  int64  expires_at_ms  = 4;
  string ds_type        = 5;  // "hub" | "battle"
  string jti            = 6;  // JWT ID,防重放
  // [proto] 全服扩容三层化(docs/design/scale-cellular-20m.md §3.3):DS 票据绑定玩家路由落点,
  // 防 stale/伪造票据跨单元串号(把 A 单元玩家接进 B 单元 DS)。单 Cell/dev 为 0。
  // Go 侧 JWT claim 已落地(pkg/auth DSTicketClaims.region_id/cell_id);待 Codex regen 后
  // cpp 共享结构同步。uint32 拓扑维度(非 snowflake 业务 ID,CLAUDE.md §9.12)。
  uint32 region_id      = 7;
  uint32 cell_id        = 8;
  // 9 reserved
  reserved 9;
  // [proto] 选角权威化(2026-07-08):玩家已选角色签进 hub 票据(与 region_id/cell_id 同一
  // 套路:权威数据以 JWT claim 下发,DS 本地验签即得,不可伪造)。0 = 票据未携带(旧票兼容 /
  // battle 票走 match roster)。DS 侧 ResolveRoleIdForPlayer 优先取此值 spawn。
  // uint32 配置表 ID(CfgRole.Id,非 snowflake 业务 ID,CLAUDE.md §9.12)。
  uint32 role_id        = 10;
  // Model B hub 票据绑定。六项必须全有或全无；enforce 下 Hub DS 只接受完整绑定且与当前
  // Redis 玩家归属、目标 DS active credential 精确一致的票据。battle/legacy 票据均为零值。
  string ds_pod_name          = 11;
  string ds_instance_uid      = 12;
  uint32 ds_protocol_epoch    = 13;
  uint64 ds_credential_gen    = 14;
  string ds_credential_jti    = 15;
  string hub_assignment_id    = 16;
  uint32 ds_writer_epoch      = 17;
  // DSTicket v2(RS256/B1)稳定绑定。编号只做 additive 扩展，旧副本会保留 unknown。
  uint32 dst_ver              = 18;
  uint32 ds_instance_epoch    = 19;
  string allocation_id       = 20;
  string release_track       = 21;
  // 版本化 placement lease；Hub strict admission 必须与当前 placement/assignment 精确相等。
  uint64 placement_version   = 22;
  string placement_operation_id = 23;
  uint64 source_match_id     = 24;
}

message IssueDSTicketRequest {
  string session_token = 1;
  string ds_type       = 2;  // "hub" | "battle"
  // battle:目标 match_id；hub:从 Battle 返回时必须传 source_match_id，服务端仍会
  // 与 durable placement + 签名 terminal/leave proof 精确核对，不能把本字段当权威。
  // 已稳定在 Hub 的普通重签可传 0。
  uint64 target_id     = 3;
}

message IssueDSTicketResponse {
  pandora.common.v1.ErrCode code = 1;
  string ticket = 2;  // JWT 编码后的字符串
  // ds_type=hub 时由 hub_allocator.AssignHub 返回的"当前有效"大厅 DS 地址。
  // 客户端结算返回大厅时必须用此地址(而非登录时缓存的旧地址),以应对 Hub DS 被 Agones
  // 重建/换端口/换分片。ds_type=battle 时为空(battle 地址来自 matchmaker / match 进度)。
  string hub_ds_addr = 3;
}

message VerifyDSTicketRequest {
  string ticket       = 1;
  string ds_pod_name  = 2;
  // admission_id 由 UE DS 为一次 PreLoginAsync 准入尝试生成并在有界重试中复用。
  // Redis authority 模式下必填；login 把它与已核验 caller active credential 一起绑定到
  // ticket jti，使 SETNX 响应丢失后同一准入可幂等确认，不同准入/凭据仍按 replay 拒绝。
  string admission_id = 3;
}

message VerifyDSTicketResponse {
  pandora.common.v1.ErrCode code = 1;
  DSTicket claims = 2;
}

// ===== 选角(2026-07-08)=====

// GetPlayerNoRequest 刻意为空:唯一入参 player_id 只能来自 JWT sub
// (Envoy 注入 x-pandora-player-id),不接受请求体自报——玩家只能查自己的编号。
message GetPlayerNoRequest {}

message GetPlayerNoResponse {
  pandora.common.v1.ErrCode code = 1;
  // player_no: 当前角色的角色编号(展示专用)。**0 = 仍在补号窗口内**(约 15s:补号周期
  // 5s + 水位安全滞后 10s),不是错误——客户端应继续显示「生成中」并稍后重试;
  // 拿到非 0 后编号永不再变,应停止轮询。禁作身份键使用(身份永远是 player_id)。
  //
  // 语义(§3.6.1,卖角色业务决定):编号**绑定角色实体**而非账号——今 player_id 即角色身份,
  // 一账号建 N 个角色就有 N 个编号;角色过户(卖角色)时编号随角色走、值不变,
  // 它是角色的资历凭证(编号小=老角色)。故 UI 上应呈现为「该角色的编号」,不是「你的账号编号」。
  uint64 player_no = 2;
}

// ResolvePlayerNosRequest 是 team 等内部服务组装客户端展示投影时的批量读取。
// 实现必须拒绝空 ID、去重并限制数量；调用方应在单次请求里携带整支队伍，禁止 N+1。
message ResolvePlayerNosRequest {
  repeated uint64 player_ids = 1;
}

message ResolvedPlayerNo {
  uint64 player_id = 1;
  // 0 = 账号域确认仍在异步补号窗口；非 0 后编号终身稳定。
  uint64 player_no = 2;
}

message ResolvePlayerNosResponse {
  pandora.common.v1.ErrCode code = 1;
  repeated ResolvedPlayerNo entries = 2;
}

// GetRegisterNoRequest / Response 只用于已发布调用方的滚动升级兼容。
// 新代码不得引用；删除前必须先证明最后一个旧客户端版本已排空。
message GetRegisterNoRequest {
  option deprecated = true;
}

message GetRegisterNoResponse {
  option deprecated = true;

  pandora.common.v1.ErrCode code = 1;
  uint64 register_no = 2 [deprecated = true];
}

message SelectRoleRequest {
  // role_id: 玩家选中的角色配置 ID(CfgRole.Id)。必须 >0 且在服务端白名单
  // (login 配置 allowed_role_ids;白名单为空 = fail-closed 拒绝,
  //  仅 dev_allow_any_role=true 时放宽为只校验非 0,严禁上生产)。
  // player_id 不在请求体,取自 JWT sub(服务端从 ctx 读,同 TransferToLineRequest 纪律)。
  uint32 role_id = 1;
}

message SelectRoleResponse {
  pandora.common.v1.ErrCode code = 1;
  // hub_ds_addr / hub_ticket: 选角确认后进大厅的"当前有效"地址 + 全新一次性票据
  // (票据 claim 含 role_id;经 hub_allocator.AssignHub,幂等自愈,同 IssueDSTicketResponse.hub_ds_addr 语义)。
  string hub_ds_addr = 2;
  string hub_ticket  = 3;
}
